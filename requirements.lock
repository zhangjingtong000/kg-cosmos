# KG Cosmos — 精确依赖锁（2026-09-12 冻结）
#
# 为什么要有这个文件：原来的 requirements.txt 只写了 `fastapi>=0.115` 这样的
# 下界，而实际代码用到了 12 个包（pytest / transformers / torch / websocket-client /
# rapidfuzz / scikit-learn / krippendorff / scipy / numpy / pydantic …）一个都没声明。
# 别人拿到仓库按 requirements.txt 装，跑不起测试、也跑不起 L5 判别器。
#
# 分层说明：
#   [核心] 起服务与跑管线必需
#   [评测] 六层指标、一致性统计、结构审计必需
#   [判别] L5 本地 Triplet Critic 必需（torch 需按显卡选 CUDA 版本）
#   [验证] 自动化验证脚本必需（CDP 驱动无头 Chrome）
#   [采集] 抓取/本地化第三方前端资源时用（离线化脚本）

