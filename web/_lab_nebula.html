<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星云渲染实验台</title>
<!--
  独立的渲染实验台：只做一件事——把"知识图谱"渲成一张好看的星云。
  ─────────────────────────────────────────────────────────────────────
  上一版失败在渲染太朴素：18780 个 1px 暗点 + 5000 根细线铺在近黑底上，
  看上去就是一团噪点，没有任何"体量感"。

  这一版换三件事：
    ① **Bloom 后处理**（UnrealBloomPass）：让亮部真的"发晕"，
       这是"发光"与"亮点"的分界线；
    ② **每个点画成柔和光斑而不是像素**：用柔和的径向衰减 + 加色叠加，
       密集处自然融成云气；
    ③ **按社区着色而非按类型**：60 个社区各有自己的色调，
       星云因此有"区域"，而不是均匀的蓝雾。

  配色不用纯蓝：参考深空摄影——冷蓝底、暖金核心、青绿过渡。
  ═══════════════════════════════════════════════════════════════════════
-->
<style>
  html,body{margin:0;background:#010206;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:12px;top:10px;color:#6f8cba;font:11px/1.6 ui-monospace,monospace;
       z-index:9;pointer-events:none;text-shadow:0 0 8px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>

<script type="importmap">
{ "imports": {
  "three": "./lib/three/build/three.module.js",
  "three/addons/": "./lib/three/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const q = new URLSearchParams(location.search);
const BLOOM   = parseFloat(q.get('bloom') ?? '0.85');   // 晕的强度
const RADIUS  = parseFloat(q.get('radius') ?? '2.6');   // 光斑半径（px 基准）
const BRIGHT  = parseFloat(q.get('bright') ?? '1.0');   // 整体亮度
const SWIRL   = parseFloat(q.get('swirl') ?? '1.0');    // 螺旋缠绕强度
const MODE    = q.get('mode') ?? 'community';           // community | type | mono
const DIST    = parseFloat(q.get('dist') ?? '2.9');     // 相机距离倍数（越小越近）
const WHITE   = parseFloat(q.get('white') ?? '0.22');   // 枢纽混白比例（过高会糊成白球）
const DUST    = parseFloat(q.get('dust') ?? '0.30');    // 暗尘比例（模拟暗带，制造层次）
const FALL    = parseFloat(q.get('fall') ?? '0.55');    // 光斑衰减陡峭度
const YFLAT   = parseFloat(q.get('yflat') ?? '0.30');   // Y 轴压扁（盘状感）

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, alpha:false});
renderer.setClearColor(0x010206, 1);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 1, 60000);
const world = new THREE.Group();
scene.add(world);

/* ── 60 个社区用的调色板：深空摄影的色温层次，不是纯蓝 ── */
const COMM_PALETTE = [
  0x6fa8ff, 0x9d7bff, 0x66e0c8, 0xffb066, 0xff7ea8, 0x7fd8ff,
  0xb8ff7a, 0xffd166, 0x8f9cff, 0x5fd0a8, 0xff9a6b, 0xa8b8ff,
  0x74e6ff, 0xd18cff, 0xffe08a, 0x7fffd4, 0xff8fb0, 0x9fd0ff,
  0xc0a8ff, 0x88e0a0
];
function commColor(c, total){
  // 用社区 id 的黄金角散布取值，保证相邻社区颜色不撞
  const i = Math.abs((c * 7 + 3) % COMM_PALETTE.length);
  const base = new THREE.Color(COMM_PALETTE[i]);
  // 再按社区序号做轻微色相偏移，避免 60 个社区只有 20 种颜色
  const hsl = {}; base.getHSL(hsl);
  base.setHSL((hsl.h + (c / Math.max(1, total)) * 0.12) % 1,
              Math.min(1, hsl.s * 1.05), hsl.l * 1.05);
  return base;
}

const hud = document.getElementById('hud');

fetch('./kg-data/nebula.json')
  .then(r => r.json())
  .then(build)
  .catch(e => { hud.textContent = '数据加载失败: ' + e.message; });

function build(D){
  const nodes = D.nodes || [];
  const comms = D.communities || [];
  const colors = D.type_colors || {};
  const N = nodes.length;
  const typeNames = Object.keys(colors);
  const tIdx = {}; typeNames.forEach((t,i) => tIdx[t] = i);

  /* 世界尺度：把坐标压到观察距离内 */
  let cx=0, cy=0, cz=0;
  for(const n of nodes){ cx+=n.x; cy+=n.y; cz+=n.z; }
  cx/=N; cy/=N; cz/=N;
  const S = 1.0;

  const pos = new Float32Array(N*3);
  const col = new Float32Array(N*3);
  const seed = new Float32Array(N);
  const wgt = new Float32Array(N);
  let maxD = 1;
  for(const n of nodes) maxD = Math.max(maxD, n.d || 1);

  const tmp = new THREE.Color();
  // 社区中心：先把每个社区的中心算出来，用于"按社区聚拢 + 分区"
  const commCenter = new Map();
  for(const n of nodes){
    const c = n.c ?? 0;
    let v = commCenter.get(c);
    if(!v){ v = {x:0,y:0,z:0,n:0}; commCenter.set(c, v); }
    v.x += n.x; v.y += n.y; v.z += n.z; v.n++;
  }

  for(let i=0;i<N;i++){
    const n = nodes[i];
    let x = (n.x - cx) * S, y = (n.y - cy) * S, z = (n.z - cz) * S;
    // 螺旋缠绕：按到中心的距离给一个绕 Y 的额外旋转，
    // 让原本"球状散点"出现旋臂结构（星云感的关键）
    const r = Math.hypot(x, z);
    const a = (r / 1500) * SWIRL * 0.55;
    const ca = Math.cos(a), sa = Math.sin(a);
    const x2 = x * ca - z * sa, z2 = x * sa + z * ca;
    pos[i*3] = x2; pos[i*3+1] = y * (1 - YFLAT); pos[i*3+2] = z2;

    if(MODE === 'mono'){ tmp.set(0x9fc4ff); }
    else if(MODE === 'type'){ tmp.set(colors[n.t] || '#8fb6ff'); }
    else { tmp.copy(commColor(n.c ?? 0, comms.length)); }
    // 枢纽混白：比例由 WHITE 控。上一版 0.55 太高，中心糊成一团白。
    const dnorm = Math.pow((n.d || 1) / maxD, 0.5);
    tmp.lerp(new THREE.Color(0xfff2dd), dnorm * WHITE);
    col[i*3] = tmp.r; col[i*3+1] = tmp.g; col[i*3+2] = tmp.b;

    seed[i] = Math.random();
    // 大小/亮度按度数拉开档次
    let w = 0.30 + Math.pow((n.d || 1) / maxD, 0.30) * 1.35;
    // 暗尘：随机把一部分点压暗，制造暗带与层次
    // （均匀亮度的点云看上去是"沙子"，有明暗才有"云"的感觉）
    if(Math.random() < DUST) w *= 0.18 + Math.random() * 0.22;
    wgt[i] = w;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSeed',    new THREE.BufferAttribute(seed, 1));
  g.setAttribute('aWeight',  new THREE.BufferAttribute(wgt, 1));

  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{
      uPix:{value: renderer.getPixelRatio()},
      uTime:{value:0}, uRadius:{value:RADIUS}, uBright:{value:BRIGHT}, uFall:{value:FALL}
    },
    vertexShader:`
      attribute vec3 aColor; attribute float aSeed; attribute float aWeight;
      uniform float uPix, uTime, uRadius, uFall;
      varying vec3 vC; varying float vA;
      void main(){
        vC = aColor;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        // 细微闪烁：幅度很小，只是让画面"活着"，不喧宾夺主
        float tw = 0.9 + 0.1 * sin(uTime * 0.9 + aSeed * 6.2831);
        vA = aWeight * tw;
        // 透视衰减：远处的点变小变暗，产生纵深
        float dist = -mv.z;
        float persp = clamp(2400.0 / max(400.0, dist), 0.28, 1.6);
        gl_PointSize = uRadius * uPix * (0.5 + aWeight) * persp;
      }`,
    fragmentShader:`
      varying vec3 vC; varying float vA;
      uniform float uBright; uniform float uFall;
      void main(){
        vec2 d = gl_PointCoord - 0.5;
        float r = length(d) * 2.0;          // 0 中心 → 1 边缘
        if(r > 1.0) discard;
        // 三层衰减：核心很亮、中段柔和、外缘极淡 —— 像真光斑
        float core = pow(1.0 - r, 1.0 + uFall * 4.5);
        float halo = pow(1.0 - r, 0.9) * 0.34;
        float a = (core + halo) * vA * uBright;
        gl_FragColor = vec4(mix(vC, vec3(1.0), core * 0.75), a);
      }`
  });
  world.add(new THREE.Points(g, mat));

  /* 社区核心：一团更柔的大光晕，作为"引力核" */
  const tex = (() => {
    const s = 256, cv = document.createElement('canvas');
    cv.width = cv.height = s;
    const c2 = cv.getContext('2d');
    const gr = c2.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
    gr.addColorStop(0,   'rgba(255,246,232,.95)');
    gr.addColorStop(0.18,'rgba(200,220,255,.42)');
    gr.addColorStop(0.5, 'rgba(150,190,255,.12)');
    gr.addColorStop(1,   'rgba(120,160,255,0)');
    c2.fillStyle = gr; c2.fillRect(0,0,s,s);
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  })();
  const cores = [];
  comms.forEach(cm => {
    const c = cm.center || [0,0,0];
    const cc = commColor(cm.id ?? 0, comms.length);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map:tex, color:cc, transparent:true, depthWrite:false,
      blending:THREE.AdditiveBlending, opacity:0.30
    }));
    sp.position.set((c[0]-cx)*S, (c[1]-cy)*S*0.78, (c[2]-cz)*S);
    const rad = Math.max(120, (cm.radius || 200) * 1.1);
    sp.scale.set(rad, rad, 1);
    world.add(sp); cores.push(sp);
  });

  /* ── 相机 ── */
  function resize(){
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    composer.setSize(w, h);
  }

  /* ── 后处理：Bloom 是"发光"的关键 ── */
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight),
                                    BLOOM, 0.72, 0.22);   // strength, radius, threshold
  composer.addPass(bloom);

  /* 视角：稍微俯视，符合"从飞船舷窗看出去"的直觉 */
  const CAMZ = 5200 * DIST;
  camera.position.set(0, CAMZ * 0.22, CAMZ);
  camera.lookAt(0, 0, 0);
  resize();
  addEventListener('resize', resize);

  let t0 = performance.now();
  (function loop(){
    const t = (performance.now() - t0) / 1000;
    mat.uniforms.uTime.value = t;
    world.rotation.y = t * 0.035;
    cores.forEach((s, i) => {
      s.material.opacity = 0.26 + 0.08 * Math.sin(t * 0.7 + i);
    });
    composer.render();
    requestAnimationFrame(loop);
  })();

  window.__ready = true;
  hud.textContent = `nodes=${N} comms=${comms.length} mode=${MODE} `
    + `bloom=${BLOOM} radius=${RADIUS} bright=${BRIGHT} swirl=${SWIRL}`;
}
</script>
</body>
</html>
