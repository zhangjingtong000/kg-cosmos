<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>官方 large-graph 示例 · 换成本项目 KG 数据</title>
<!-- 与 web/official-1-blocks.html（官方原样）逐字相同，
     仅把 jsonUrl 指向本项目数据，并把引入方式改成**本地 UMD**（见该文件的说明）。
     数据字段已对齐官方（id / user / description），因此示例代码一个字都没有改。 -->
<style>
  body { margin:0; background:#000; }
  #3d-graph { position:fixed; inset:0; }
</style>
<link rel="stylesheet" href="./lib/theme.css">
</head>
<body>
<div data-legacy-banner
     style="position:sticky;top:0;z-index:9999;background:#2a1d12;
            border-bottom:1px solid rgba(224,164,105,.55);color:#e8c9a4;
            padding:9px 16px;font:13px/1.6 -apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <b>⚠️ 这是历史版本，不是正式入口。</b>
  正式入口是 <a href="./index.html" style="color:#7cc0b6">index.html（导航页）</a> ——
  这一页保留下来是为了<b>备查迭代过程</b>，其中的数据与结论可能已经过期。
</div>

<div id="3d-graph"></div>
<script src="./lib/3d-force-graph.min.js"></script>
<script>
const elem = document.getElementById('3d-graph');

const Graph = new ForceGraph3D(elem)
  .jsonUrl('./kg-data/official-format-top1500.json')
  .nodeAutoColorBy('user')
  .nodeLabel(node => `${node.user}: ${node.description}`)
  .onNodeClick(node => window.open(`https://bl.ocks.org/${node.user}/${node.id}`, '_blank'));
</script>
</body>
</html>
