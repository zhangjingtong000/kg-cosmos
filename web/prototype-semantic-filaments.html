<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语义星云原型</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050914; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  .space { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  canvas { position: fixed; inset: 0; display: block; }
  .label { color: rgba(239,246,255,.9); font-size: 12px; letter-spacing: .025em; text-align: center; white-space: nowrap; pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,.95), 0 0 14px rgba(8,20,45,.9); }
  .label b { display: block; font-size: 13px; font-weight: 550; }
  .label small { display: block; margin-top: 4px; color: rgba(202,220,244,.58); font-size: 10px; }
  .header { position: fixed; inset: 28px auto auto 32px; z-index: 3; color: rgba(232,241,255,.88); pointer-events: none; }
  .header small { display: block; color: rgba(181,203,235,.54); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .header h1 { margin: 6px 0 0; font-size: 18px; font-weight: 520; letter-spacing: .04em; }
  .hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); color: rgba(203,219,246,.42); font-size: 11px; letter-spacing: .05em; pointer-events: none; }
  .status { position: fixed; left: 50%; top: 28px; transform: translate(-50%, -12px); color: rgba(236,245,255,.94); font-size: 13px; opacity: 0; transition: opacity .35s ease, transform .35s ease; pointer-events: none; text-shadow: 0 0 16px rgba(127,178,255,.65); }
  .status.visible { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<iframe class="space" title="深空背景" src="../assets/deep-space-galaxy.html?passive=1"></iframe>
<div class="header"><small>prototype · semantic overview</small><h1>知识宇宙网</h1></div>
<div class="status" id="status"></div>
<div class="hint">拖拽旋转 · 滚轮缩放 · 悬浮星云查看关联</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// PROTOTYPE: fixed data only. Real topic clusters and aggregate edges will replace this model later.
const clouds = [
  { id: 'transformer', name: 'Transformer architecture', summary: 'Attention and encoder-decoder structure', position: [-8, 2, 0], size: 2.2, color: '#d7a7ff', entityCount: 36 },
  { id: 'attention', name: 'Attention mechanisms', summary: 'Multi-head attention and alignment', position: [-1, 4, -2], size: 2.8, color: '#7ecbff', entityCount: 52 },
  { id: 'translation', name: 'Machine translation', summary: 'Translation tasks and benchmarks', position: [8, 1, 1], size: 2.0, color: '#ffd27a', entityCount: 28 },
  { id: 'evaluation', name: 'Evaluation', summary: 'Metrics and comparison baselines', position: [5, -5, -1], size: 1.6, color: '#a7e3b5', entityCount: 18 },
  { id: 'sequence', name: 'Sequence modelling', summary: 'Recurrent and convolutional alternatives', position: [-7, -5, 2], size: 1.9, color: '#f3a6b9', entityCount: 31 }
];
const links = [
  { source: 'transformer', target: 'attention', strength: 'strong', relationCount: 19 },
  { source: 'attention', target: 'translation', strength: 'strong', relationCount: 15 },
  { source: 'attention', target: 'evaluation', strength: 'medium', relationCount: 8 },
  { source: 'transformer', target: 'sequence', strength: 'medium', relationCount: 7 },
  { source: 'sequence', target: 'evaluation', strength: 'weak', relationCount: 3 },
  { source: 'translation', target: 'evaluation', strength: 'weak', relationCount: 2 }
];

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 1.5, 25);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:2;';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 12;
controls.maxDistance = 42;
controls.target.set(0, 0, 0);

scene.add(new THREE.AmbientLight('#8aa8d8', 1.35));
const rimLight = new THREE.PointLight('#b8d8ff', 24, 40); rimLight.position.set(-4, 8, 8); scene.add(rimLight);
const warmLight = new THREE.PointLight('#ffca8a', 14, 35); warmLight.position.set(10, -5, 6); scene.add(warmLight);

const cloudById = new Map();
const cloudObjects = [];
function seeded(seed) { let state = seed >>> 0; return () => ((state = (state * 1664525 + 1013904223) >>> 0) / 4294967296); }
function createCloud(cloud, index) {
  const random = seeded(320 + index);
  const group = new THREE.Group();
  const color = new THREE.Color(cloud.color);
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(cloud.size * 0.28, 32, 32),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: .65, transparent: true, opacity: .9, roughness: .35, metalness: .15 })
  );
  core.userData.cloudId = cloud.id;
  group.add(core);
  const points = new Float32Array(220 * 3);
  for (let i = 0; i < 220; i++) {
    const radius = cloud.size * (.23 + Math.pow(random(), .55) * .78);
    const theta = random() * Math.PI * 2, phi = Math.acos(1 - random() * 2);
    points[i * 3] = Math.sin(phi) * Math.cos(theta) * radius;
    points[i * 3 + 1] = Math.cos(phi) * radius * .66;
    points[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * radius;
  }
  const stars = new THREE.BufferGeometry();
  stars.setAttribute('position', new THREE.BufferAttribute(points, 3));
  group.add(new THREE.Points(stars, new THREE.PointsMaterial({ color, size: .075, transparent: true, opacity: .76, depthWrite: false, blending: THREE.AdditiveBlending })));
  const halo = new THREE.Mesh(new THREE.SphereGeometry(cloud.size * .72, 24, 24), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .08, depthWrite: false, blending: THREE.AdditiveBlending }));
  group.add(halo);
  group.position.fromArray(cloud.position);

  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `<b>${cloud.name}</b><small>${cloud.entityCount} entities</small>`;
  const labelObject = new CSS2DObject(label);
  labelObject.position.set(0, cloud.size * .92, 0);
  group.add(labelObject);

  scene.add(group);
  const item = { cloud, group, core, halo, label };
  cloudById.set(cloud.id, item);
  cloudObjects.push(item);
}
clouds.forEach(createCloud);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
