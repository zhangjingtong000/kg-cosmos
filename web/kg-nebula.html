// ── 清空内部图层 ──
function clearOverlay() {
  while (overlay.children.length) {
    const o = overlay.children.pop();
    o.traverse?.(c => {
      // CSS2DObject 的 DOM 元素必须手动移除。CSS2DRenderer 只会遍历仍在
      // 场景树里的对象去更新 element.style；对象一旦被 remove，它的 DOM
      // 就永久留在页面上，而且不再跟随节点移动——反复进出社区后，同一段
      // 文字会出现在好几处且位置错乱（实测）。
      if (c.isCSS2DObject && c.element && c.element.parentNode) {
        c.element.parentNode.removeChild(c.element);
      }
      if (c.geometry) c.geometry.dispose?.();
      if (c.material) {
        if (Array.isArray(c.material)) c.material.forEach(m => m.dispose?.());
        else c.material.dispose?.();
      }
    });
    overlay.remove(o);
  }
  overlay.userData = {};
}

/**
 * 内部视图的标签分配与避让。
 *
 * 每 5 帧执行一次（每帧做会因强制 reflow 拖慢渲染）：
 *   1. 按缩放级别算标签预算——相机越靠近社区中心给得越多（约 6 ~ 52 个）；
 *   2. 对全部节点算屏幕位置与权重（社区内度数 × 靠近视野中心的程度）；
 *   3. 按权重排序，把标签池里的 DOM 依次分配出去；
 *   4. 逐个做矩形碰撞检测，重叠的跳过（且不消耗槽位）。
 *
 * 这样外围节点只要被放大到视野中心同样能拿到标签，缩小时标签自动收敛；
 * 悬浮或选中的节点权重加满，一定显示。
 */
const _labelVec = new THREE.Vector3();

// 节点级标签门槛（像素）：屏幕半径小于它就不给标签。
//
// 取值依据是**实测**而不是估计：进入社区 0（1023 个节点、半径约 177 世界单位、
// 相机距离约 R*1.9）后，着色器算出的 gl_PointSize 换回半径大致落在 6~17px，
// 其中度数中位数为 1 的节点约 6px、枢纽节点约 16px。
// 所以门槛取 **8px**：正好把"度数低、在屏幕上只是个小点"的那批筛掉，
// 又不会误伤枢纽。最初按直觉写了 2.6px，实测 1023/1023 全部通过门槛，
// 等于没设——这类"看起来合理"的常量必须用实测数据校准。
const LABEL_MIN_SCREEN_R = 8.0;

function layoutInnerLabels() {
  const ud = overlay.userData;
  const labels = ud && ud.labels;
  const data = ud && ud.data;
  if (!labels || !labels.length || !data || inside === null) return;

  const cx = innerWidth / 2, cy = innerHeight / 2;

  // ① 标签预算（上限）：相机到社区中心的距离相对于社区半径。
  //    注意它现在只是**上限**，不再是主要门槛——见下面 ②b 的节点级门槛。
  const rel = camera.position.distanceTo(ud.center) / Math.max(1e-3, ud.radius);
  const zoomT = Math.min(1, Math.max(0, (3.2 - rel) / 2.6));
  const budget = Math.round(6 + zoomT * 46);

  // ② 给全部节点打分
  let maxDeg = 1;
  for (const n of data.nodes) if ((n.d || 0) > maxDeg) maxDeg = n.d;
  const logMax = Math.log(1 + maxDeg);

  // ②b 节点级屏幕尺寸门槛。
  //
  // 旧做法只看"相机离社区中心多远"这个**全局档位**来决定发多少标签，
  // 粒度太粗：同一个档位下，外围节点已经在屏幕上小到看不清却仍能拿标签，
  // 而核心节点再大也只是排在预算内。InfraNodus 的做法是把门槛落在
  // **单个节点的屏幕尺寸**上（sigma.js 的 `labelThreshold` 就是节点屏幕半径），
  // 这里照此实现。
  //
  // 屏幕半径与实体点着色器**同源**：着色器是
  // `gl_PointSize = aSize * (uScale / -mv.z)`，所以直接读 aSize 属性数组，
  // 而不是另算一遍归一化度数——那样在切换 Ranking 维度后就会与画面不一致。
  const aSizeAttr = ud.pts && ud.pts.geometry && ud.pts.geometry.attributes.aSize;
  const aSizeArr = aSizeAttr ? aSizeAttr.array : null;
  const uScale = innerHeight * 1.5;          // 与进入社区时写入 uniforms.uScale 的值一致
  const forced = hoverNodeIdx >= 0 ? hoverNodeIdx : selectedNodeIdx;

  const cands = [];
  const _wp = new THREE.Vector3();
  for (let i = 0; i < data.nodes.length; i++) {
    const n = data.nodes[i];
    _wp.set(ud.center.x + n.x, ud.center.y + n.y, ud.center.z + n.z);
    _labelVec.copy(_wp).project(camera);
    if (_labelVec.z > 1 || _labelVec.z < -1) continue;
    const sx = (_labelVec.x * .5 + .5) * innerWidth;
    const sy = (-_labelVec.y * .5 + .5) * innerHeight;
    if (sx < -90 || sx > innerWidth + 90 || sy < -50 || sy > innerHeight + 50) continue;

    // ②b 节点级门槛：屏幕半径（像素）低于阈值就完全没有资格，
    //     悬浮/选中的节点例外（forced 加 10 分保证它排在前面）。
    if (aSizeArr && i !== forced) {
      const screenR = 0.5 * aSizeArr[i] * uScale / Math.max(1e-3, camera.position.distanceTo(_wp));
      if (screenR < LABEL_MIN_SCREEN_R) continue;
    }

    const dx = (sx - cx) / innerWidth, dy = (sy - cy) / innerHeight;
    const centerScore = Math.max(0, 1 - Math.hypot(dx, dy) * 1.7);
    const degScore = Math.log(1 + (n.d || 0)) / logMax;
    cands.push({
      i, sx, sy,
      w: (0.30 + 0.70 * degScore) * (0.22 + 0.78 * centerScore) + (i === forced ? 10 : 0),
    });
  }
  cands.sort((a, b) => b.w - a.w);

  // ③ 分配 DOM  ④ 碰撞避让
  const placed = [];
  let slot = 0;
  for (const c of cands) {
    const item = labels[slot];
    if (!item) break;
    const isForced = c.i === forced;
    if (!isForced && slot >= budget) break;

    const n = data.nodes[c.i];
    const text = String(n.id);
    if (item.text !== text) {          // 只在内容变化时改 DOM，避免无谓 reflow
      item.object.element.innerHTML = `<b>${escHtml(text)}</b>`;
      item.text = text;
    }
    item.object.position.set(ud.center.x + n.x, ud.center.y + n.y + 2.4, ud.center.z + n.z);
    item.object.visible = true;
    item.object.element.style.visibility = 'visible';
    item.nodeIdx = c.i;

    const w = item.object.element.offsetWidth || 90;
    const h = item.object.element.offsetHeight || 16;
    const box = { x: c.sx - w / 2, y: c.sy - h / 2, w, h };
    let hit = false;
    for (const q of placed) {
      if (box.x < q.x + q.w && box.x + box.w > q.x &&
          box.y < q.y + q.h && box.y + box.h > q.y) { hit = true; break; }
    }
    if (hit) {
      item.object.visible = false;
      item.nodeIdx = -1;
      continue;                        // 槽位不消耗，留给下一个候选
    }
    placed.push(box);
    slot++;
  }
  for (let k = slot; k < labels.length; k++) {
    labels[k].object.visible = false;
    labels[k].nodeIdx = -1;
  }
}

// ── 实体列表与搜索 ──
// 列表按社区内度数降序。点击某项：高亮环定位到该实体、相机对准它、右侧面板
// 列出它的关系；搜索框按名称子串过滤。
const sideEl = document.getElementById('side');
const searchEl = document.getElementById('search');
const listEl = document.getElementById('list');
let selectedNodeIdx = -1;
let evidenceTable = null;   // 当前社区的证据索引（实体名 → 出处列表）

function escHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function innerListHtml(filter) {
  const ud = overlay.userData;
  const data = ud && ud.data;
  if (!data) return '';
  const q = (filter || '').trim().toLowerCase();
  // 不再截断。原来卡在 400 项，最大的社区（1104 个实体）里后 700 个除非
  // 搜索命中就永远点不到；而且要让"在三维画面里点节点"也能滚到列表对应项，
  // 必须保证每一项都在列表里。
  const items = data.nodes
    .map((n, i) => ({ n, i }))
    .sort((a, b) => (b.n.d || 0) - (a.n.d || 0))
    .filter(x => !q || String(x.n.id).toLowerCase().includes(q));
  if (!items.length) {
    return '<div class="empty"><b>没有匹配的实体</b>换个更短的关键词试试</div>';
  }
  return items.map(x =>
    `<div class="item${x.i === selectedNodeIdx ? ' sel' : ''}" data-i="${x.i}">` +
    `<span class="nm">${escHtml(x.n.id)}</span>` +
    `<span class="dg">${x.n.d || 0}</span></div>`).join('');
}

function refreshInnerList() {
  listEl.innerHTML = innerListHtml(searchEl.value);
  document.body.classList.toggle('hasQuery', Boolean(searchEl.value));
}

/** 把列表滚动到某个实体并确保可见（在三维画面里点击节点时同步列表）。 */
function scrollListToNode(i) {
  let el = listEl.querySelector(`.item[data-i="${i}"]`);
  if (!el && searchEl.value) {       // 可能被搜索过滤掉了，清掉搜索再找
    searchEl.value = '';
    refreshInnerList();
    el = listEl.querySelector(`.item[data-i="${i}"]`);
  }
  if (el) el.scrollIntoView({ block: 'nearest' });
}

/**
 * 选中某个实体：放大光晕、对准相机、显示关系、列表标选中。
 * 再次点击同一个实体则取消选中。
 */
function selectNode(i) {
  const ud = overlay.userData;
  const n = ud && ud.data && ud.data.nodes[i];
  if (!n) return;

  if (i === selectedNodeIdx) {     // 重复点击同一个 → 取消标注
    clearSelection();
    return;
  }

  selectedNodeIdx = i;
  if (ud.halo) {
    ud.halo.position.set(ud.center.x + n.x, ud.center.y + n.y, ud.center.z + n.z);
    ud.halo.visible = true;
    haloAnim = { t0: performance.now(), dur: 460, base: 46, material: ud.halo.material };
  }
  // 视线平滑对准该实体。直接 set 会让画面瞬移，点完不知道视线跑哪去了；
  // from 取当前值，所以连续点击不同节点时也不会跳。
  targetAnim = {
    from: controls.target.clone(),
    to: new THREE.Vector3(ud.center.x + n.x, ud.center.y + n.y, ud.center.z + n.z),
    t0: performance.now(), dur: 260,
  };
  renderInnerPreview(i);
  [...listEl.querySelectorAll('.item')].forEach(el =>
    el.classList.toggle('sel', +el.dataset.i === i));
}

/** 取消选中：隐藏光晕、收起关系面板、清掉列表选中态，视线保持不动。 */
function clearSelection() {
  selectedNodeIdx = -1;
  haloAnim = null;
  const ud = overlay.userData;
  if (ud && ud.halo) {
    ud.halo.visible = false;
    ud.halo.material.uniforms.uOpacity.value = 0;
  }
  hidePreview();
  [...listEl.querySelectorAll('.item')].forEach(el => el.classList.remove('sel'));
}

listEl.addEventListener('click', (e) => {
  const item = e.target.closest('.item');
  if (item) selectNode(+item.dataset.i);
});
searchEl.addEventListener('input', refreshInnerList);
document.getElementById('searchClear').addEventListener('click', () => {
  searchEl.value = '';
  refreshInnerList();
  searchEl.focus();
});

// ══════════════════════════════════════════════════════════════
// 统一着色引擎（T6.4）
//
// 着色 = Partition（离散分区，决定基色）× Ranking（连续排序，决定基色
// 向白插值的量）。两个维度正交、各自可切换，图例同时展示这两件事——
// 否则用户看不出"这个颜色现在代表什么"。
//
// 【为什么默认值必须与改造前逐字等价】
//   改造前内部实体云就是 `社区色.lerp(白, 0.16 + 0.62 × 度数归一)`。
//   引擎默认取 partition='community'、ranking='degree'，公式与它完全一致，
//   因此引入引擎**不改变默认外观**；只有用户主动切换后才出现新配色。
//   这样引擎是纯增量，不会让已验收的视觉效果发生位移。
//
// 【为什么 Partition 必须提供"类型"】
//   数据里每个节点都带 `t`（15 类实体类型），但改造前**完全没有用到**——
//   整个社区内部是一色渐变，分不出方法/人物/数据集。
//   类型是这张图里信息量最大的离散维度，理应可见。
//
// 回归检查：tools/cdp_verify_color.py
// ══════════════════════════════════════════════════════════════
const TYPE_COLORS = {
  /* 与 pathqa.html 一致（2026-09 统一）。旧值是 15 个 HSL 亮度 75%、饱和度 100%
     的荧光色，在深底上互相打架，正是"全是蓝紫 / 很丑"的直接来源。
     新板从同一条「金 → 青」色相带上派生，饱和度压到 35–50%，
     并按语义族归并：方法/工具/制品/组件/系统落在暖端，概念/过程/事件在中段，
     度量/数据集在青端，只有 Document/Location 用低饱和雾蓝。 */
  Method: '#e3b878', Tool: '#d8a869', Artifact: '#c9975f',
  Component: '#bd8659', System: '#b0765f',
  Person: '#cc8288', Organization: '#b1727f',
  Concept: '#9c8bb0', Process: '#8d84a8', Event: '#a68fa8',
  Metric: '#7aa9a4', Dataset: '#719c92',
  Document: '#7c8fae', Location: '#7084a0',
  Material: '#8b8f9c',
};
const TYPE_FALLBACK = '#bdbfc5';

const colorMode = { partition: 'community', ranking: 'degree' };

/** 排序值归一化到 [0,1]，供亮度插值使用。 */
function rankT(n, ranking, maxD, maxR) {
  if (ranking === 'degree') return Math.pow((n.d || 1) / maxD, 0.6);
  if (ranking === 'pagerank') return Math.pow((n.r || 0) / maxR, 0.6);
  return 0.5;                        // 'none'：关闭排序维度，亮度取中值
}

/** 核心：给定节点集与着色模式，算出颜色与尺寸两个数组。 */
function computeNodeStyle(nodes, data, partition, ranking) {
  const base = new THREE.Color(data.color);
  const white = new THREE.Color('#ffffff');
  let maxD = 1, maxR = 1e-12;
  for (const n of nodes) {
    if ((n.d || 1) > maxD) maxD = n.d || 1;
    if ((n.r || 0) > maxR) maxR = n.r || 0;
  }
  const col = new Float32Array(nodes.length * 3);
  const siz = new Float32Array(nodes.length);
  const cache = new Map();           // 同一分区复用 THREE.Color，避免每节点 new
  nodes.forEach((n, k) => {
    const t = rankT(n, ranking, maxD, maxR);
    let b;
    if (partition === 'type') {
      const hex = TYPE_COLORS[n.t] || TYPE_FALLBACK;
      b = cache.get(hex);
      if (!b) { b = new THREE.Color(hex); cache.set(hex, b); }
    } else {
      b = base;
    }
    const cc = b.clone().lerp(white, 0.16 + 0.62 * t);
    col[k * 3] = cc.r; col[k * 3 + 1] = cc.g; col[k * 3 + 2] = cc.b;
    siz[k] = 1.5 + 7.5 * t;
  });
  return { col, siz };
}

/** 图例条目：分区 → (标签, 数量, 基色)，按数量降序。 */
function legendEntries(nodes, partition, data) {
  if (partition === 'type') {
    const cnt = new Map();
    for (const n of nodes) cnt.set(n.t, (cnt.get(n.t) || 0) + 1);
    return [...cnt.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([t, n]) => ({ label: t, n, color: TYPE_COLORS[t] || TYPE_FALLBACK }));
  }
  // 'community'：内部视图里只有一个社区，图例退化为单项
  return [{ label: data.name || '本社区', n: nodes.length, color: data.color }];
}

const legendEl = document.getElementById('legend');

function renderLegend() {
  const ud = overlay.userData;
  if (!ud || !ud.data || !ud.pts || inside === null) { legendEl.innerHTML = ''; return; }
  const nodes = ud.data.nodes;
  const entries = legendEntries(nodes, colorMode.partition, ud.data);
  const maxN = entries.length ? entries[0].n : 1;

  const btn = (group, val, text) =>
    `<button type="button" data-group="${group}" data-val="${val}"` +
    `${colorMode[group] === val ? ' class="on"' : ''}>${text}</button>`;

  // 排序色带：把基色按亮度公式铺成渐变，让"越亮 = 排名越高"直接可见。
  // 类型分区没有单一基色，退而用**最高频类型**的色（列表首项）作代表，
  // 中性灰白会让人误以为色带与分区无关。
  let ramp = '';
  if (colorMode.ranking !== 'none') {
    const baseCol = new THREE.Color(
      colorMode.partition === 'type'
        ? (entries[0] ? entries[0].color : TYPE_FALLBACK)
        : ud.data.color);
    const stops = [0, .25, .5, .75, 1].map(t =>
      '#' + baseCol.clone().lerp(new THREE.Color('#ffffff'), 0.16 + 0.62 * t).getHexString());
    ramp = `<div class="lg-ramp"><span>低</span>` +
           `<span class="bar" style="background:linear-gradient(90deg,${stops.join(',')})"></span>` +
           `<span>高</span></div>`;
  }

  legendEl.innerHTML =
    `<div class="lg-h">着色引擎</div>
     <div class="lg-row"><span class="lg-lab">分区</span><span class="seg">
       ${btn('partition', 'community', '社区')}${btn('partition', 'type', '类型')}</span></div>
     <div class="lg-row"><span class="lg-lab">排序</span><span class="seg">
       ${btn('ranking', 'degree', '度数')}${btn('ranking', 'pagerank', 'PR')}${btn('ranking', 'none', '无')}</span></div>
     <div class="lg-list">
       ${entries.map(e => `<div class="lg-item">
          <span class="lg-sw" style="background:${e.color};color:${e.color}"></span>
          <span class="lg-nm">${escHtml(String(e.label))}</span>
          <span class="lg-bar"><i style="width:${Math.max(4, Math.round(100 * e.n / maxN))}%;background:${e.color}"></i></span>
          <span class="lg-n">${e.n}</span></div>`).join('')}
     </div>
     ${ramp}
     <div class="lg-note">${colorMode.ranking === 'none'
        ? '排序已关闭，亮度统一'
        : `亮度 = ${colorMode.ranking === 'pagerank' ? 'PageRank' : '度数'}归一（越亮越高）`}
       · 点大小同源${entries.some(e => e.label === 'Unknown')
        ? '<br><b style="color:#8b95a8">Unknown</b> = 从边反建、类型未知的端点'
        : ''}</div>`;

  legendEl.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      colorMode[b.dataset.group] = b.dataset.val;
      applyColorMode();
    });
  });
}

/** 把当前着色模式应用到已存在的点云上（只更新缓冲，不重建几何）。 */
function applyColorMode() {
  const ud = overlay.userData;
  if (!ud || !ud.pts || !ud.data) return;
  const { col, siz } = computeNodeStyle(ud.data.nodes, ud.data,
                                        colorMode.partition, colorMode.ranking);
  const g = ud.pts.geometry;
  g.attributes.color.array.set(col);
  g.attributes.color.needsUpdate = true;
  g.attributes.aSize.array.set(siz);
  g.attributes.aSize.needsUpdate = true;
  renderLegend();
}

// ── 渲染社区内部（实体点 + 内部边 + 核心标签）──
async function enterCommunity(ci, preloaded) {
  const cloud = clouds[ci];
  status.textContent = `正在进入「${cloud.name}」…`;
  status.classList.add('visible');
  let data = preloaded || null;
  if (!data) {
    try {
      data = await KGData.kg(COMM_URL(ci));
    } catch (e) {
      status.textContent = `社区 ${ci} 内部数据加载失败：${e.message}`;
      return;
    }
  }
  clearOverlay();
  inside = ci;         // 供标签分配与 hover 判断；?c=N 直入时原本没人设置它
  // insideActive 原来从声明起就永远是 false（原型遗留，没人给它赋值），
  // 于是 updateHoverState() 里的 `group.visible = !insideActive` 恒为 true：
  // 进入社区后鼠标一移动，社区间的纤维就被重新显示出来。
  insideActive = true;

  const center = new THREE.Vector3().fromArray(cloud.position);
  const base = new THREE.Color(cloud.color);

  const R = data.meta.radius || 60;
  const dist = R * 1.9;
  // 放开 OrbitControls 的距离上限。原来 maxDistance 固定为 130，而社区半径
  // 可达 182.8，相机一进入就被硬拉回球体内部，看到的是密不透风的线网。
  controls.maxDistance = Math.max(130, dist * 1.7);

  // 实体点：**位置与样式分离**——位置在此处算，颜色与大小交给着色引擎。
  // 改造前是内联的 `度数^0.6 → 社区色 lerp 白`，现在该公式成为引擎的默认
  // 参数（partition='community' / ranking='degree'），数值逐字等价。
  const N = data.nodes.length;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const siz = new Float32Array(N);
  data.nodes.forEach((n, k) => {
    pos[k*3]   = center.x + n.x;
    pos[k*3+1] = center.y + n.y;
    pos[k*3+2] = center.z + n.z;
  });
  {
    const style = computeNodeStyle(data.nodes, data, colorMode.partition, colorMode.ranking);
    col.set(style.col);
    siz.set(style.siz);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true,
    uniforms: { uScale: { value: innerHeight * 1.5 } },
    // 【为什么要把 gl_PointSize 传给片元着色器】
    //   AdditiveBlending 下每个点都是**加色叠加**，而 aSize 随度数增长，
    //   于是度数最高的枢纽点面积最大、中心叠加次数最多 —— 结果是**枢纽节点
    //   糊成一团白斑**，恰好最看不清（对抗评审实测指出，且边/节点比 2.12
    //   本在合理范围，说明是渲染问题而非取样问题）。
    //   修法：让不透明度与点的屏幕尺寸**反相关**——点越大，单位面积的光越压低，
    //   保住边缘的发光轮廓，但中心不再过曝。小点（枢纽以外的多数节点）不受影响。
    vertexShader: `attribute float aSize; varying vec3 vColor; varying float vPS;
      uniform float uScale;
      void main(){ vColor=color; vec4 mv=modelViewMatrix*vec4(position,1.);
      gl_PointSize=aSize*(uScale/-mv.z); vPS=gl_PointSize;
      gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `varying vec3 vColor; varying float vPS;
      void main(){ vec2 d=gl_PointCoord-.5; float r=length(d); if(r>.5) discard;
      float core=smoothstep(.5,.05,r);
      // 140/(vPS+90)：vPS≈20（普通节点）时约 1.0，vPS≈200（枢纽）时约 0.48
      float dim=clamp(140.0/(vPS+90.0),0.42,1.0);
      gl_FragColor=vec4(vColor, core*.92*dim); }`,
  });

  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  overlay.add(pts);

  // 内部边：颜色偏暗，形成结构感
  const idx = new Map(data.nodes.map((n, k) => [n.id, k]));
  const ep = new Float32Array(data.edges.length * 6);
  const ec = new Float32Array(data.edges.length * 6);
  const ec0 = base.clone().multiplyScalar(0.5);
  // ── 「只看分歧」（2026-09-15 加，P7）─────────────────────────────────
  // `data.edges` 的元素是 `[source, target, type]`，而 `comm-*.json` 的 type
  // **在 2026-09-15 之前被硬编码成 `"RELATED"`**（build_community_details.py:145），
  // 所以这里以前根本没有可区分的信息。修好之后 `CONTRADICTS`（矛盾）才真正可见。
  const CONTRA = 'CONTRADICTS';
  const contraIdx = [];              // 哪些边是分歧边
  const ecDim = new Float32Array(data.edges.length * 6);   // 变暗态
  const ecHot = new Float32Array(data.edges.length * 6);   // 只显分歧态
  const HOT = new THREE.Color('#ff7a45');   // 暖橙：与页面的暖色灯光一致，且够醒目
  data.edges.forEach((e, k) => {
    const a = idx.get(e[0]), b = idx.get(e[1]);
    if (a === undefined || b === undefined) return;
    ep.set([pos[a*3],pos[a*3+1],pos[a*3+2],pos[b*3],pos[b*3+1],pos[b*3+2]], k*6);
    ec.set([ec0.r,ec0.g,ec0.b,ec0.r,ec0.g,ec0.b], k*6);
    ecDim.set([ec0.r,ec0.g,ec0.b,ec0.r,ec0.g,ec0.b], k*6);
    if (String(e[2] || '').toUpperCase() === CONTRA) {
      contraIdx.push(k);
      ecHot.set([HOT.r,HOT.g,HOT.b,HOT.r,HOT.g,HOT.b], k*6);
      // 分歧边在默认态就稍微亮一点 —— 否则"有分歧"这件事永远看不见
      ec.set([HOT.r*0.75,HOT.g*0.75,HOT.b*0.75,
              HOT.r*0.75,HOT.g*0.75,HOT.b*0.75], k*6);
    } else {
      ecHot.set([ec0.r*0.18,ec0.g*0.18,ec0.b*0.18,
                 ec0.r*0.18,ec0.g*0.18,ec0.b*0.18], k*6);
    }
  });
  const eg = new THREE.BufferGeometry();
  eg.setAttribute('position', new THREE.BufferAttribute(ep, 3));
  eg.setAttribute('color', new THREE.BufferAttribute(ec, 3));
  const em = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true,
    opacity: 0.30, blending: THREE.AdditiveBlending, depthWrite: false });
  const lines = new THREE.LineSegments(eg, em);
  lines.frustumCulled = false;
  overlay.add(lines);

  // ── 「只看分歧」开关 ──────────────────────────────────────────────────
  // 数据里没有 CONTRADICTS 时**隐藏按钮**（不给一个点了没反应的控件）。
  const contraBtn = document.getElementById('onlyContra');
  if (contraBtn) {
    let onlyContra = false;
    const nContra = contraIdx.length;
    contraBtn.hidden = nContra === 0;
    contraBtn.textContent = `⚠️ 只看分歧（${nContra}）`;
    contraBtn.setAttribute('aria-pressed', 'false');
    // 没数据时也把说明写进 title，免得用户以为是坏了
    contraBtn.title = nContra
      ? `只显示 ${nContra} 条 CONTRADICTS（矛盾）关系，其余变暗；再点恢复`
      : '本社区没有 CONTRADICTS（矛盾）关系';
    if (!contraBtn.dataset.bound) {          // 防重复绑定（可反复进入社区）
      contraBtn.dataset.bound = '1';
      contraBtn.addEventListener('click', () => {
        const st = overlay.userData.contra;
        if (!st) return;
        st.on = !st.on;
        const src = st.on ? st.hot : st.dim;
        st.attr.array.set(src);
        st.attr.needsUpdate = true;
        st.mat.opacity = st.on ? 0.85 : 0.30;
        contraBtn.setAttribute('aria-pressed', String(st.on));
        status.textContent = st.on
          ? `只看分歧：${st.n} 条 CONTRADICTS`
          : '已恢复全部关系';
        status.classList.add('visible');
        clearTimeout(contraBtn._t);
        contraBtn._t = setTimeout(() => status.classList.remove('visible'), 2000);
      });
    }
    // 状态存在 overlay.userData 上（社区切换时 overlay 会重建）
    overlay.userData.contra = {
      on: false, n: nContra, dim: ecDim, hot: ecHot,
      attr: eg.getAttribute('color'), mat: em,
    };
  }

  // 标签池：预建一批 CSS2DObject，由 layoutInnerLabels 每几帧重新分配给
  // "当前最该显示"的节点。
  //
  // 为什么不固定标注 Top-N：那样只有社区中心的枢纽有标签，外围节点即使被
  // 放大到眼前也不显示。改成动态分配后候选是全部节点——谁靠近视野中心、
  // 谁度数高，谁拿到标签；缩放越大预算越多。
  const LABEL_POOL = Math.min(150, data.nodes.length);
  const labelItems = [];
  for (let k = 0; k < LABEL_POOL; k++) {
    const el = document.createElement('div');
    el.className = 'label entity';
    el.style.fontSize = '11px';
    const o = new CSS2DObject(el);
    o.position.set(center.x, center.y, center.z);
    o.visible = false;
    overlay.add(o);
    labelItems.push({ object: o, nodeIdx: -1, text: '' });
  }

  // 选中光晕：环形 + 中心亮点的圆点。
  //
  // 原来用 PointsMaterial，它把点渲染成**正方形**——屏幕上就是一个白方块把
  // 节点框住，既不直观也不好看。这里改用自定义着色器画圆环，尺寸由 haloAnim
  // 驱动，点击时有一次"放大过冲再回落"的动画。
  const haloGeo = new THREE.BufferGeometry();
  haloGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3));
  const haloMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, depthTest: false,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uSize: { value: 0 },
      uOpacity: { value: 0 },
      uColor: { value: new THREE.Color(0xffffff) },
    },
    vertexShader: `uniform float uSize;
      void main(){ gl_PointSize = uSize;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform vec3 uColor; uniform float uOpacity;
      void main(){
        vec2 d = gl_PointCoord - .5; float r = length(d);
        if (r > .5) discard;
        // 外环：一圈清晰的光边；内核：中心亮点
        float ring = smoothstep(.50, .40, r) * smoothstep(.24, .34, r);
        float core = smoothstep(.15, .0, r);
        float a = (ring * .9 + core * .55) * uOpacity;
        if (a < .004) discard;
        gl_FragColor = vec4(uColor, a);
      }`,
  });
  const halo = new THREE.Points(haloGeo, haloMat);
  halo.visible = false;
  halo.frustumCulled = false;
  overlay.add(halo);

  overlay.userData = {
    center, radius: data.meta.radius || 60,
    data, nodeIndex: idx, labels: labelItems, pts, halo,
    // ⚠️ **必须在这里带上 `contra`**（2026-09-15，P7）——
    // 本行是**整体替换** `overlay.userData`，位置晚于上面那段
    // `overlay.userData.contra = {...}`，不带上的话它会被冲掉。
    // 第一版就是这个 bug：**按钮文字正确（24 条）、但点了没反应**
    // （`click` 回调里 `overlay.userData.contra` 是 undefined，直接 return）。
    // 教训：往一个"稍后会被整体替换"的对象上挂状态，必须在那次替换里带上。
    contra: overlay.userData.contra,
  };

  // 图例必须在此处刷新：它读 overlay.userData，而 userData 刚被赋值。
  renderLegend();

  // 概览层隐藏：按对象类型筛选更稳健（原型里没有名为 points 的全局变量，
  // 直接引用会抛 "points is not defined" 并中断 enterCommunity）。
  scene.children.forEach(o => {
    if (o === overlay || o.isCSS2DObject || o === renderer.domElement) return;
    const isOverview =
      (o.isPoints && !o.parent?.isGroup) ||
      (o.isLineSegments && !o.parent?.isGroup);
    if (isOverview) o.visible = false;
  });

  // 相机飞入（R / dist / maxDistance 已在上方算好）
  // 直接切到内部视角，不做飞入补间
  camera.position.set(center.x, center.y + R * 0.42, center.z + dist);
  controls.target.copy(center);
  controls.update();
  hintEl.textContent = '';
  status.classList.remove('visible');

  // 概览层淡出
  // 注意：CSS2DRenderer 的 renderObject 只检查对象自身的 visible，**不检查父级**，
  // 所以把 group 设为不可见并不能隐藏其中的 CSS2D 标签——必须逐个隐藏
  // labelObject，否则进入社区后概览层的社区名仍会浮在内部视图上面。
  cloudObjects.forEach(it => {
    it.group.visible = false;
    if (it.labelObject) it.labelObject.visible = false;
  });
  filamentObjects.forEach(it => { it.group.visible = false; });
  const _hideOverview = (v) => scene.children.forEach(o => {
    if (o === overlay || o.isCSS2DObject) return;
    if ((o.isPoints && !o.parent?.isGroup) || (o.isLineSegments && !o.parent?.isGroup))
      o.visible = v;
  });
  _hideOverview(false);

  innerHud.classList.add('on');
  document.body.classList.add('inside');
  document.getElementById('itName').textContent = cloud.name;
  document.getElementById('itName').style.color = cloud.color;
  // 显示数与总数相同时不必写两遍
  const shownN = data.meta.shown, totalN = data.entityCount;
  const cntText = shownN === totalN ? `${totalN} 个实体` : `${shownN} / ${totalN} 个实体`;
  document.getElementById('itSub').textContent =
    `${cntText} · ${data.meta.edges} 条内部关系`;

  // 刷新实体列表；选中态属于上一个社区，这里清空
  selectedNodeIdx = -1;
  searchEl.value = '';
  refreshInnerList();

  // 证据表放在最后加载：它带 await，若放在相机落位之前，会重新引入
  // "概览已隐藏、相机未落位"的中间态。加载失败只是少一段证据，不影响主流程。
  evidenceTable = null;
  try {
    const er = await fetch(new URL(`./kg-data/evidence-${ci}.json`, location.href).href);
    if (er.ok) evidenceTable = await er.json();
  } catch (e) { /* 没有证据表时面板少一段 */ }
}

function exitCommunity() {
  if (inside === null && !flying) return;
  // 清空内部图层（复用 clearOverlay，它同时移除 CSS2DObject 的 DOM）
  clearOverlay();
  // 图例只属于内部视图：清空内容而不是只靠 CSS 隐藏，
  // 否则下次进入别的社区时会先闪一帧上一个社区的图例。
  legendEl.innerHTML = '';
  // 恢复概览层
  scene.children.forEach(o => {
    if (o === overlay || o.isCSS2DObject) return;
    if (o.isPoints || o.isLineSegments) o.visible = true;
  });
  cloudObjects.forEach(it => {
    it.group.visible = true;
    if (it.labelObject) it.labelObject.visible = true;
  });
  filamentObjects.forEach(it => { it.group.visible = true; });
  innerHud.classList.remove('on');
  document.body.classList.remove('inside');
  controls.maxDistance = 130;      // 恢复概览层的限制
  hintEl.textContent = '拖拽旋转 · 滚轮缩放 · 悬浮预览社区 · 点击星云进入内部';
  // 直接回到概览视角，不做退出补间
  camera.position.set(0, 2.6, innerWidth < 700 ? CAM_Z_PORTRAIT : CAM_Z);
  controls.target.set(0, 0, 0);
  controls.update();
  inside = null;
  insideActive = false;
  hoverId = null;
  hidePreview();
}

let downX = 0, downY = 0, downT = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  downX = e.clientX; downY = e.clientY; downT = performance.now();
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (flying) return;
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved > 5 || performance.now() - downT > 700) return;

  // ── 内部视图：点击实体 = 与点击列表项同种效果；点空白处取消选中 ──
  if (inside !== null) {
    pointer.x = (e.clientX / innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    raycaster.params.Points.threshold = 3.5;
    const ptsTarget = overlay.userData && overlay.userData.pts;
    const nodeHit = ptsTarget ? raycaster.intersectObject(ptsTarget, false)[0] : null;
    if (nodeHit && nodeHit.index !== undefined) {
      selectNode(nodeHit.index);
      scrollListToNode(nodeHit.index);
    } else {
      clearSelection();
    }
    return;
  }

  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(cloudObjects.map(i => i.hitArea), false)[0];
  if (!hit) { hidePreview(); return; }
  const cid = hit.object.userData.cloudId;
  inside = clouds.findIndex(c => c.id === cid);
  if (inside >= 0) enterCommunity(inside);
});
document.getElementById('back').addEventListener('click', (e) => {
  e.stopPropagation(); exitCommunity();
});
addEventListener('keydown', (e) => {
  // 注意：判断条件是"PDF 抽屉当前是否开着"，但**不能只靠它**来避免冲突。
  // PDF 的监听器注册在前，它处理完 Escape 会移走 `.open`，于是这里读到 false、
  // 仍然会退出社区。真正的隔离靠 PDF 那侧调用 `stopImmediatePropagation()`。
  // 这一句只是给"PDF 本来就关着"的常规情形兜底。
  if (e.key === 'Escape' && !pdfPane.classList.contains('open')) exitCommunity();
});

const CAM_Z = 50.2;
const CAM_Z_PORTRAIT = 105.5;

let _firstFrame = false;
let labelTick = 0;
let hoverNodeIdx = -1;      // 内部视图里当前悬浮的实体（供标签分配优先占位）
let haloAnim = null;        // 选中光晕的放大动画状态
let targetAnim = null;      // 视线缓动状态（选中实体时平滑对准，避免画面瞬移）
function animate() {
  requestAnimationFrame(animate);
  const elapsed = performance.now() * .001;

  // ── 星云缓慢漂移：在基准位置上叠加极慢的噪声位移 ──
  //   必须在 basePos 上计算（不能对当前位置累加，否则会漂走）
  cloudObjects.forEach((it, k) => {
    const bp = it.group.userData.basePos;
    if (!bp) return;
    const ph = it.group.userData.driftPhase || k;
    const amp = it.group.userData.driftAmp || 0.5;
    it.group.position.set(
      bp.x + Math.sin(elapsed * 0.11 + ph) * amp,
      bp.y + Math.cos(elapsed * 0.085 + ph * 1.3) * amp * 0.82,
      bp.z + Math.sin(elapsed * 0.07 + ph * 0.7) * amp * 0.55,
    );
    // 标签锚点跟随
    if (it.labelObject) it.labelObject.position.x = innerWidth < 700
      ? it.labelObject.userData.mobileX : 0;
  });

  // ── 相机补间已移除：进入/退出都直接落位，不做缩放动画 ──
  cloudObjects.forEach(({ veils }, index) => {
    veils.forEach((veil, layer) => {
      veil.quaternion.copy(camera.quaternion);
      veil.material.uniforms.uTime.value = elapsed + index * 3.1 + layer * 1.4;
    });
  });
  filamentObjects.forEach((item) => {
    const particle = flowParticles.get(item);
    if (!particle.visible) return;
    const t = (elapsed * .045 + particle.userData.offset) % 1;
    particle.position.copy(item.curve.getPoint(t));
    // 两端淡出、中段最亮：像能量在纤维里流动，而不是一颗球在爬
    const fade = Math.sin(Math.PI * t);
    particle.material.uniforms.uOpacity.value = .55 * fade * fade;
  });
  controls.update();

  // 选中光晕的放大动画：快速放大并轻微过冲，然后回落稳定（约 460ms）
  if (haloAnim) {
    const x = Math.min(1, (performance.now() - haloAnim.t0) / haloAnim.dur);
    const k = x < 0.68 ? (x / 0.68) * 1.22 : 1.22 - 0.22 * ((x - 0.68) / 0.32);
    const m = haloAnim.material;
    m.uniforms.uSize.value = haloAnim.base * k;
    m.uniforms.uOpacity.value = Math.min(1, x * 4.5);
    if (x >= 1) { m.uniforms.uSize.value = haloAnim.base; haloAnim = null; }
  }

  // 视线缓动：选中实体时平滑对准，避免画面瞬移（与进出社区的场景切换无关）
  if (targetAnim) {
    const x = Math.min(1, (performance.now() - targetAnim.t0) / targetAnim.dur);
    const e = 1 - Math.pow(1 - x, 3);
    controls.target.lerpVectors(targetAnim.from, targetAnim.to, e);
    if (x >= 1) targetAnim = null;
  }

  // 每 5 帧做一次标签相关计算（每帧都做会因强制 reflow 拖慢渲染）。
  // tick 必须在这里统一自增：原先自增写在内部视图的分支里，
  // 概览层时它永远是 0、`% 5 === 0` 每帧成立，遮挡计算会退化成每帧跑。
  labelTick++;
  if (labelTick % 5 === 0) {
    if (inside !== null) layoutInnerLabels();
    // 概览层社区标签的深度遮挡。必须排在 updateHoverState 之后，
    // 因为它是在后者算出的透明度上再乘一个因子。
    else updateLabelOcclusion();
  }
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  // L0 概览首帧渲染完成即就绪。直入模式（?c=N）不在这里置位，
  // 否则 CDP 会在概览层就截图，拿到的不是内部视图。
  if (!_firstFrame) { _firstFrame = true; if (!PRE_C) window.__ready = true; }
}
animate();

// ── 直接进入某个社区：web/kg-nebula.html?c=0 ──
// 用于分享具体社区，也便于自动化截图验证内部视图。
{
  const q = new URLSearchParams(location.search);
  const c = q.get('c');
  if (c !== null && clouds[+c]) {
    const idx = +c;
    // 直入模式（?c=N）：数据已在模块顶层预取。
    // 这里刻意用**模块顶层 await** 而不是 queueMicrotask——顶层 await 会让
    // 先隐藏概览标题：CSS 过渡要 350ms，截图等不到，会截到 opacity 仍为 1 的中间态
    document.querySelector('.header').style.display = 'none';
    await enterCommunity(idx, PRE_DATA);
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
    // 供 tools/cdp_shot.py 判定"内部视图已渲染完成"，避免抓帧时机竞争
    window.__ready = true;
  }
}

// ── 直接从「论文原文」进来：?pdf=<文件名>&page=<页>&q=<片段> ──────────────
//
// **为什么加这一组参数**：`ask.html`（多 Agent 问答）的每条证据都带着
// 论文文件名与页码，但**点不进去** —— 用户看到"2506.09566v1 · 第 4 页"
// 只能自己去翻。而这一页早就实现了 pdf.js 面板与片段高亮
// （`openPdf(src, page, snippet)`，见 `tools/cdp_verify_pdflink.py`）。
//
// 与其把那套面板搬到 ask.html（几百行 pdf.js 逻辑，还要再维护一份），
// 不如**让引文直接跳到这里** —— 复用完整能力（高亮、翻页、原文链接），
// 也顺带把"问答 → 原文"这条动线接到主视图上。
//
// `back` 参数用于回跳（带上它，用户看完原文能一键回到刚才那个问题）。
{
  const q2 = new URLSearchParams(location.search);
  const pdfSrc = q2.get('pdf');
  if (pdfSrc) {
    const page = Number(q2.get('page')) || 1;
    const snip = q2.get('q') || '';
    try {
      await openPdf(pdfSrc, page, snip);
      // 自动化验证读这个：确认真的开了、且高亮画出来了
      window.__pdfState = {
        src: pdfSrc, page: pdfPageNum,
        highlights: document.querySelectorAll('#pdfTextLayer span.hl').length,
        viaUrl: true
      };
    } catch (e) {
      window.__pdfState = { src: pdfSrc, page: page, error: String((e && e.message) || e) };
    }
    // 带 ?pdf= 进来时，就绪信号以"PDF 已尝试打开"为准
    window.__ready = true;
  }
}

// ── 供自动化验证使用的调试接口（见 tools/cdp_check_labels.py）──
window.KGNebula = {
  enter: (i) => enterCommunity(i),
  exit: () => exitCommunity(),
  labelCount: () => document.querySelectorAll('.label').length,
  select: (i) => selectNode(i),
  clear: () => clearSelection(),
  listCount: () => document.querySelectorAll('#list .item').length,
  haloOn: () => Boolean(overlay.userData && overlay.userData.halo && overlay.userData.halo.visible),
  panelOpen: () => document.getElementById('detail').classList.contains('open'),
  subText: () => document.getElementById('itSub').textContent,

  // 供等价性回归使用（tools/cdp_verify_color.py）：暴露 THREE 与当前 overlay，
  // 使验证脚本能用**改造前的公式**重算一遍颜色，再与引擎输出逐值比对。
  // 这是"默认外观未被改变"的机器证据——比肉眼看两张截图相似要可靠得多，
  // 因为 THREE 的 sRGB→Linear 色彩管理会让手工算的 RGB 与页面内不一致。
  _internals: () => ({ THREE, ud: overlay.userData }),

  // ── 标签分配与深度遮挡（视觉细节验证用）──
  // 概览层：多少社区标签因被前面的星云挡住而压暗
  occludedCount: () => cloudObjects.filter(it => (it._occFactor || 1) < 1).length,
  labelOpacityHistogram: () => {
    const h = {};
    for (const el of document.querySelectorAll('.label')) {
      const o = el.style.opacity || '1';
      h[o] = (h[o] || 0) + 1;
    }
    return h;
  },
  labelMinRadius: () => LABEL_MIN_SCREEN_R,
  // 内部视图：按"节点级屏幕尺寸门槛"过滤后，有多少节点有资格拿标签
  eligibleLabelCount: () => {
    const ud = overlay.userData;
    if (!ud || !ud.data || !ud.pts) return null;
    const a = ud.pts.geometry.attributes.aSize.array;
    const uScale = innerHeight * 1.5;
    let n = 0;
    for (let i = 0; i < ud.data.nodes.length; i++) {
      const nd = ud.data.nodes[i];
      const wp = new THREE.Vector3(ud.center.x + nd.x, ud.center.y + nd.y, ud.center.z + nd.z);
      const r = 0.5 * a[i] * uScale / Math.max(1e-3, camera.position.distanceTo(wp));
      if (r >= LABEL_MIN_SCREEN_R) n++;
    }
    return n;
  },

  // ── 原文 PDF 深链（T6.2）──
  // 现在用 pdf.js 自绘，所以高亮是**可断言**的：
  // `pdfState().highlights` 就是当前页上被标为 `.hl` 的 span 数
  // （此前用浏览器内置查看器时，无头环境根本无法验证高亮）。
  pdfOpen: () => pdfPane.classList.contains('open'),
  pdfState: () => window.__pdfState || null,
  pdfStep: (d) => pdfStep(d),
  closePdf: () => { closePdf(); return pdfPane.classList.contains('open'); },
  pdfHrefOf: (src, page, snip) => pdfHref(src, page, snip),
  pdfSnippetOf: (text) => pdfSearchSnippet(text),

  // ── 着色引擎（T6.4）──
  colorMode: () => ({ ...colorMode }),
  setColorMode: (p, r) => {
    if (p) colorMode.partition = p;
    if (r) colorMode.ranking = r;
    applyColorMode();
    return { ...colorMode };
  },
  legendItems: () => document.querySelectorAll('#legend .lg-item').length,
  legendButtons: () => [...document.querySelectorAll('#legend .seg button')]
    .map(b => ({ group: b.dataset.group, val: b.dataset.val, on: b.classList.contains('on') })),
  // 当前点云里实际出现的颜色集合（取整到 8 位）。用于确认"切换真的改变了
  // 缓冲区"而不是只换了图例文字——这是本次改造最容易出现的假通过。
  nodeColors: () => {
    const ud = overlay.userData;
    if (!ud || !ud.pts) return null;
    const a = ud.pts.geometry.attributes.color.array;
    const set = new Set();
    for (let i = 0; i < a.length; i += 3) {
      set.add([a[i], a[i + 1], a[i + 2]].map(v => Math.round(v * 255)).join(','));
    }
    return [...set];
  },
  target: () => controls.target.toArray().map(v => +v.toFixed(2)),
  // 供自动化验证：内部视图下仍可见的概览层对象数（应为 0）
  overviewLeak: () => {
    let n = 0;
    scene.children.forEach(o => {
      if (o === overlay || o.isCSS2DObject || o === renderer.domElement) return;
      if (o.isLight || o.isCamera) return;
      if (o.visible && (o.isPoints || o.isLineSegments) && !o.parent?.isGroup) n++;
    });
    cloudObjects.forEach(it => { if (it.group.visible) n++; });
    filamentObjects.forEach(it => { if (it.group.visible) n++; });
    return n;
  },
  // 供自动化验证：某实体在屏幕上的坐标（用于派发点击事件）
  nodeScreen: (i) => {
    const ud = overlay.userData;
    if (!ud || !ud.data || !ud.data.nodes[i]) return null;
    const n = ud.data.nodes[i];
    const v = new THREE.Vector3(ud.center.x + n.x, ud.center.y + n.y, ud.center.z + n.z)
      .project(camera);
    return {
      x: (v.x * .5 + .5) * innerWidth,
      y: (-v.y * .5 + .5) * innerHeight,
      z: v.z,
    };
  },
};

/* 导出当前视图：PNG / JSON / GEXF。
   注意导出的是**当前数据**（data），搜索或聚焦后它就是子集 —— 这是有意的，
   因为用户此刻看到的就是这个子集。 */
(function () {
  function stamp() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
  }
  function save(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  function flash(btn) {
    btn.classList.add('ok');
    const old = btn.textContent;
    btn.textContent = '✓';
    setTimeout(() => { btn.classList.remove('ok'); btn.textContent = old; }, 1100);
  }
  function xmlEsc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
  }
  /* GEXF 1.2：节点 id 必须是数字索引，标签放 label；边用索引互指。 */
  function toGexf(d) {
    const idx = new Map();
    d.nodes.forEach((n, i) => idx.set(n.id, i));
    const L = [];
    L.push('<?xml version="1.0" encoding="UTF-8"?>');
    L.push('<gexf xmlns="http://gexf.net/1.2" version="1.2">');
    L.push('  <meta><creator>KG Cosmos</creator><description>' +
           xmlEsc('导出当前视图 · ' + d.nodes.length + ' 节点 / ' + d.edges.length + ' 边') +
           '</description></meta>');
    L.push('  <graph mode="static" defaultedgetype="directed">');
    L.push('    <attributes class="node">');
    L.push('      <attribute id="0" title="type" type="string"/>');
    L.push('      <attribute id="1" title="degree" type="integer"/>');
    L.push('      <attribute id="2" title="community" type="integer"/>');
    L.push('    </attributes>');
    L.push('    <nodes>');
    d.nodes.forEach((n, i) => {
      L.push(`      <node id="${i}" label="${xmlEsc(n.name || n.id)}">`);
      L.push('        <attvalues>');
      L.push(`          <attvalue for="0" value="${xmlEsc(n.t || n.type || '')}"/>`);
      L.push(`          <attvalue for="1" value="${Number(n.d || 0)}"/>`);
      L.push(`          <attvalue for="2" value="${Number(n.c == null ? -1 : n.c)}"/>`);
      L.push('        </attvalues>');
      L.push('      </node>');
    });
    L.push('    </nodes>');
    L.push('    <edges>');
    let eid = 0;
    for (const e of d.edges) {
      const a = idx.get(e[0]), b = idx.get(e[1]);
      if (a === undefined || b === undefined) continue;   // 端点不在当前视图里就跳过
      L.push(`      <edge id="${eid++}" source="${a}" target="${b}"` +
             (e[2] ? ` label="${xmlEsc(e[2])}"` : '') + '/>');
    }
    L.push('    </edges>');
    L.push('  </graph>');
    L.push('</gexf>');
    return L.join('\n');
  }

  const bar = document.getElementById('kgExport');
  if (!bar) return;
  bar.addEventListener('click', ev => {
    const btn = ev.target.closest('button[data-exp]');
    if (!btn) return;
    const kind = btn.dataset.exp;
    try {
      if (kind === 'png') {
        renderer.render(scene, camera);
        renderer.domElement.toBlob(b => {
          if (!b) { alert('PNG 导出失败：画布为空'); return; }
          save(b, `kg-cosmos-${stamp()}.png`);
          flash(btn);
        }, 'image/png');
      } else if (kind === 'json') {
        const payload = {
          exported_at: new Date().toISOString(),
          source: 'kg-nebula.html · 当前视图',
          nodes: data.nodes, edges: data.edges,
        };
        save(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }),
             `kg-cosmos-${stamp()}.json`);
        flash(btn);
      } else {
        save(new Blob([toGexf(data)], { type: 'application/xml' }),
             `kg-cosmos-${stamp()}.gexf`);
        flash(btn);
      }
    } catch (err) {
      console.error('[export]', err);
      alert('导出失败：' + err.message);
    }
  });
})();
/* ==KG_EXPORT_V1_END== */

/* 人工标记：只落盘、不改图。没有后端时如实告知，不假装记下了。 */
(function () {
  const dbody = document.getElementById('dbody');
  if (!dbody) return;
  dbody.addEventListener('click', async (ev) => {
    // ── K1：提交改图计划（与上面"只记录"分开的一条路径）─────────────────
    // 端点 `/api/kg/edit-plan` **只落盘计划文件、不改图**；执行交给
    // `tools/apply_edit_plan.py`。所以这里的措辞必须说清"这只是提交了一份计划"，
    // 否则用户会以为图已经被改了。
    const ebtn = ev.target.closest('.editrow button[data-edit]');
    if (ebtn) {
      const row = ebtn.closest('.editrow');
      const node = row.dataset.editNode;
      const input = row.querySelector('input');
      const msg = row.querySelector('.editmsg');
      const to = (input.value || '').trim();
      if (!to) {
        msg.textContent = '请先填新名字。';
        input.focus();
        return;
      }
      if (to === node) {
        msg.textContent = '新名字和原名一样，没有要提交的改动。';
        return;
      }
      ebtn.disabled = true;
      try {
        const r = await fetch('./api/kg/edit-plan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            generated_by: 'web/kg-nebula',
            note: `在实体详情里把「${node}」改成「${to}」`,
            operations: [{ op: 'rename_entity', from: node, to: to,
                           reason: '界面上提交的人工修正' }],
          }),
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        msg.textContent = `已提交改图计划（${j.operations} 条操作）→ ${j.saved_to}。`
          + ` 这只写了一份计划，**图还没改** —— 由人跑 apply 脚本执行。`;
        input.value = '';
      } catch (e) {
        msg.textContent = '提交失败：' + (e && e.message ? e.message : e)
          + '（后端未启动时不假装已保存）。';
      } finally {
        ebtn.disabled = false;
      }
      return;
    }

    const btn = ev.target.closest('.flagbar button[data-flag]');
    if (!btn) return;
    const bar = btn.closest('.flagbar');
    const node = bar.dataset.node;
    const kind = btn.dataset.flag;
    const msg = bar.querySelector('.msg');
    const all = [...bar.querySelectorAll('button')];
    all.forEach(b => { b.disabled = true; });
    try {
      const r = await fetch('./api/flag', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ node, kind, view: 'kg-nebula' }),
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      btn.classList.add('ok');
      msg.textContent = `已记录「${node}」的 ${kind}（累计 ${j.total} 条待审核）。`
        + ` 只记录，不自动改图。`;
    } catch (e) {
      btn.classList.add('no');
      msg.textContent = '没能记下：' + (e && e.message ? e.message : e)
        + '（后端未启动时不假装已保存）。';
    } finally {
      setTimeout(() => all.forEach(b => { b.disabled = false; }), 900);
    }
  });
})();
/* ==KG_FLAG_V1_END== */
</script>
