<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KG Cosmos · 社区星云</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050914; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  /* 背景改为纯色 + 极弱的径向层次。原来是 deep-space-galaxy.html 这个 iframe
     （一层会动的星空），按用户要求把所有星星删掉了，只留一点空间感。 */
  body { background: radial-gradient(ellipse 120% 80% at 50% 8%, #0b1428 0%, #060b18 46%, #04070f 100%); }
  canvas { position: fixed; inset: 0; display: block; }
  .label { color: rgba(239,246,255,.9); font-size: 12px; letter-spacing: .025em; text-align: center; white-space: nowrap; pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,.95), 0 0 14px rgba(8,20,45,.9); }
  /* 实体标签加半透明底板。社区 Triple 的节点与边是浅蓝（#7ecbff），
     白色文字直接压在上面几乎读不出来；底板让标签不受底图颜色影响。 */
  .label.entity {
    background: rgba(5, 9, 20, .72);
    border: 1px solid rgba(255, 255, 255, .07);
    border-radius: 5px;
    padding: 2px 6px 3px;
    box-shadow: 0 1px 7px rgba(0, 0, 0, .55);
  }
  .label b { display: block; font-size: 13px; font-weight: 550; }
  .label small { display: block; margin-top: 4px; color: rgba(202,220,244,.58); font-size: 10px; }
  .header { position: fixed; inset: 28px auto auto 32px; z-index: 3; color: rgba(232,241,255,.88); pointer-events: none; transition: opacity .35s ease; }
  /* 进入社区后隐藏概览层的标题，否则会和内部视图的返回按钮叠在一起 */
  body.inside .header { opacity: 0; }
  .header small { display: block; color: rgba(181,203,235,.54); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .header h1 { margin: 6px 0 0; font-size: 18px; font-weight: 520; letter-spacing: .04em; }
  .hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); color: rgba(203,219,246,.42); font-size: 11px; letter-spacing: .05em; pointer-events: none; }
  .status { position: fixed; left: 50%; top: 28px; transform: translate(-50%, -12px); color: rgba(236,245,255,.94); font-size: 13px; opacity: 0; transition: opacity .35s ease, transform .35s ease; pointer-events: none; text-shadow: 0 0 16px rgba(127,178,255,.65); }
  .status.visible { opacity: 1; transform: translate(-50%, 0); }
  /* ── 悬浮详情面板 ── */
  #detail { position: fixed; right: 22px; top: 22px; width: 306px; max-height: calc(100vh - 44px);
            overflow-y: auto; z-index: 6; padding: 16px 18px; border-radius: 12px;
            background: rgba(8, 13, 30, .90); border: 1px solid rgba(140, 170, 255, .22);
            backdrop-filter: blur(10px); color: #dfe8ff;
            transform: translateX(22px); opacity: 0; pointer-events: none;
            transition: opacity .24s ease, transform .24s ease; }
  #detail.open { opacity: 1; transform: none; }
  #detail h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  #detail .sub { font-size: 11px; color: rgba(181, 203, 235, .62); margin-bottom: 10px; line-height: 1.6; }
  #detail .sec { font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
                 color: rgba(181, 203, 235, .72); margin: 14px 0 6px;
                 padding-bottom: 4px; border-bottom: 1px solid rgba(140, 170, 255, .1); }
  #detail .row { display: flex; align-items: baseline; gap: 8px; font-size: 12px;
                 padding: 3px 0; border-bottom: 1px solid rgba(140, 170, 255, .07); }
  #detail .row:last-child { border-bottom: 0; }
  #detail .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #detail .row .dg { color: rgba(181, 203, 235, .55); font-size: 11px;
                     font-variant-numeric: tabular-nums; }
  #detail .link { display: flex; align-items: center; gap: 7px; font-size: 12px; padding: 4px 0; }
  #detail .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto;
                 box-shadow: 0 0 6px currentColor; }
  /* 关联强度条：一眼看出哪个社区与本社区关系最强 */
  #detail .lname { flex: 0 1 auto; max-width: 48%; overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap;
                   color: rgba(214, 228, 250, .92); }
  #detail .lbar { flex: 1 1 auto; height: 3px; border-radius: 2px; min-width: 26px;
                  background: rgba(140, 170, 255, .13); overflow: hidden; }
  #detail .lbar i { display: block; height: 100%; border-radius: 2px; opacity: .85; }
  #detail .cnt { flex: 0 0 auto; min-width: 30px; text-align: right;
                 color: rgba(206, 222, 246, .85); font-size: 11px;
                 font-variant-numeric: tabular-nums; }
  #detail .cta { margin-top: 12px; font-size: 11px; color: rgba(150, 190, 255, .85);
                 border-top: 1px solid rgba(140, 170, 255, .12); padding-top: 9px; }
  /* 证据出处：论文 + 页码 + 原文片段 */
  #detail .ev { margin: 7px 0 10px; padding-left: 9px;
                border-left: 2px solid rgba(120, 160, 255, .28); }
  #detail .evsrc { font-size: 11px; color: rgba(150, 190, 255, .82); margin-bottom: 3px; }
  #detail .evtext { font-size: 11.5px; line-height: 1.62; color: rgba(196, 214, 240, .74); }
  #stat { margin-top: 7px; font-size: 11px; color: rgba(181, 203, 235, .58); }

  /* ── 内部视图 HUD ── */
  #inner { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0;
           transition: opacity .45s ease; }
  #inner.on { opacity: 1; }
  /* 标题加深色底板：社区中心是上千个实体的亮核，白字直接压上去读不出来 */
  #innerTitle { position: fixed; left: 50%; top: 20px; transform: translateX(-50%);
                text-align: center; padding: 6px 16px 8px; border-radius: 10px;
                background: rgba(5, 9, 20, .62); backdrop-filter: blur(6px); }
  #innerTitle b { display: block; font-size: 17px; font-weight: 560; letter-spacing: .02em; }
  #innerTitle small { display: block; margin-top: 5px; font-size: 11px;
                      color: rgba(181, 203, 235, .6); }
  #back { position: fixed; left: 26px; top: 26px; pointer-events: auto; cursor: pointer;
          background: rgba(8, 13, 30, .86); border: 1px solid rgba(140, 170, 255, .28);
          color: #cfe0ff; border-radius: 9px; padding: 8px 14px; font-size: 12px;
          backdrop-filter: blur(8px); }
  #back:hover { border-color: rgba(150, 190, 255, .6); color: #fff; }

  /* ── 内部视图的实体列表与搜索 ── */
  #side { position: fixed; left: 22px; top: 74px; bottom: 18px; width: 236px; z-index: 4;
          display: flex; flex-direction: column; gap: 8px;
          opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  body.inside #side { opacity: 1; pointer-events: auto; }
  #searchWrap { position: relative; flex: 0 0 auto; }
  #search { width: 100%; background: rgba(8, 13, 30, .88);
            border: 1px solid rgba(140, 170, 255, .26); color: #dbe7ff;
            border-radius: 8px; padding: 8px 30px 8px 10px; font: inherit;
            font-size: 12px; outline: none; }
  #search:focus { border-color: rgba(150, 190, 255, .62); }
  #search::placeholder { color: rgba(160, 190, 235, .45); }
  /* 清除按钮：只在有内容时出现 */
  #searchClear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
                 width: 19px; height: 19px; padding: 0; border: 0; border-radius: 50%;
                 background: rgba(140, 170, 255, .16); color: #cfe0ff; cursor: pointer;
                 font-size: 13px; line-height: 1; display: none; }
  #searchClear:hover { background: rgba(140, 170, 255, .34); color: #fff; }
  body.hasQuery #searchClear { display: block; }
  #list { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
          background: rgba(8, 13, 30, .74); border: 1px solid rgba(140, 170, 255, .16);
          border-radius: 10px; padding: 4px;
          scrollbar-width: thin; scrollbar-color: rgba(120,160,255,.3) transparent; }
  #list .item { display: flex; align-items: baseline; gap: 8px; padding: 5px 8px;
                border-radius: 6px; cursor: pointer; font-size: 12px;
                color: rgba(214, 228, 250, .88); }
  #list .item:hover { background: rgba(120, 160, 255, .14); color: #fff; }
  #list .item.sel { background: rgba(120, 160, 255, .24); color: #fff; }
  #list .item .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .item .dg { color: rgba(160, 190, 235, .6); font-size: 11px; font-variant-numeric: tabular-nums; }
  #list .empty { padding: 20px 10px; text-align: center; font-size: 12px;
                 line-height: 1.75; color: rgba(160, 190, 235, .5); }
  #list .empty b { display: block; margin-bottom: 5px; font-weight: 500;
                   color: rgba(196, 216, 246, .78); }
</style>
</head>
<body>
<div class="header"><small>kg cosmos · community nebula</small><h1>社区星云</h1><div id="stat"></div></div>
<div class="status" id="status"></div>
<div class="hint" id="hint">拖拽旋转 · 滚轮缩放 · 悬浮预览社区 · 点击星云进入内部</div>
<aside id="detail"><div id="dbody"></div></aside>
<aside id="side">
  <div id="searchWrap">
    <input id="search" type="search" placeholder="搜索实体…" autocomplete="off" spellcheck="false">
    <button id="searchClear" type="button" title="清除" aria-label="清除搜索">×</button>
  </div>
  <div id="list"></div>
</aside>
<div id="inner"><div id="innerTitle"><b id="itName"></b><small id="itSub"></small></div><button id="back" type="button">← 返回星云概览</button></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ══════════════════════════════════════════════════════════════
// 数据：真实 Louvain 社区 + 跨社区纤维（概览层）
//       社区内部实体与边按需加载（进入星云时）——概览刻意不画实体级边，
//       否则上万条边会把画面糊成一片。
// ══════════════════════════════════════════════════════════════
const DATA_URL = new URL('./kg-data/filaments.json', location.href).href;
const COMM_URL = (i) => new URL(`./kg-data/comm-${i}.json`, location.href).href;
let clouds, links, META;
try {
  const res = await fetch(DATA_URL);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const payload = await res.json();
  clouds = payload.clouds; links = payload.links; META = payload.meta || {};
  console.log(`载入 ${clouds.length} 社区 / ${links.length} 纤维`);
} catch (err) {
  document.body.insertAdjacentHTML('beforeend',
    `<div style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
      color:#dfe8ff;font:13px/1.75 system-ui;background:rgba(8,12,28,.95);
      border:1px solid rgba(140,170,255,.3);border-radius:10px;padding:18px 22px;z-index:9">
      载入数据失败：${err.message}<br><br>需用 HTTP 打开（在项目根执行）：<br>
      <code>python -m http.server 8098 --bind 127.0.0.1</code><br>
      访问 <code>http://localhost:8098/web/kg-nebula.html</code></div>`);
  throw err;
}

// ── ?c=N 直入：在模块顶层预取社区内部数据 ──
// 顶层 await 会推迟 load 事件，headless 截图因此能等到数据就绪；
// 正常交互进入时 PRE_DATA 为 null，走 enterCommunity 里的 fetch 分支。
const PRE_C = new URLSearchParams(location.search).get('c');
const PRE_DATA = (PRE_C !== null && clouds[+PRE_C])
  ? await (await fetch(COMM_URL(+PRE_C))).json()
  : null;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 2.6, 50.2);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:2;';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 130;
controls.target.set(0, 0, 0);
function fitCloudOverviewToViewport() {
  // The overview is a wide constellation. On a portrait viewport, move the
  // camera back instead of clipping clouds or their labels at the side edges.
  camera.position.z = innerWidth < 700 ? 105.5 : 50.2;
}
fitCloudOverviewToViewport();

scene.add(new THREE.AmbientLight('#8aa8d8', 1.35));
const rimLight = new THREE.PointLight('#b8d8ff', 24, 40); rimLight.position.set(-4, 8, 8); scene.add(rimLight);
const warmLight = new THREE.PointLight('#ffca8a', 14, 35); warmLight.position.set(10, -5, 6); scene.add(warmLight);

const cloudById = new Map();
const cloudObjects = [];
function seeded(seed) { let state = seed >>> 0; return () => ((state = (state * 1664525 + 1013904223) >>> 0) / 4294967296); }

const NEBULA_NOISE = `
  float hash21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float noise2(vec2 p) {
    vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash21(i), hash21(i + vec2(1., 0.)), f.x), mix(hash21(i + vec2(0., 1.)), hash21(i + vec2(1., 1.)), f.x), f.y);
  }
  float fbm(vec2 p) {
    float value = 0., amplitude = .54;
    for (int i = 0; i < 5; i++) { value += noise2(p) * amplitude; p = p * 2.04 + vec2(3.7, 1.9); amplitude *= .5; }
    return value;
  }
`;

function createNebulaVeil(color, seedValue, size, opacity, stretch, zOffset) {
  const material = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: color }, uSeed: { value: seedValue }, uOpacity: { value: opacity },
      uStretch: { value: stretch }, uTime: { value: 0 }
    },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec2 vUv; uniform vec3 uColor; uniform float uSeed, uOpacity, uStretch, uTime;
      ${NEBULA_NOISE}
      void main() {
        vec2 frame = (vUv - .5) * 2.;
        vec2 p = frame; p.x *= uStretch;
        vec2 q = p * 1.42 + vec2(uSeed * 2.1, uSeed * .71);
        vec2 warp = vec2(fbm(q + uTime * .004), fbm(q + vec2(7.1, 2.3) - uTime * .003));
        float mass = fbm(q + warp * 1.35);
        float detail = fbm(q * 2.8 - warp * .62 + 4.4);
        float radius = length(p + (warp - .5) * .42);
        // The veil is rendered on a rectangle, but the gas must never reveal that
        // carrier. This independent noisy radial mask removes every hard canvas edge.
        float edgeNoise = (fbm(frame * 2.2 + vec2(uSeed * 4.6, 3.2)) - .5) * .16;
        float frameMask = smoothstep(1.02, .66, length(frame) + edgeNoise);
        float body = smoothstep(.14, .68, mass) * smoothstep(1.16, .16, radius);
        float wisps = smoothstep(.54, .78, detail) * smoothstep(1.08, .28, radius);
        float dust = smoothstep(.58, .78, fbm(q * 4.3 + 9.7));
        float alpha = (body * .82 + wisps * .48) * (1. - dust * .44) * frameMask * uOpacity;
        vec3 color = uColor * (.36 + mass * 1.55 + detail * .24);
        // Additive blending applies source alpha itself. Do not premultiply here,
        // otherwise the diffuse gas is unintentionally dimmed a second time.
        gl_FragColor = vec4(color, alpha);
        if (alpha < .008) discard;
      }
    `
  });
  const veil = new THREE.Mesh(new THREE.PlaneGeometry(size * 2.55, size * 2.55, 1, 1), material);
  veil.position.z = zOffset;
  veil.userData.baseOpacity = opacity;
  return veil;
}

function createCloud(cloud, index) {
  const random = seeded(320 + index);
  const group = new THREE.Group();
  const color = new THREE.Color(cloud.color);
  const veils = [
    createNebulaVeil(color, index * 1.71 + .3, cloud.size, .44, .76 + random() * .56, -.12),
    createNebulaVeil(color.clone().lerp(new THREE.Color('#d3e7ff'), .22), index * 2.37 + 3.9, cloud.size * .86, .27, 1.04 + random() * .42, .05),
    createNebulaVeil(color.clone().lerp(new THREE.Color('#6b7fc1'), .20), index * 4.11 + 1.2, cloud.size * 1.08, .19, .64 + random() * .48, .17)
  ];
  veils.forEach(veil => group.add(veil));

  // Stars follow an ellipsoidal density, not a geometric ring. The densest area
  // remains near the cloud's irregular luminous core and fades naturally outward.
  const points = new Float32Array(300 * 3);
  for (let i = 0; i < 300; i++) {
    const angle = random() * Math.PI * 2;
    const radius = Math.sqrt(-2 * Math.log(Math.max(.001, random()))) * cloud.size * .24;
    points[i * 3] = Math.cos(angle) * radius * (1.05 + random() * .32);
    points[i * 3 + 1] = Math.sin(angle) * radius * (.52 + random() * .25);
    points[i * 3 + 2] = (random() - .5) * cloud.size * (.20 + random() * .16);
  }
  const stars = new THREE.BufferGeometry();
  stars.setAttribute('position', new THREE.BufferAttribute(points, 3));
  const starField = new THREE.Points(stars, new THREE.PointsMaterial({ color: color.clone().lerp(new THREE.Color('#ffffff'), .34), size: .038, transparent: true, opacity: .56, depthWrite: false, blending: THREE.AdditiveBlending }));
  group.add(starField);
  const core = new THREE.Mesh(new THREE.SphereGeometry(cloud.size * .052, 20, 20), new THREE.MeshBasicMaterial({ color: color.clone().lerp(new THREE.Color('#ffffff'), .36), transparent: true, opacity: .64, blending: THREE.AdditiveBlending, depthWrite: false }));
  core.userData.cloudId = cloud.id;
  group.add(core);
  const hitArea = new THREE.Mesh(new THREE.SphereGeometry(cloud.size * .72, 18, 18), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  hitArea.userData.cloudId = cloud.id;
  group.add(hitArea);
  group.position.fromArray(cloud.position);
  // 记录基准位置与相位：漂移在基准上叠加，禁止累积（否则会飘走）
  group.userData.basePos = new THREE.Vector3().fromArray(cloud.position);
  group.userData.driftPhase = index * 1.37;
  group.userData.driftAmp = 0.55 + (index % 4) * 0.22;

  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `<b>${cloud.name}</b><small>${cloud.entityCount} 实体${cloud.topType ? ' · ' + cloud.topType : ''}</small>`;
  const labelObject = new CSS2DObject(label);
  labelObject.position.set(0, cloud.size * .92, 0);
  labelObject.userData.mobileX = cloud.position[0] < 0 ? cloud.size * .72 : cloud.position[0] > 0 ? -cloud.size * .72 : 0;
  group.add(labelObject);

  scene.add(group);
  const item = { cloud, group, core, hitArea, veils, starField, label, labelObject };
  cloudById.set(cloud.id, item);
  cloudObjects.push(item);
}
clouds.forEach(createCloud);
{
  const _st = document.getElementById('stat');
  if (_st) {
    const total = clouds.reduce((a, c) => a + c.entityCount, 0);
    const sc = { strong: 0, medium: 0, weak: 0 };
    links.forEach(l => { sc[l.strength] = (sc[l.strength] || 0) + 1; });
    _st.textContent = `${clouds.length} 个社区 · ${total} 实体 · ${links.length} 条跨社区纤维`
      + `（强 ${sc.strong} / 中 ${sc.medium} / 弱 ${sc.weak}）`;
  }
}
function updateLabelAnchors() {
  cloudObjects.forEach(({ labelObject }) => {
    labelObject.position.x = innerWidth < 700 ? labelObject.userData.mobileX : 0;
  });
}
updateLabelAnchors();

// Each object below represents an aggregate of many real cross-topic edges.
// There is deliberately one path per cloud pair, never a visual edge per entity.
const filamentObjects = [];
function filamentProfile(strength) {
  if (strength === 'strong') return { radius: .012, opacity: .18, dustOpacity: 1.05, count: 520, spread: .22, color: '#abc9ff', bend: 2.0 };
  if (strength === 'medium') return { radius: .007, opacity: .10, dustOpacity: .62, count: 260, spread: .14, color: '#829bd2', bend: 1.25 };
  return { radius: .004, opacity: .07, dustOpacity: .30, count: 100, spread: .09, color: '#637eae', bend: .85 };
}

function createFilamentDust(curve, profile, seedValue) {
  const random = seeded(seedValue);
  const positions = new Float32Array(profile.count * 3);
  const data = new Float32Array(profile.count * 2);
  for (let i = 0; i < profile.count; i++) {
    const t = random();
    const point = curve.getPoint(t);
    const tangent = curve.getTangent(t).normalize();
    const normal = new THREE.Vector3(-tangent.y, tangent.x, 0).normalize();
    const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
    const endpointDensity = .34 + .66 * Math.pow(Math.abs(t - .5) * 2, .68);
    const radius = Math.sqrt(random()) * profile.spread * (.35 + Math.sin(Math.PI * t) * .65);
    const angle = random() * Math.PI * 2;
    point.addScaledVector(normal, Math.cos(angle) * radius);
    point.addScaledVector(binormal, Math.sin(angle) * radius);
    positions.set(point.toArray(), i * 3);
    data[i * 2] = .45 + random() * 1.15;
    data[i * 2 + 1] = endpointDensity * (.52 + random() * .48);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aData', new THREE.BufferAttribute(data, 2));
  return new THREE.Points(geometry, new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(profile.color) }, uOpacity: { value: profile.dustOpacity } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `attribute vec2 aData; varying float vAlpha; void main(){ vec4 mv=modelViewMatrix*vec4(position,1.); vAlpha=aData.y; gl_PointSize=aData.x*(138./-mv.z); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `uniform vec3 uColor; uniform float uOpacity; varying float vAlpha; void main(){ float d=length(gl_PointCoord-.5); float a=exp(-d*d*13.)*vAlpha*uOpacity; gl_FragColor=vec4(uColor,a); if(a<.01) discard; }`
  }));
}

function createWovenCurve(baseCurve, profile, seedValue) {
  const random = seeded(seedValue);
  const phaseA = random() * Math.PI * 2, phaseB = random() * Math.PI * 2;
  const frequencyA = 1.2 + random() * 1.8, frequencyB = 1.7 + random() * 2.1;
  const points = [];
  for (let step = 0; step <= 12; step++) {
    const t = step / 12;
    const point = baseCurve.getPoint(t);
    const tangent = baseCurve.getTangent(t).normalize();
    const sideways = new THREE.Vector3(-tangent.y, tangent.x, 0).normalize();
    const depth = new THREE.Vector3().crossVectors(tangent, sideways).normalize();
    // The offset collapses at both ends. It lets a filament branch out inside
    // one nebula and dissolve back into the other rather than meeting at ports.
    const envelope = Math.pow(Math.sin(Math.PI * t), .72);
    const driftA = Math.sin(t * Math.PI * 2 * frequencyA + phaseA) * profile.spread * 1.7 * envelope;
    const driftB = Math.sin(t * Math.PI * 2 * frequencyB + phaseB) * profile.spread * 1.25 * envelope;
    point.addScaledVector(sideways, driftA);
    point.addScaledVector(depth, driftB);
    points.push(point);
  }
  return new THREE.CatmullRomCurve3(points, false, 'centripetal', .42);
}

function createFilament(link, index) {
  const source = cloudById.get(link.source), target = cloudById.get(link.target);
  const start = source.group.position.clone(), end = target.group.position.clone();
  const direction = end.clone().sub(start).normalize();
  start.addScaledVector(direction, source.cloud.size * .36);
  end.addScaledVector(direction, -target.cloud.size * .36);
  const midpoint = start.clone().lerp(end, .5);
  const perpendicular = new THREE.Vector3(-direction.y, direction.x, 0).normalize();
  const profile = filamentProfile(link.strength);
  midpoint.addScaledVector(perpendicular, (index % 2 ? 1 : -1) * profile.bend);
  midpoint.z += link.strength === 'strong' ? 1.05 : .52;
  const baseCurve = new THREE.QuadraticBezierCurve3(start, midpoint, end);
  const group = new THREE.Group();
  const dustMaterials = [];
  const threadCount = link.strength === 'strong' ? 4 : 3;
  for (let thread = 0; thread < threadCount; thread++) {
    const curve = createWovenCurve(baseCurve, profile, 790 + index * 47 + thread * 13);
    const threadProfile = { ...profile, count: Math.ceil(profile.count / threadCount), spread: profile.spread * .58, dustOpacity: profile.dustOpacity / threadCount * 2.15 };
    const dust = createFilamentDust(curve, threadProfile, 1100 + index * 53 + thread * 17);
    dust.material.uniforms.uOpacity.value *= .72 + thread * .09;
    dustMaterials.push(dust.material);
    group.add(dust);
  }
  group.visible = true;
  scene.add(group);
  return { link, group, dustMaterials, curve: baseCurve, profile };
}
links.forEach((link, index) => filamentObjects.push(createFilament(link, index)));

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const status = document.getElementById('status');
const flowParticles = new Map();
let activeCloudId = null;

// 沿纤维流动的光点。
//
// 原来是一颗半径 .055 的实心白球（MeshBasicMaterial + opacity .92），在细线上
// 匀速滑动，看起来像一只虫子在爬，和星云的静穆感很违和。改成：自定义着色器画
// 的柔和圆形辉光（屏幕尺寸恒定），并沿曲线两端淡出、中段最亮——读起来像能量在
// 纤维里流动，而不是一颗球在移动。
filamentObjects.forEach((item, index) => {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3));
  const particle = new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uOpacity: { value: 0 },
      uColor: { value: new THREE.Color('#cfe2ff') },
    },
    vertexShader: `void main(){ gl_PointSize = 11.0;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform float uOpacity; uniform vec3 uColor;
      void main(){
        vec2 d = gl_PointCoord - .5; float r = length(d);
        if (r > .5) discard;
        float a = smoothstep(.5, .0, r);
        gl_FragColor = vec4(uColor, a * a * uOpacity);
      }`,
  }));
  particle.userData.offset = index * .173;
  particle.visible = false;
  scene.add(particle);
  flowParticles.set(item, particle);
});

function isConnected(link, cloudId) {
  return link.source === cloudId || link.target === cloudId;
}
let insideActive = false;
function updateHoverState() {
  if (insideActive) return;
  cloudObjects.forEach((item) => {
    const active = item.cloud.id === activeCloudId;
    const related = activeCloudId && links.some(link => isConnected(link, activeCloudId) && isConnected(link, item.cloud.id));
    const factor = !activeCloudId ? 1 : active ? 1.24 : related ? .76 : .30;
    item.veils.forEach(veil => veil.material.uniforms.uOpacity.value = veil.userData.baseOpacity * factor);
    item.starField.material.opacity = .56 * factor;
    item.core.material.opacity = .64 * (active ? 1.25 : factor);
    item.label.style.opacity = factor > .5 ? '1' : '.34';
  });
  filamentObjects.forEach((item) => {
    const connected = activeCloudId && isConnected(item.link, activeCloudId);
    const factor = !activeCloudId ? 1 : connected ? 1.62 : .16;
    item.group.visible = !insideActive;
    item.dustMaterials.forEach((material, thread) => {
      material.uniforms.uOpacity.value = item.profile.dustOpacity / item.dustMaterials.length * 2.15 * (.72 + thread * .09) * factor;
    });
    // 只控制显隐；不透明度交给 animate 做沿曲线的淡入淡出
    const particle = flowParticles.get(item);
    particle.visible = Boolean(connected);
  });
}
renderer.domElement.addEventListener('pointermove', (event) => {

function neighborsOf(id) {
  return links.filter(l => l.source === id || l.target === id)
    .sort((a, b) => b.relationCount - a.relationCount)

}

function renderPreview(cloudId) {

  const nbrs = neighborsOf(cloudId);

  dbody.innerHTML =
    `<h2 style="color:${c.color}">${c.name}</h2>
     <div class="sub">${c.entityCount} 个实体 · ${typeLine || '—'}<br>

     <div class="sec">核心实体</div>

      ).join('')}
     <div class="sec">跨社区关联 · 强度</div>
     ${nbrs.slice(0, 8).map(n => {

          `<span class="lbar"><i style="width:${pct}%;background:${col}"></i></span>` +

      }).join('')}
     <div class="cta">点击星云进入内部 · 查看 ${c.entityCount} 个实体</div>`;

function hidePreview() { detail.classList.remove('open'); }

// ── 悬浮：直接出面板（不再需要点击）──
let hoverId = null;
renderer.domElement.addEventListener('pointermove', (event) => {
  if (inside !== null || flying) return;
  pointer.x = (event.clientX / innerWidth) * 2 - 1;
  pointer.y = -(event.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

// ── 内部视图：悬浮实体 → 显示它的关系 ──
// 数据里 edges 的端点是实体 id（不是索引），所以下面按 id 过滤。
renderer.domElement.addEventListener('pointermove', (event) => {
  if (inside === null || flying) return;
  pointer.x = (event.clientX / innerWidth) * 2 - 1;
  pointer.y = -(event.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  raycaster.params.Points.threshold = 3.5;   // 世界单位下的拾取半径
  const target = overlay.userData && overlay.userData.pts;
  const hit = target ? raycaster.intersectObject(target, false)[0] : null;
  const next = (hit && hit.index !== undefined) ? hit.index : -1;
  if (next !== hoverNodeIdx) {
    hoverNodeIdx = next;
    if (next >= 0) renderInnerPreview(next); else hidePreview();
  }
});

/**
 * 悬浮实体时显示它的关系。
 */
function renderInnerPreview(nodeIdx) {
  const ud = overlay.userData;
  const data = ud && ud.data;
  if (!data) return;
  const n = data.nodes[nodeIdx];
  if (!n) return;
  const cloud = clouds[inside];
  const rels = data.edges.filter(e => e[0] === n.id || e[1] === n.id)
    .map(e => ({ other: e[0] === n.id ? e[1] : e[0], type: e[2] || '—' }));
  const byType = new Map();
  rels.forEach(r => {
    if (!byType.has(r.type)) byType.set(r.type, []);
    byType.get(r.type).push(r.other);
  });
  const evs = evidenceTable && evidenceTable[n.id];
  const evHtml = evs && evs.length
    ? '<div class="sec">证据出处</div>' + evs.map(e =>
        `<div class="ev"><div class="evsrc">${escHtml(e.src)} · 第 ${e.page} 页</div>` +
        `<div class="evtext">${escHtml(e.text)}</div></div>`).join('')
    : '<div class="sec">证据出处</div>' +
      '<div class="row"><span class="nm" style="color:rgba(160,190,235,.55)">' +
      '该实体没有直接证据</span></div>';

  dbody.innerHTML =
    `<h2 style="color:${cloud ? cloud.color : '#cfe0ff'}">${escHtml(n.id)}</h2>
     <div class="sub">${escHtml(n.t || '实体')} · 社区内关联 ${rels.length} 条<br>
       ${escHtml(cloud ? cloud.name : '')}</div>
     ${[...byType.entries()].slice(0, 5).map(([t, list]) =>
        `<div class="sec">${escHtml(t)} · ${list.length}</div>
         ${list.slice(0, 6).map(o => `<div class="row"><span class="nm">${escHtml(o)}</span></div>`).join('')}`
      ).join('')}
     ${evHtml}`;
  detail.classList.add('open');
}

// ── 清空内部图层 ──
function clearOverlay() {
  while (overlay.children.length) {
    const o = overlay.children.pop();
    o.traverse?.(c => {
      // CSS2DObject 的 DOM 元素必须手动移除。CSS2DRenderer 只会遍历仍在
      // 场景树里的对象去更新 element.style；对象一旦被 remove，它的 DOM
      // 就永久留在页面上，而且不再跟随节点移动——反复进出社区后，同一段
      // 文字会出现在好几处且位置错乱（实测）。
      if (c.isCSS2DObject && c.element && c.element.parentNode) {
        c.element.parentNode.removeChild(c.element);
      }
      if (c.geometry) c.geometry.dispose?.();
      if (c.material) {
        if (Array.isArray(c.material)) c.material.forEach(m => m.dispose?.());
        else c.material.dispose?.();
      }
    });
    overlay.remove(o);
  }
  overlay.userData = {};
}

/**
 * 内部视图的标签分配与避让。
 *
 * 每 5 帧执行一次（每帧做会因强制 reflow 拖慢渲染）：
 *   1. 按缩放级别算标签预算——相机越靠近社区中心给得越多（约 6 ~ 52 个）；
 *   2. 对全部节点算屏幕位置与权重（社区内度数 × 靠近视野中心的程度）；
 *   3. 按权重排序，把标签池里的 DOM 依次分配出去；
 *   4. 逐个做矩形碰撞检测，重叠的跳过（且不消耗槽位）。
 *
 * 这样外围节点只要被放大到视野中心同样能拿到标签，缩小时标签自动收敛；
 * 悬浮或选中的节点权重加满，一定显示。
 */
const _labelVec = new THREE.Vector3();
function layoutInnerLabels() {
  const ud = overlay.userData;
  const labels = ud && ud.labels;
  const data = ud && ud.data;
  if (!labels || !labels.length || !data || inside === null) return;

  const cx = innerWidth / 2, cy = innerHeight / 2;

  // ① 标签预算：相机到社区中心的距离相对于社区半径
  const rel = camera.position.distanceTo(ud.center) / Math.max(1e-3, ud.radius);
  const zoomT = Math.min(1, Math.max(0, (3.2 - rel) / 2.6));
  const budget = Math.round(6 + zoomT * 46);

  // ② 给全部节点打分
  let maxDeg = 1;
  for (const n of data.nodes) if ((n.d || 0) > maxDeg) maxDeg = n.d;
  const logMax = Math.log(1 + maxDeg);
  const forced = hoverNodeIdx >= 0 ? hoverNodeIdx : selectedNodeIdx;

  const cands = [];
  for (let i = 0; i < data.nodes.length; i++) {
    const n = data.nodes[i];
    _labelVec.set(ud.center.x + n.x, ud.center.y + n.y, ud.center.z + n.z).project(camera);
    if (_labelVec.z > 1 || _labelVec.z < -1) continue;
    const sx = (_labelVec.x * .5 + .5) * innerWidth;
    const sy = (-_labelVec.y * .5 + .5) * innerHeight;
    if (sx < -90 || sx > innerWidth + 90 || sy < -50 || sy > innerHeight + 50) continue;
    const dx = (sx - cx) / innerWidth, dy = (sy - cy) / innerHeight;
    const centerScore = Math.max(0, 1 - Math.hypot(dx, dy) * 1.7);
    const degScore = Math.log(1 + (n.d || 0)) / logMax;
    cands.push({
      i, sx, sy,
      w: (0.30 + 0.70 * degScore) * (0.22 + 0.78 * centerScore) + (i === forced ? 10 : 0),
    });
  }
  cands.sort((a, b) => b.w - a.w);

  // ③ 分配 DOM  ④ 碰撞避让
  const placed = [];
  let slot = 0;
  for (const c of cands) {
    const item = labels[slot];
    if (!item) break;
    const isForced = c.i === forced;
    if (!isForced && slot >= budget) break;

    const n = data.nodes[c.i];
    const text = String(n.id);
    if (item.text !== text) {          // 只在内容变化时改 DOM，避免无谓 reflow
      item.object.element.innerHTML = `<b>${escHtml(text)}</b>`;
      item.text = text;
    }
    item.object.position.set(ud.center.x + n.x, ud.center.y + n.y + 2.4, ud.center.z + n.z);
    item.object.visible = true;
    item.object.element.style.visibility = 'visible';
    item.nodeIdx = c.i;

    const w = item.object.element.offsetWidth || 90;
    const h = item.object.element.offsetHeight || 16;
    const box = { x: c.sx - w / 2, y: c.sy - h / 2, w, h };
    let hit = false;
    for (const q of placed) {
      if (box.x < q.x + q.w && box.x + box.w > q.x &&
          box.y < q.y + q.h && box.y + box.h > q.y) { hit = true; break; }
    }
    if (hit) {
      item.object.visible = false;
      item.nodeIdx = -1;
      continue;                        // 槽位不消耗，留给下一个候选
    }
    placed.push(box);
    slot++;
  }
  for (let k = slot; k < labels.length; k++) {
    labels[k].object.visible = false;
    labels[k].nodeIdx = -1;
  }
}

// ── 实体列表与搜索 ──
// 列表按社区内度数降序。点击某项：高亮环定位到该实体、相机对准它、右侧面板
// 列出它的关系；搜索框按名称子串过滤。
const sideEl = document.getElementById('side');
const searchEl = document.getElementById('search');
const listEl = document.getElementById('list');
let selectedNodeIdx = -1;
let evidenceTable = null;   // 当前社区的证据索引（实体名 → 出处列表）

function escHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function innerListHtml(filter) {
  const ud = overlay.userData;
  const data = ud && ud.data;
  if (!data) return '';
  const q = (filter || '').trim().toLowerCase();
  // 不再截断。原来卡在 400 项，最大的社区（1104 个实体）里后 700 个除非
  // 搜索命中就永远点不到；而且要让"在三维画面里点节点"也能滚到列表对应项，
  // 必须保证每一项都在列表里。
  const items = data.nodes
    .map((n, i) => ({ n, i }))
    .sort((a, b) => (b.n.d || 0) - (a.n.d || 0))
    .filter(x => !q || String(x.n.id).toLowerCase().includes(q));
  if (!items.length) {
    return '<div class="empty"><b>没有匹配的实体</b>换个更短的关键词试试</div>';
  }
  return items.map(x =>
    `<div class="item${x.i === selectedNodeIdx ? ' sel' : ''}" data-i="${x.i}">` +
    `<span class="nm">${escHtml(x.n.id)}</span>` +
    `<span class="dg">${x.n.d || 0}</span></div>`).join('');
}

function refreshInnerList() {
  listEl.innerHTML = innerListHtml(searchEl.value);
  document.body.classList.toggle('hasQuery', Boolean(searchEl.value));
}

/** 把列表滚动到某个实体并确保可见（在三维画面里点击节点时同步列表）。 */
function scrollListToNode(i) {
  let el = listEl.querySelector(`.item[data-i="${i}"]`);
  if (!el && searchEl.value) {       // 可能被搜索过滤掉了，清掉搜索再找
    searchEl.value = '';
    refreshInnerList();
    el = listEl.querySelector(`.item[data-i="${i}"]`);
  }
  if (el) el.scrollIntoView({ block: 'nearest' });
}

/**
 * 选中某个实体：放大光晕、对准相机、显示关系、列表标选中。
 * 再次点击同一个实体则取消选中。
 */
function selectNode(i) {
  const ud = overlay.userData;
  const n = ud && ud.data && ud.data.nodes[i];
  if (!n) return;

  if (i === selectedNodeIdx) {     // 重复点击同一个 → 取消标注
    clearSelection();
    return;
  }

  selectedNodeIdx = i;
  if (ud.halo) {
    ud.halo.position.set(ud.center.x + n.x, ud.center.y + n.y, ud.center.z + n.z);
    ud.halo.visible = true;
    haloAnim = { t0: performance.now(), dur: 460, base: 46, material: ud.halo.material };
  }
  // 视线平滑对准该实体。直接 set 会让画面瞬移，点完不知道视线跑哪去了；
  // from 取当前值，所以连续点击不同节点时也不会跳。
  targetAnim = {
    from: controls.target.clone(),
    to: new THREE.Vector3(ud.center.x + n.x, ud.center.y + n.y, ud.center.z + n.z),
    t0: performance.now(), dur: 260,
  };
  renderInnerPreview(i);
  [...listEl.querySelectorAll('.item')].forEach(el =>
    el.classList.toggle('sel', +el.dataset.i === i));
}

/** 取消选中：隐藏光晕、收起关系面板、清掉列表选中态，视线保持不动。 */
function clearSelection() {
  selectedNodeIdx = -1;
  haloAnim = null;
  const ud = overlay.userData;
  if (ud && ud.halo) {
    ud.halo.visible = false;
    ud.halo.material.uniforms.uOpacity.value = 0;
  }
  hidePreview();
  [...listEl.querySelectorAll('.item')].forEach(el => el.classList.remove('sel'));
}

listEl.addEventListener('click', (e) => {
  const item = e.target.closest('.item');
  if (item) selectNode(+item.dataset.i);
});
searchEl.addEventListener('input', refreshInnerList);
document.getElementById('searchClear').addEventListener('click', () => {
  searchEl.value = '';
  refreshInnerList();
  searchEl.focus();
});

// ── 渲染社区内部（实体点 + 内部边 + 核心标签）──
async function enterCommunity(ci, preloaded) {
  const cloud = clouds[ci];
  status.textContent = `正在进入「${cloud.name}」…`;
  status.classList.add('visible');
  let data = preloaded || null;
  if (!data) {
    try {
      const r = await fetch(COMM_URL(ci));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      data = await r.json();
    } catch (e) {
      status.textContent = `社区 ${ci} 内部数据加载失败：${e.message}`;
      return;
    }
  }
  clearOverlay();
  inside = ci;         // 供标签分配与 hover 判断；?c=N 直入时原本没人设置它
  // insideActive 原来从声明起就永远是 false（原型遗留，没人给它赋值），
  // 于是 updateHoverState() 里的 `group.visible = !insideActive` 恒为 true：
  // 进入社区后鼠标一移动，社区间的纤维就被重新显示出来。
  insideActive = true;

  const center = new THREE.Vector3().fromArray(cloud.position);
  const base = new THREE.Color(cloud.color);

  const R = data.meta.radius || 60;
  const dist = R * 1.9;
  // 放开 OrbitControls 的距离上限。原来 maxDistance 固定为 130，而社区半径
  // 可达 182.8，相机一进入就被硬拉回球体内部，看到的是密不透风的线网。
  controls.maxDistance = Math.max(130, dist * 1.7);

  // 实体点：半径按度数（枢纽大），颜色=社区色深浅
  const N = data.nodes.length;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const siz = new Float32Array(N);
  const maxD = Math.max(1, ...data.nodes.map(n => n.d || 1));
  data.nodes.forEach((n, k) => {
    pos[k*3]   = center.x + n.x;
    pos[k*3+1] = center.y + n.y;
    pos[k*3+2] = center.z + n.z;
    const t = Math.pow((n.d || 1) / maxD, 0.6);
    const cc = base.clone().lerp(new THREE.Color('#ffffff'), 0.16 + 0.62 * t);
    col[k*3] = cc.r; col[k*3+1] = cc.g; col[k*3+2] = cc.b;
    siz[k] = 1.5 + 7.5 * t;
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true,
    uniforms: { uScale: { value: innerHeight * 1.5 } },
    vertexShader: `attribute float aSize; varying vec3 vColor; uniform float uScale;
      void main(){ vColor=color; vec4 mv=modelViewMatrix*vec4(position,1.);
      gl_PointSize=aSize*(uScale/-mv.z); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `varying vec3 vColor;
      void main(){ vec2 d=gl_PointCoord-.5; float r=length(d); if(r>.5) discard;
      float a=smoothstep(.5,.05,r); gl_FragColor=vec4(vColor,a*.92); }`,
  });

  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  overlay.add(pts);

  // 内部边：颜色偏暗，形成结构感
  const idx = new Map(data.nodes.map((n, k) => [n.id, k]));
  const ep = new Float32Array(data.edges.length * 6);
  const ec = new Float32Array(data.edges.length * 6);
  const ec0 = base.clone().multiplyScalar(0.5);
  data.edges.forEach((e, k) => {
    const a = idx.get(e[0]), b = idx.get(e[1]);
    if (a === undefined || b === undefined) return;
    ep.set([pos[a*3],pos[a*3+1],pos[a*3+2],pos[b*3],pos[b*3+1],pos[b*3+2]], k*6);
    ec.set([ec0.r,ec0.g,ec0.b,ec0.r,ec0.g,ec0.b], k*6);
  });
  const eg = new THREE.BufferGeometry();
  eg.setAttribute('position', new THREE.BufferAttribute(ep, 3));
  eg.setAttribute('color', new THREE.BufferAttribute(ec, 3));
  const em = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true,
    opacity: 0.30, blending: THREE.AdditiveBlending, depthWrite: false });
  const lines = new THREE.LineSegments(eg, em);
  lines.frustumCulled = false;
  overlay.add(lines);

  // 标签池：预建一批 CSS2DObject，由 layoutInnerLabels 每几帧重新分配给
  // "当前最该显示"的节点。
  //
  // 为什么不固定标注 Top-N：那样只有社区中心的枢纽有标签，外围节点即使被
  // 放大到眼前也不显示。改成动态分配后候选是全部节点——谁靠近视野中心、
  // 谁度数高，谁拿到标签；缩放越大预算越多。
  const LABEL_POOL = Math.min(150, data.nodes.length);
  const labelItems = [];
  for (let k = 0; k < LABEL_POOL; k++) {
    const el = document.createElement('div');
    el.className = 'label entity';
    el.style.fontSize = '11px';
    const o = new CSS2DObject(el);
    o.position.set(center.x, center.y, center.z);
    o.visible = false;
    overlay.add(o);
    labelItems.push({ object: o, nodeIdx: -1, text: '' });
  }

  // 选中光晕：环形 + 中心亮点的圆点。
  //
  // 原来用 PointsMaterial，它把点渲染成**正方形**——屏幕上就是一个白方块把
  // 节点框住，既不直观也不好看。这里改用自定义着色器画圆环，尺寸由 haloAnim
  // 驱动，点击时有一次"放大过冲再回落"的动画。
  const haloGeo = new THREE.BufferGeometry();
  haloGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3));
  const haloMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, depthTest: false,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uSize: { value: 0 },
      uOpacity: { value: 0 },
      uColor: { value: new THREE.Color(0xffffff) },
    },
    vertexShader: `uniform float uSize;
      void main(){ gl_PointSize = uSize;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform vec3 uColor; uniform float uOpacity;
      void main(){
        vec2 d = gl_PointCoord - .5; float r = length(d);
        if (r > .5) discard;
        // 外环：一圈清晰的光边；内核：中心亮点
        float ring = smoothstep(.50, .40, r) * smoothstep(.24, .34, r);
        float core = smoothstep(.15, .0, r);
        float a = (ring * .9 + core * .55) * uOpacity;
        if (a < .004) discard;
        gl_FragColor = vec4(uColor, a);
      }`,
  });
  const halo = new THREE.Points(haloGeo, haloMat);
  halo.visible = false;
  halo.frustumCulled = false;
  overlay.add(halo);

  overlay.userData = {
    center, radius: data.meta.radius || 60,
    data, nodeIndex: idx, labels: labelItems, pts, halo,
  };

  // 概览层隐藏：按对象类型筛选更稳健（原型里没有名为 points 的全局变量，
  // 直接引用会抛 "points is not defined" 并中断 enterCommunity）。
  scene.children.forEach(o => {
    if (o === overlay || o.isCSS2DObject || o === renderer.domElement) return;
    const isOverview =
      (o.isPoints && !o.parent?.isGroup) ||
      (o.isLineSegments && !o.parent?.isGroup);
    if (isOverview) o.visible = false;
  });

  // 相机飞入（R / dist / maxDistance 已在上方算好）
  // 直接切到内部视角，不做飞入补间
  camera.position.set(center.x, center.y + R * 0.42, center.z + dist);
  controls.target.copy(center);
  controls.update();
  hintEl.textContent = '';
  status.classList.remove('visible');

  // 概览层淡出
  // 注意：CSS2DRenderer 的 renderObject 只检查对象自身的 visible，**不检查父级**，
  // 所以把 group 设为不可见并不能隐藏其中的 CSS2D 标签——必须逐个隐藏
  // labelObject，否则进入社区后概览层的社区名仍会浮在内部视图上面。
  cloudObjects.forEach(it => {
    it.group.visible = false;
    if (it.labelObject) it.labelObject.visible = false;
  });
  filamentObjects.forEach(it => { it.group.visible = false; });
  const _hideOverview = (v) => scene.children.forEach(o => {
    if (o === overlay || o.isCSS2DObject) return;
    if ((o.isPoints && !o.parent?.isGroup) || (o.isLineSegments && !o.parent?.isGroup))
      o.visible = v;
  });
  _hideOverview(false);

  innerHud.classList.add('on');
  document.body.classList.add('inside');
  document.getElementById('itName').textContent = cloud.name;
  document.getElementById('itName').style.color = cloud.color;
  // 显示数与总数相同时不必写两遍
  const shownN = data.meta.shown, totalN = data.entityCount;
  const cntText = shownN === totalN ? `${totalN} 个实体` : `${shownN} / ${totalN} 个实体`;
  document.getElementById('itSub').textContent =
    `${cntText} · ${data.meta.edges} 条内部关系`;

  // 刷新实体列表；选中态属于上一个社区，这里清空
  selectedNodeIdx = -1;
  searchEl.value = '';
  refreshInnerList();

  // 证据表放在最后加载：它带 await，若放在相机落位之前，会重新引入
  // "概览已隐藏、相机未落位"的中间态。加载失败只是少一段证据，不影响主流程。
  evidenceTable = null;
  try {
    const er = await fetch(new URL(`./kg-data/evidence-${ci}.json`, location.href).href);
    if (er.ok) evidenceTable = await er.json();
  } catch (e) { /* 没有证据表时面板少一段 */ }
}

function exitCommunity() {
  if (inside === null && !flying) return;
  // 清空内部图层（复用 clearOverlay，它同时移除 CSS2DObject 的 DOM）
  clearOverlay();
  // 恢复概览层
  scene.children.forEach(o => {
    if (o === overlay || o.isCSS2DObject) return;
    if (o.isPoints || o.isLineSegments) o.visible = true;
  });
  cloudObjects.forEach(it => {
    it.group.visible = true;
    if (it.labelObject) it.labelObject.visible = true;
  });
  filamentObjects.forEach(it => { it.group.visible = true; });
  innerHud.classList.remove('on');
  document.body.classList.remove('inside');
  controls.maxDistance = 130;      // 恢复概览层的限制
  hintEl.textContent = '拖拽旋转 · 滚轮缩放 · 悬浮预览社区 · 点击星云进入内部';
  // 直接回到概览视角，不做退出补间
  camera.position.set(0, 2.6, innerWidth < 700 ? CAM_Z_PORTRAIT : CAM_Z);
  controls.target.set(0, 0, 0);
  controls.update();
  inside = null;
  insideActive = false;
  hoverId = null;
  hidePreview();
}

let downX = 0, downY = 0, downT = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  downX = e.clientX; downY = e.clientY; downT = performance.now();
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (flying) return;
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved > 5 || performance.now() - downT > 700) return;

  // ── 内部视图：点击实体 = 与点击列表项同种效果；点空白处取消选中 ──
  if (inside !== null) {
    pointer.x = (e.clientX / innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    raycaster.params.Points.threshold = 3.5;
    const ptsTarget = overlay.userData && overlay.userData.pts;
    const nodeHit = ptsTarget ? raycaster.intersectObject(ptsTarget, false)[0] : null;
    if (nodeHit && nodeHit.index !== undefined) {
      selectNode(nodeHit.index);
      scrollListToNode(nodeHit.index);
    } else {
      clearSelection();
    }
    return;
  }

  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(cloudObjects.map(i => i.hitArea), false)[0];
  if (!hit) { hidePreview(); return; }
  const cid = hit.object.userData.cloudId;
  inside = clouds.findIndex(c => c.id === cid);
  if (inside >= 0) enterCommunity(inside);
});
document.getElementById('back').addEventListener('click', (e) => {
  e.stopPropagation(); exitCommunity();
});
addEventListener('keydown', (e) => { if (e.key === 'Escape') exitCommunity(); });

const CAM_Z = 50.2;
const CAM_Z_PORTRAIT = 105.5;

let _firstFrame = false;
let labelTick = 0;
let hoverNodeIdx = -1;      // 内部视图里当前悬浮的实体（供标签分配优先占位）
let haloAnim = null;        // 选中光晕的放大动画状态
let targetAnim = null;      // 视线缓动状态（选中实体时平滑对准，避免画面瞬移）
function animate() {
  requestAnimationFrame(animate);
  const elapsed = performance.now() * .001;

  // ── 星云缓慢漂移：在基准位置上叠加极慢的噪声位移 ──
  //   必须在 basePos 上计算（不能对当前位置累加，否则会漂走）
  cloudObjects.forEach((it, k) => {
    const bp = it.group.userData.basePos;
    if (!bp) return;
    const ph = it.group.userData.driftPhase || k;
    const amp = it.group.userData.driftAmp || 0.5;
    it.group.position.set(
      bp.x + Math.sin(elapsed * 0.11 + ph) * amp,
      bp.y + Math.cos(elapsed * 0.085 + ph * 1.3) * amp * 0.82,
      bp.z + Math.sin(elapsed * 0.07 + ph * 0.7) * amp * 0.55,
    );
    // 标签锚点跟随
    if (it.labelObject) it.labelObject.position.x = innerWidth < 700
      ? it.labelObject.userData.mobileX : 0;
  });

  // ── 相机补间已移除：进入/退出都直接落位，不做缩放动画 ──
  cloudObjects.forEach(({ veils }, index) => {
    veils.forEach((veil, layer) => {
      veil.quaternion.copy(camera.quaternion);
      veil.material.uniforms.uTime.value = elapsed + index * 3.1 + layer * 1.4;
    });
  });
  filamentObjects.forEach((item) => {
    const particle = flowParticles.get(item);
    if (!particle.visible) return;
    const t = (elapsed * .045 + particle.userData.offset) % 1;
    particle.position.copy(item.curve.getPoint(t));
    // 两端淡出、中段最亮：像能量在纤维里流动，而不是一颗球在爬
    const fade = Math.sin(Math.PI * t);
    particle.material.uniforms.uOpacity.value = .55 * fade * fade;
  });
  controls.update();

  // 选中光晕的放大动画：快速放大并轻微过冲，然后回落稳定（约 460ms）
  if (haloAnim) {
    const x = Math.min(1, (performance.now() - haloAnim.t0) / haloAnim.dur);
    const k = x < 0.68 ? (x / 0.68) * 1.22 : 1.22 - 0.22 * ((x - 0.68) / 0.32);
    const m = haloAnim.material;
    m.uniforms.uSize.value = haloAnim.base * k;
    m.uniforms.uOpacity.value = Math.min(1, x * 4.5);
    if (x >= 1) { m.uniforms.uSize.value = haloAnim.base; haloAnim = null; }
  }

  // 视线缓动：选中实体时平滑对准，避免画面瞬移（与进出社区的场景切换无关）
  if (targetAnim) {
    const x = Math.min(1, (performance.now() - targetAnim.t0) / targetAnim.dur);
    const e = 1 - Math.pow(1 - x, 3);
    controls.target.lerpVectors(targetAnim.from, targetAnim.to, e);
    if (x >= 1) targetAnim = null;
  }

  // 内部视图的标签分配：每 5 帧一次（每帧都做会因强制 reflow 拖慢渲染）
  if (inside !== null && (labelTick++ % 5 === 0)) layoutInnerLabels();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  // L0 概览首帧渲染完成即就绪。直入模式（?c=N）不在这里置位，
  // 否则 CDP 会在概览层就截图，拿到的不是内部视图。
  if (!_firstFrame) { _firstFrame = true; if (!PRE_C) window.__ready = true; }
}
animate();

// ── 直接进入某个社区：web/kg-nebula.html?c=0 ──
// 用于分享具体社区，也便于自动化截图验证内部视图。
{
  const q = new URLSearchParams(location.search);
  const c = q.get('c');
  if (c !== null && clouds[+c]) {
    const idx = +c;
    // 直入模式（?c=N）：数据已在模块顶层预取。
    // 这里刻意用**模块顶层 await** 而不是 queueMicrotask——顶层 await 会让
    // 先隐藏概览标题：CSS 过渡要 350ms，截图等不到，会截到 opacity 仍为 1 的中间态
    document.querySelector('.header').style.display = 'none';
    await enterCommunity(idx, PRE_DATA);
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
    // 供 tools/cdp_shot.py 判定"内部视图已渲染完成"，避免抓帧时机竞争
    window.__ready = true;
  }
}

// ── 供自动化验证使用的调试接口（见 tools/cdp_check_labels.py）──
window.KGNebula = {
  enter: (i) => enterCommunity(i),
  exit: () => exitCommunity(),
  labelCount: () => document.querySelectorAll('.label').length,
  select: (i) => selectNode(i),
  clear: () => clearSelection(),
  listCount: () => document.querySelectorAll('#list .item').length,
  haloOn: () => Boolean(overlay.userData && overlay.userData.halo && overlay.userData.halo.visible),
  panelOpen: () => document.getElementById('detail').classList.contains('open'),
  subText: () => document.getElementById('itSub').textContent,
  target: () => controls.target.toArray().map(v => +v.toFixed(2)),
  // 供自动化验证：内部视图下仍可见的概览层对象数（应为 0）
  overviewLeak: () => {
    let n = 0;
    scene.children.forEach(o => {
      if (o === overlay || o.isCSS2DObject || o === renderer.domElement) return;
      if (o.isLight || o.isCamera) return;
      if (o.visible && (o.isPoints || o.isLineSegments) && !o.parent?.isGroup) n++;
    });
    cloudObjects.forEach(it => { if (it.group.visible) n++; });
    filamentObjects.forEach(it => { if (it.group.visible) n++; });
    return n;
  },
  // 供自动化验证：某实体在屏幕上的坐标（用于派发点击事件）
  nodeScreen: (i) => {
    const ud = overlay.userData;
    if (!ud || !ud.data || !ud.data.nodes[i]) return null;
    const n = ud.data.nodes[i];
    const v = new THREE.Vector3(ud.center.x + n.x, ud.center.y + n.y, ud.center.z + n.z)
      .project(camera);
    return {
      x: (v.x * .5 + .5) * innerWidth,
      y: (-v.y * .5 + .5) * innerHeight,
      z: v.z,
    };
  },
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  fitCloudOverviewToViewport();
  updateLabelAnchors();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
</script>
