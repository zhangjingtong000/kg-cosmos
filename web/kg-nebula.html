<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KG Cosmos · 社区星云</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050914; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  /* 背景改为纯色 + 极弱的径向层次。原来是 deep-space-galaxy.html 这个 iframe
     （一层会动的星空），按用户要求把所有星星删掉了，只留一点空间感。 */
  body { background: radial-gradient(ellipse 120% 80% at 50% 8%, #0b1428 0%, #060b18 46%, #04070f 100%); }
  /* 只针对 three.js 的渲染画布，**不能写成裸 `canvas`**：
     PDF 抽屉里的 `#pdfCanvas` 也是 canvas，会同被 `position:fixed; inset:0`
     钉到全屏，于是它的绘制原点与文本层错开——实测文本层相对画布偏移 403px，
     高亮框落在错误的行上。three 的画布在运行时由 renderer.domElement 创建，
     故在下面创建后给它挂 id。 */
  #scene-canvas { position: fixed; inset: 0; display: block; }
  .label { color: rgba(239,246,255,.9); font-size: 12px; letter-spacing: .025em; text-align: center; white-space: nowrap; pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,.95), 0 0 14px rgba(8,20,45,.9); }
  /* 实体标签加半透明底板。社区 Triple 的节点与边是浅蓝（#e0a469），
     白色文字直接压在上面几乎读不出来；底板让标签不受底图颜色影响。 */
  .label.entity {
    background: rgba(5, 9, 20, .72);
    border: 1px solid rgba(255, 255, 255, .07);
    border-radius: 5px;
    padding: 2px 6px 3px;
    box-shadow: 0 1px 7px rgba(0, 0, 0, .55);
  }
  /* 概览层的社区标签也补一层**更轻**的底板。
     原先它只有 text-shadow——而社区名正好落在加色混合（AdditiveBlending）的
     星云亮区上，那里的背景亮度接近纯白，白字对比度很低。
     底板比实体标签淡一些，既提对比度，又不至于把星云压成一排色板。 */
  .label:not(.entity) {
    background: rgba(5, 9, 20, .44);
    border-radius: 7px;
    padding: 3px 10px 4px;
  }
  .label b { display: block; font-size: 13px; font-weight: 550; }
  .label small { display: block; margin-top: 4px; color: rgba(229,231,237,.58); font-size: 10px; }
  .header { position: fixed; inset: 28px auto auto 32px; z-index: 3; color: rgba(232,241,255,.88); pointer-events: none; transition: opacity .35s ease; }
  /* 进入社区后隐藏概览层的标题，否则会和内部视图的返回按钮叠在一起 */
  body.inside .header { opacity: 0; }
  .header small { display: block; color: rgba(198,201,213,.54); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .header h1 { margin: 6px 0 0; font-size: 18px; font-weight: 520; letter-spacing: .04em; }
  .hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); color: rgba(228,230,236,.42); font-size: 11px; letter-spacing: .05em; pointer-events: none; }
  .status { position: fixed; left: 50%; top: 28px; transform: translate(-50%, -12px); color: rgba(236,245,255,.94); font-size: 13px; opacity: 0; transition: opacity .35s ease, transform .35s ease; pointer-events: none; text-shadow: 0 0 16px rgba(181,183,189,.65); }
  .status.visible { opacity: 1; transform: translate(-50%, 0); }
  /* ── 悬浮详情面板 ── */
  #detail { position: fixed; right: 22px; top: 22px; width: 306px; max-height: calc(100vh - 44px);
            overflow-y: auto; z-index: 6; padding: 16px 18px; border-radius: 12px;
            background: rgba(8, 13, 30, .90); border: 1px solid rgba(178,181,194, .22);
            backdrop-filter: blur(10px); color: #dfe8ff;
            transform: translateX(22px); opacity: 0; pointer-events: none;
            transition: opacity .24s ease, transform .24s ease; }
  #detail.open { opacity: 1; transform: none; }
  #detail h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  #detail .sub { font-size: 11px; color: rgba(198,201,213, .62); margin-bottom: 10px; line-height: 1.6; }
  #detail .sec { font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
                 color: rgba(198,201,213, .72); margin: 14px 0 6px;
                 padding-bottom: 4px; border-bottom: 1px solid rgba(178,181,194, .1); }
  #detail .row { display: flex; align-items: baseline; gap: 8px; font-size: 12px;
                 padding: 3px 0; border-bottom: 1px solid rgba(178,181,194, .07); }
  #detail .row:last-child { border-bottom: 0; }
  #detail .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #detail .row .dg { color: rgba(198,201,213, .55); font-size: 11px;
                     font-variant-numeric: tabular-nums; }
  #detail .link { display: flex; align-items: center; gap: 7px; font-size: 12px; padding: 4px 0; }
  #detail .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto;
                 box-shadow: 0 0 6px currentColor; }
  /* 关联强度条：一眼看出哪个社区与本社区关系最强 */
  #detail .lname { flex: 0 1 auto; max-width: 48%; overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap;
                   color: rgba(222,225,233, .92); }
  #detail .lbar { flex: 1 1 auto; height: 3px; border-radius: 2px; min-width: 26px;
                  background: rgba(178,181,194, .13); overflow: hidden; }
  #detail .lbar i { display: block; height: 100%; border-radius: 2px; opacity: .85; }
  #detail .cnt { flex: 0 0 auto; min-width: 30px; text-align: right;
                 color: rgba(206, 222, 246, .85); font-size: 11px;
                 font-variant-numeric: tabular-nums; }
  #detail .cta { margin-top: 12px; font-size: 11px; color: rgba(170,174,188, .85);
                 border-top: 1px solid rgba(178,181,194, .12); padding-top: 9px; }
  /* 证据出处：论文 + 页码 + 原文片段 */
  #detail .ev { margin: 7px 0 10px; padding-left: 9px;
                border-left: 2px solid rgba(178,181,194, .28); }
  #detail .evsrc { font-size: 11px; color: rgba(170,174,188, .82); margin-bottom: 3px; }
  #detail .evtext { font-size: 11.5px; line-height: 1.62; color: rgba(223,225,231, .74); }
  #stat { margin-top: 7px; font-size: 11px; color: rgba(198,201,213, .58); }

  /* ── 内部视图 HUD ── */
  #inner { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0;
           transition: opacity .45s ease; }
  #inner.on { opacity: 1; }
  /* 标题加深色底板：社区中心是上千个实体的亮核，白字直接压上去读不出来 */
  #innerTitle { position: fixed; left: 50%; top: 20px; transform: translateX(-50%);
                text-align: center; padding: 6px 16px 8px; border-radius: 10px;
                background: rgba(5, 9, 20, .62); backdrop-filter: blur(6px); }
  #innerTitle b { display: block; font-size: 17px; font-weight: 560; letter-spacing: .02em; }
  #innerTitle small { display: block; margin-top: 5px; font-size: 11px;
                      color: rgba(198,201,213, .6); }
  #back { position: fixed; left: 26px; top: 26px; pointer-events: auto; cursor: pointer;
          background: rgba(8, 13, 30, .86); border: 1px solid rgba(178,181,194, .28);
          color: #d6d9e2; border-radius: 9px; padding: 8px 14px; font-size: 12px;
          backdrop-filter: blur(8px); }
  #back:hover { border-color: rgba(170,174,188, .6); color: #fff; }

  /* ── 「只看分歧」按钮（2026-09-15 加，P7）────────────────────────────
     放在 #back 右侧（#back 是 left:26px，宽约 130px ⇒ 168px 起不重叠）。
     用暖橙描边与 CONTRADICTS 边的颜色呼应；aria-pressed=true 时填实，
     让"当前正处在筛选态"这件事一眼可见 —— 否则用户会以为数据少了。 */
  #onlyContra { position: fixed; left: 172px; top: 26px; pointer-events: auto; cursor: pointer;
                background: rgba(8, 13, 30, .86); border: 1px solid rgba(255,122,69, .42);
                color: #ffb08a; border-radius: 9px; padding: 8px 14px; font-size: 12px;
                backdrop-filter: blur(8px); }
  #onlyContra:hover { border-color: rgba(255,122,69, .8); color: #ffd0b8; }
  #onlyContra[aria-pressed="true"] { background: rgba(255,122,69, .22);
                                     border-color: rgba(255,122,69, .9); color: #fff; }
  #onlyContra[hidden] { display: none; }

  /* ── 内部视图的实体列表与搜索 ── */
  #side { position: fixed; left: 22px; top: 74px; bottom: 18px; width: 236px; z-index: 4;
          display: flex; flex-direction: column; gap: 8px;
          opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  body.inside #side { opacity: 1; pointer-events: auto; }
  #searchWrap { position: relative; flex: 0 0 auto; }
  #search { width: 100%; background: rgba(8, 13, 30, .88);
            border: 1px solid rgba(178,181,194, .26); color: #dbe7ff;
            border-radius: 8px; padding: 8px 30px 8px 10px; font: inherit;
            font-size: 12px; outline: none; }
  #search:focus { border-color: rgba(170,174,188, .62); }
  #search::placeholder { color: rgba(170,174,188, .45); }
  /* 清除按钮：只在有内容时出现 */
  #searchClear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
                 width: 19px; height: 19px; padding: 0; border: 0; border-radius: 50%;
                 background: rgba(178,181,194, .16); color: #d6d9e2; cursor: pointer;
                 font-size: 13px; line-height: 1; display: none; }
  #searchClear:hover { background: rgba(178,181,194, .34); color: #fff; }
  body.hasQuery #searchClear { display: block; }
  #list { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
          background: rgba(8, 13, 30, .74); border: 1px solid rgba(178,181,194, .16);
          border-radius: 10px; padding: 4px;
          scrollbar-width: thin; scrollbar-color: rgba(178,181,194,.3) transparent; }
  #list .item { display: flex; align-items: baseline; gap: 8px; padding: 5px 8px;
                border-radius: 6px; cursor: pointer; font-size: 12px;
                color: rgba(222,225,233, .88); }
  #list .item:hover { background: rgba(178,181,194, .14); color: #fff; }
  #list .item.sel { background: rgba(178,181,194, .24); color: #fff; }
  #list .item .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .item .dg { color: rgba(170,174,188, .6); font-size: 11px; font-variant-numeric: tabular-nums; }
  #list .empty { padding: 20px 10px; text-align: center; font-size: 12px;
                 line-height: 1.75; color: rgba(170,174,188, .5); }
  #list .empty b { display: block; margin-bottom: 5px; font-weight: 500;
                   color: rgba(225,227,233, .78); }

  /* ── 统一着色引擎的图例（T6.4）──
     引擎把着色拆成两个正交维度：Partition（离散分区→基色）×
     Ranking（连续排序→基色向白的插值量）。图例必须同时显示这两件事，
     否则用户看不出"这个颜色现在代表什么"。 */
  #legend { position: fixed; right: 22px; bottom: 18px; width: 236px; z-index: 4;
            max-height: 62vh; overflow: hidden; opacity: 0; pointer-events: none;
            transition: opacity .3s ease;
            background: rgba(8, 13, 30, .84); border: 1px solid rgba(178,181,194, .18);
            border-radius: 10px; padding: 10px 12px 11px; color: #dfe8ff;
            backdrop-filter: blur(8px); }
  body.inside #legend { opacity: 1; pointer-events: auto; }
  #legend .lg-h { font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
                  color: rgba(198,201,213, .7); margin-bottom: 8px; }
  #legend .lg-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  #legend .lg-lab { font-size: 10px; color: rgba(170,174,188, .6); flex: 0 0 26px; }
  #legend .seg { display: flex; gap: 3px; flex: 1 1 auto; }
  #legend .seg button { flex: 1 1 0; background: rgba(178,181,194, .10);
                        border: 1px solid rgba(178,181,194, .16);
                        color: rgba(234,236,242, .78); border-radius: 6px;
                        padding: 3px 0; font: inherit; font-size: 10.5px; cursor: pointer; }
  #legend .seg button:hover { background: rgba(178,181,194, .22); color: #fff; }
  #legend .seg button.on { background: rgba(178,181,194, .34);
                           border-color: rgba(205,207,213, .58); color: #fff; }
  /* 列表自己滚动，而不是让整个图例滚动：否则条目一多，底部的排序色带
     与说明会被滚出视野，而"亮度代表什么"恰恰是图例最该常驻的部分。 */
  #legend .lg-list { margin-top: 9px; max-height: 30vh; overflow-y: auto;
                     padding-right: 2px;
                     scrollbar-width: thin; scrollbar-color: rgba(178,181,194,.3) transparent; }
  #legend .lg-item { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  #legend .lg-sw { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto;
                   box-shadow: 0 0 5px currentColor; }
  #legend .lg-nm { flex: 0 1 auto; min-width: 0; max-width: 42%; overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap;
                   color: rgba(222,225,233, .86); font-size: 11px; }
  #legend .lg-bar { flex: 1 1 18px; height: 3px; border-radius: 2px;
                    background: rgba(178,181,194, .13); overflow: hidden; }
  #legend .lg-bar i { display: block; height: 100%; border-radius: 2px; opacity: .9; }
  #legend .lg-n { flex: 0 0 auto; color: rgba(198,201,213, .62); font-size: 10px;
                  font-variant-numeric: tabular-nums; }
  #legend .lg-ramp { display: flex; align-items: center; gap: 6px; margin-top: 9px;
                     padding-top: 8px; border-top: 1px solid rgba(178,181,194, .1); }
  #legend .lg-ramp .bar { flex: 1 1 auto; height: 6px; border-radius: 3px; }
  #legend .lg-ramp span { font-size: 10px; color: rgba(170,174,188, .55); }
  #legend .lg-note { margin-top: 7px; font-size: 10px; line-height: 1.5;
                     color: rgba(170,174,188, .5); }

  /* ── 原文 PDF 抽屉（T6.2 证据深链）──
     选型说明：原计划的 `react-pdf-highlighter` 是 React 组件，与本项目
     无构建链的原生 HTML/JS 前端不匹配。改用 **Chrome/Edge 内置 PDF 查看器
     的 URL 片段**：`#page=N` 跳页、`#search=文本` 自动定位并高亮。
     零依赖、零成本，且高亮是查看器原生行为，不需要自己画。 */
  #pdfPane { position: fixed; top: 0; right: 0; bottom: 0; z-index: 7;
             width: min(60vw, 780px); display: flex; flex-direction: column;
             background: #0a1020; border-left: 1px solid rgba(178,181,194, .2);
             box-shadow: -18px 0 48px rgba(0, 0, 0, .5);
             transform: translateX(101%);
             transition: transform .34s cubic-bezier(.22, .61, .36, 1); }
  #pdfPane.open { transform: none; }
  #pdfPane .pdf-head { flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
                       padding: 11px 14px; border-bottom: 1px solid rgba(178,181,194, .14); }
  #pdfPane .pdf-head b { flex: 1 1 auto; min-width: 0; overflow: hidden;
                         text-overflow: ellipsis; white-space: nowrap;
                         font-size: 12.5px; font-weight: 520; color: #dfe8ff; }
  #pdfPane .pdf-head a { flex: 0 0 auto; font-size: 11.5px; color: #caccd2;
                         text-decoration: none; border: 1px solid rgba(178,181,194, .26);
                         border-radius: 7px; padding: 4px 9px; }
  #pdfPane .pdf-head a:hover { border-color: rgba(205,207,213, .6); color: #fff; }
  #pdfPane .pdf-head button { flex: 0 0 auto; width: 26px; height: 26px; padding: 0;
                              border: 0; border-radius: 50%; cursor: pointer;
                              background: rgba(178,181,194, .16); color: #d6d9e2;
                              font-size: 15px; line-height: 1; }
  #pdfPane .pdf-head button:hover { background: rgba(178,181,194, .34); color: #fff; }
  /* 页码步进按钮排在一起，与关闭按钮区分开 */
  #pdfPane .pdf-head #pdfPrev, #pdfPane .pdf-head #pdfNext {
    border-radius: 6px; width: 24px; height: 24px; font-size: 14px; }
  #pdfPane .pdf-head #pdfPageInfo { flex: 0 0 auto; font-size: 11.5px;
    color: rgba(198,201,213,.75); font-variant-numeric: tabular-nums; min-width: 52px;
    text-align: center; }
  /* PDF 自绘区：canvas 与文本层叠放，文本层透明只用于承载高亮与选择 */
  #pdfView { flex: 1 1 auto; position: relative; overflow: auto;
             background: #14171c; padding: 14px 0; }
  #pdfView canvas { display: block; margin: 0 auto;
                    box-shadow: 0 6px 26px rgba(0,0,0,.55); }
  #pdfTextLayer { position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
                  pointer-events: none; }
  #pdfTextLayer span { position: absolute; white-space: pre; color: transparent;
                       transform-origin: 0 0; }
  /* 证据句高亮：底色 + 下划线，与星云页的深色主题一致 */
  #pdfTextLayer span.hl { background: rgba(255, 214, 120, .34);
                          box-shadow: 0 0 0 1px rgba(255, 214, 120, .55) inset;
                          border-radius: 2px; }
  #pdfPane .pdf-note { flex: 0 0 auto; padding: 6px 14px 9px; font-size: 10.5px;
                       color: rgba(170,174,188,.5); border-top: 1px solid rgba(178,181,194,.1); }
  /* 证据行里的"在原文中查看"入口 */
  #detail .evlink { margin-left: 6px; font-size: 10.5px; color: #caccd2;
                    text-decoration: none; border-bottom: 1px dashed rgba(202,204,210, .4); }
  #detail .evlink:hover { color: #fff; border-bottom-color: rgba(255, 255, 255, .7); }

/* ==KG_EXPORT_V1== */
#kgExport{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;gap:6px;
  align-items:center;font:11.5px/1 "Inter",system-ui,sans-serif}
#kgExport .lbl{color:rgba(193,195,201,.46);letter-spacing:.18em;text-transform:uppercase;
  margin-right:4px;font-size:9.5px}
#kgExport button{
  appearance:none;cursor:pointer;padding:7px 11px;border-radius:8px;
  border:1px solid rgba(178,180,186,.16);background:rgba(10,14,26,.66);
  color:rgba(203,218,241,.82);font:inherit;letter-spacing:.04em;
  backdrop-filter:blur(8px);transition:border-color .25s,color .25s,background .25s}
#kgExport button:hover{border-color:rgba(224,164,105,.46);color:#fff;
  background:rgba(20,26,42,.82)}
#kgExport button:focus-visible{outline:2px solid #e0a469;outline-offset:2px}
#kgExport .ok{color:#7cc0b6;border-color:rgba(124,192,182,.4)}
@media (max-width:760px){#kgExport .lbl{display:none}}
/* ==KG_EXPORT_V1_END== */

/* ==KG_FLAG_V1== */
#dbody .flagbar{margin:18px 0 4px;padding-top:14px;border-top:1px solid rgba(178,180,186,.16)}
#dbody .flagbar .qh{display:block;font-size:11px;color:rgba(193,195,201,.46);
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px}
#dbody .flagbar .btns{display:flex;gap:7px;flex-wrap:wrap}
#dbody .flagbar button{
  appearance:none;cursor:pointer;padding:6px 10px;border-radius:7px;
  border:1px solid rgba(178,180,186,.18);background:rgba(255,255,255,.03);
  color:rgba(203,218,241,.8);font:11.5px/1 inherit;letter-spacing:.02em;
  transition:border-color .22s,color .22s,background .22s}
#dbody .flagbar button:hover{border-color:rgba(224,164,105,.5);color:#fff}
#dbody .flagbar button:focus-visible{outline:2px solid #e0a469;outline-offset:2px}
#dbody .flagbar button[disabled]{opacity:.45;cursor:default}
#dbody .flagbar .ok{color:#7cc0b6;border-color:rgba(124,192,182,.45)}
#dbody .flagbar .no{color:#dda07a;border-color:rgba(221,160,122,.45)}
#dbody .flagbar .msg{margin-top:9px;font-size:11px;color:rgba(193,195,201,.5);line-height:1.6}
/* K1：改名并提交改图计划。用金色（= 需要留意的动作）与"只记录"的按钮区分开。 */
#dbody .editrow{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(178,180,186,.16)}
#dbody .editrow .editin{display:flex;gap:7px;margin-top:7px}
#dbody .editrow input{flex:1;min-width:0;background:rgba(8,13,30,.6);
  border:1px solid rgba(178,181,194,.28);border-radius:8px;padding:6px 9px;
  color:#e4e6ec;font-size:12px;font-family:inherit}
#dbody .editrow input:focus-visible{outline:2px solid #e0a469;outline-offset:1px}
#dbody .editrow button{background:transparent;border:1px solid rgba(224,164,105,.42);
  color:#e0a469;border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer}
#dbody .editrow button:hover{border-color:rgba(224,164,105,.8);color:#fff}
#dbody .editrow button:disabled{opacity:.45;cursor:default}
#dbody .editrow .editmsg{margin-top:7px}
/* B6（2026-09-16）：社区摘要。字号与行高刻意区别于其余部分 ——
   它是"一段话"，而详情面板其余内容是"一行一条"的列表。 */
#dbody .sumtext{font-size:12.5px;line-height:1.75;color:rgba(224,226,234,.9);
  margin:2px 0 6px}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
// pdf.js 走本地（见 web/lib/pdfjs/），不走 CDN——「离线演示铁律」要求。
import * as pdfjsLib from './lib/pdfjs/pdf.min.mjs';

// ══════════════════════════════════════════════════════════════
// 数据：真实 Louvain 社区 + 跨社区纤维（概览层）
//       社区内部实体与边按需加载（进入星云时）——概览刻意不画实体级边，
//       否则上万条边会把画面糊成一片。
// ══════════════════════════════════════════════════════════════
// 数据加载走 web/lib/kg-api.js：**优先后端 API**（/api/kg/<name>），
// 失败回退静态 kg-data/。前者证明前后端真的连通（此前 5 个 API 端点一个都没被
// 前端调用过），后者保证断网/纯静态站演示时照常可用。
const DATA_URL = './kg-data/filaments.json';   // 仅用于报错文案
const COMM_URL = (i) => `comm-${i}.json`;
let clouds, links, META;
try {
  const payload = await KGData.kg('filaments.json');
  clouds = payload.clouds; links = payload.links; META = payload.meta || {};
  console.log(`载入 ${clouds.length} 社区 / ${links.length} 纤维`);
} catch (err) {
  document.body.insertAdjacentHTML('beforeend',
    `<div style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
      color:#dfe8ff;font:13px/1.75 system-ui;background:rgba(8,12,28,.95);
      border:1px solid rgba(178,181,194,.3);border-radius:10px;padding:18px 22px;z-index:9">
      载入数据失败：${err.message}<br><br>需用 HTTP 打开（在项目根执行）：<br>
      <code>python -m http.server 8098 --bind 127.0.0.1</code><br>
      访问 <code>http://localhost:8098/web/kg-nebula.html</code></div>`);
  throw err;
}

// ── ?c=N 直入：在模块顶层预取社区内部数据 ──
// 顶层 await 会推迟 load 事件，headless 截图因此能等到数据就绪；
// 正常交互进入时 PRE_DATA 为 null，走 enterCommunity 里的 fetch 分支。
const PRE_C = new URLSearchParams(location.search).get('c');
const PRE_DATA = (PRE_C !== null && clouds[+PRE_C])
  ? await KGData.kg(COMM_URL(+PRE_C))
  : null;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 2.6, 50.2);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true,
  // 导出 PNG 需要它：否则渲染缓冲在合成后被清空，toBlob() 会拿到全透明图。
  preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
// 挂 id 让 CSS 能只针对这张画布做全屏定位；不能依赖裸 `canvas` 选择器，
// 否则 PDF 抽屉里的 #pdfCanvas 也会被钉成全屏（见样式表里的说明）。
renderer.domElement.id = 'scene-canvas';
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:2;';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 130;
controls.target.set(0, 0, 0);
function fitCloudOverviewToViewport() {
  // The overview is a wide constellation. On a portrait viewport, move the
  // camera back instead of clipping clouds or their labels at the side edges.
  camera.position.z = innerWidth < 700 ? 105.5 : 50.2;
}
fitCloudOverviewToViewport();

scene.add(new THREE.AmbientLight('#adafb5', 1.35));
const rimLight = new THREE.PointLight('#dfe1e7', 24, 40); rimLight.position.set(-4, 8, 8); scene.add(rimLight);
const warmLight = new THREE.PointLight('#ffca8a', 14, 35); warmLight.position.set(10, -5, 6); scene.add(warmLight);

const cloudById = new Map();
const cloudObjects = [];
function seeded(seed) { let state = seed >>> 0; return () => ((state = (state * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ⚠️ 关于 bloom 的一条约束（调研结论，当前实现尚未引入 bloom，先记在这里）。
//
// 下面这些 FBM 星云幕是**直接画进渲染目标**的，而 bloom 是**全屏阈值后处理**：
// 一旦引入 EffectComposer + UnrealBloomPass，整屏的星云亮雾都会被算进阈值，
// 结果是"边一多整屏泛白"，星云幕会把节点和标签一起糊掉。
// 调研原文的建议是：**避免对边和背景也开 bloom**，正确姿势是
// **阈值调高、只让节点溢光、背景保持纯黑**。
//
// 因此若将来要加辉光，必须**分层**：
//   ① 布局/星云幕/纤维 → 单独的 pass，不进 bloom；
//   ② 节点与选中光晕 → 另一层，只对这一层做 bloom；
//   ③ 或改用 additive 的 sprite 光晕（当前选中光晕就是这么做的），根本不上后处理。
// 不走分层而上一个全局 UnrealBloomPass，是这一处最容易踩的坑。

const NEBULA_NOISE = `
  float hash21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float noise2(vec2 p) {
    vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash21(i), hash21(i + vec2(1., 0.)), f.x), mix(hash21(i + vec2(0., 1.)), hash21(i + vec2(1., 1.)), f.x), f.y);
  }
  float fbm(vec2 p) {
    float value = 0., amplitude = .54;
    for (int i = 0; i < 5; i++) { value += noise2(p) * amplitude; p = p * 2.04 + vec2(3.7, 1.9); amplitude *= .5; }
    return value;
  }
`;

function createNebulaVeil(color, seedValue, size, opacity, stretch, zOffset) {
  const material = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: color }, uSeed: { value: seedValue }, uOpacity: { value: opacity },
      uStretch: { value: stretch }, uTime: { value: 0 }
    },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec2 vUv; uniform vec3 uColor; uniform float uSeed, uOpacity, uStretch, uTime;
      ${NEBULA_NOISE}
      void main() {
        vec2 frame = (vUv - .5) * 2.;
        vec2 p = frame; p.x *= uStretch;
        vec2 q = p * 1.42 + vec2(uSeed * 2.1, uSeed * .71);
        vec2 warp = vec2(fbm(q + uTime * .004), fbm(q + vec2(7.1, 2.3) - uTime * .003));
        float mass = fbm(q + warp * 1.35);
        float detail = fbm(q * 2.8 - warp * .62 + 4.4);
        float radius = length(p + (warp - .5) * .42);
        // The veil is rendered on a rectangle, but the gas must never reveal that
        // carrier. This independent noisy radial mask removes every hard canvas edge.
        float edgeNoise = (fbm(frame * 2.2 + vec2(uSeed * 4.6, 3.2)) - .5) * .16;
        float frameMask = smoothstep(1.02, .66, length(frame) + edgeNoise);
        float body = smoothstep(.14, .68, mass) * smoothstep(1.16, .16, radius);
        float wisps = smoothstep(.54, .78, detail) * smoothstep(1.08, .28, radius);
        float dust = smoothstep(.58, .78, fbm(q * 4.3 + 9.7));
        float alpha = (body * .82 + wisps * .48) * (1. - dust * .44) * frameMask * uOpacity;
        vec3 color = uColor * (.36 + mass * 1.55 + detail * .24);
        // Additive blending applies source alpha itself. Do not premultiply here,
        // otherwise the diffuse gas is unintentionally dimmed a second time.
        gl_FragColor = vec4(color, alpha);
        if (alpha < .008) discard;
      }
    `
  });
  const veil = new THREE.Mesh(new THREE.PlaneGeometry(size * 2.55, size * 2.55, 1, 1), material);
  veil.position.z = zOffset;
  veil.userData.baseOpacity = opacity;
  return veil;
}

function createCloud(cloud, index) {
  const random = seeded(320 + index);
  const group = new THREE.Group();
  const color = new THREE.Color(cloud.color);
  const veils = [
    createNebulaVeil(color, index * 1.71 + .3, cloud.size, .44, .76 + random() * .56, -.12),
    createNebulaVeil(color.clone().lerp(new THREE.Color('#eef0f6'), .22), index * 2.37 + 3.9, cloud.size * .86, .27, 1.04 + random() * .42, .05),
    createNebulaVeil(color.clone().lerp(new THREE.Color('#86888e'), .20), index * 4.11 + 1.2, cloud.size * 1.08, .19, .64 + random() * .48, .17)
  ];
  veils.forEach(veil => group.add(veil));

  // Stars follow an ellipsoidal density, not a geometric ring. The densest area
  // remains near the cloud's irregular luminous core and fades naturally outward.
  const points = new Float32Array(300 * 3);
  for (let i = 0; i < 300; i++) {
    const angle = random() * Math.PI * 2;
    const radius = Math.sqrt(-2 * Math.log(Math.max(.001, random()))) * cloud.size * .24;
    points[i * 3] = Math.cos(angle) * radius * (1.05 + random() * .32);
    points[i * 3 + 1] = Math.sin(angle) * radius * (.52 + random() * .25);
    points[i * 3 + 2] = (random() - .5) * cloud.size * (.20 + random() * .16);
  }
  const stars = new THREE.BufferGeometry();
  stars.setAttribute('position', new THREE.BufferAttribute(points, 3));
  const starField = new THREE.Points(stars, new THREE.PointsMaterial({ color: color.clone().lerp(new THREE.Color('#ffffff'), .34), size: .038, transparent: true, opacity: .56, depthWrite: false, blending: THREE.AdditiveBlending }));
  group.add(starField);
  const core = new THREE.Mesh(new THREE.SphereGeometry(cloud.size * .052, 20, 20), new THREE.MeshBasicMaterial({ color: color.clone().lerp(new THREE.Color('#ffffff'), .36), transparent: true, opacity: .64, blending: THREE.AdditiveBlending, depthWrite: false }));
  core.userData.cloudId = cloud.id;
  group.add(core);
  const hitArea = new THREE.Mesh(new THREE.SphereGeometry(cloud.size * .72, 18, 18), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  hitArea.userData.cloudId = cloud.id;
  group.add(hitArea);
  group.position.fromArray(cloud.position);
  // 记录基准位置与相位：漂移在基准上叠加，禁止累积（否则会飘走）
  group.userData.basePos = new THREE.Vector3().fromArray(cloud.position);
  group.userData.driftPhase = index * 1.37;
  group.userData.driftAmp = 0.55 + (index % 4) * 0.22;

  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `<b>${cloud.name}</b><small>${cloud.entityCount} 实体${cloud.topType ? ' · ' + cloud.topType : ''}</small>`;
  const labelObject = new CSS2DObject(label);
  labelObject.position.set(0, cloud.size * .92, 0);
  labelObject.userData.mobileX = cloud.position[0] < 0 ? cloud.size * .72 : cloud.position[0] > 0 ? -cloud.size * .72 : 0;
  group.add(labelObject);

  scene.add(group);
  const item = { cloud, group, core, hitArea, veils, starField, label, labelObject };
  cloudById.set(cloud.id, item);
  cloudObjects.push(item);
}
clouds.forEach(createCloud);
{
  const _st = document.getElementById('stat');
  if (_st) {
    const total = clouds.reduce((a, c) => a + c.entityCount, 0);
    const sc = { strong: 0, medium: 0, weak: 0 };
    links.forEach(l => { sc[l.strength] = (sc[l.strength] || 0) + 1; });
    _st.textContent = `${clouds.length} 个社区 · ${total} 实体 · ${links.length} 条跨社区纤维`
      + `（强 ${sc.strong} / 中 ${sc.medium} / 弱 ${sc.weak}）`;
  }
}
function updateLabelAnchors() {
  cloudObjects.forEach(({ labelObject }) => {
    labelObject.position.x = innerWidth < 700 ? labelObject.userData.mobileX : 0;
  });
}
updateLabelAnchors();

/**
 * 概览层社区标签的**可读性处理**（调研里的"CSS2D 深度遮挡"在本项目落地为这一版）。
 *
 * 【先说清楚为什么不是"射线-球遮挡"】
 *   调研指出的 CSS2D 硬伤是"不参与深度遮挡，球后面的标签会透出来"。
 *   我第一版照此实现了「相机→标签的射线 vs 其他社区核心球」的解析求交，
 *   但**实测 occludedCount() 恒为 0**。查数据才明白：
 *   18 个社区用斐波那契球面分布在半径 270~810 的球壳上，相邻间距约 188
 *   世界单位，而社区可视半径只有 `size * 1.4` ≈ 4.8 —— **相差 40 倍**，
 *   这个布局下社区之间根本不会互相遮挡。照搬建议而不核对自己的空间尺度，
 *   就会做出一个"跑得通但永远不触发"的功能。
 *
 * 【那实际影响可读性的是什么】
 *   1. 标签直接压在加色混合的星云亮区上，白字对比度不足（已由 CSS 底板解决，
 *      见 `.label` 的 background）；
 *   2. **标签之间在屏幕上重叠** —— 远的那个被近的盖住，这才是本布局下的真问题。
 *   所以这里改成：按屏幕矩形做碰撞，**远的先算**，被更近的标签压住的就降透明度。
 *   这与内部视图 `layoutInnerLabels()` 的矩形避让同源，只是 18 个标签代价极低。
 *
 * 【为什么不直接隐藏】
 *   完全隐藏会让用户失去"那边还有个社区"的线索；压暗仍可辨认，
 *   同时明确表示它在后面。它与 `updateHoverState` 算出的基础透明度是**相乘**
 *   关系（基础值存在 `item._baseLabelOpacity`），互不覆盖。
 *
 * 【压暗值取 0.42 而不是 0.22】
 *   基础透明度本身可能是 0.34（非 hover 态），0.34 × 0.22 = **0.075**——
 *   那已经不是"可辨认但靠后"，而是一层**看不清的鬼影**，反而成了视觉噪声
 *   （对抗评审实测指出）。0.42 时最暗约 0.14，叠加标签底板提供的对比度后，
 *   才既表达"在后面"又仍读得出。
 */
const OCCLUDED_LABEL_OPACITY = 0.42;
const _occDir = new THREE.Vector3();
const _occTarget = new THREE.Vector3();
function updateLabelOcclusion() {
  if (insideActive || !cloudObjects.length) return;   // 内部视图是点云，由矩形避让处理
  const boxes = [];
  for (const item of cloudObjects) {
    if (!item.label || !item.group.visible || !item.labelObject) continue;
    const wp = item.labelObject.getWorldPosition(_occTarget);
    const p = _occDir.copy(wp).project(camera);
    if (p.z > 1) continue;                            // 在相机背后
    boxes.push({
      item,
      x: (p.x * .5 + .5) * innerWidth,
      y: (-p.y * .5 + .5) * innerHeight,
      w: item.label.offsetWidth || 96,
      h: item.label.offsetHeight || 34,
      dist: camera.position.distanceTo(wp),
    });
  }
  // 远的先算：先占位的都是更近的标签，后来的若与已占位矩形相交 ⇒ 它被挡住了
  boxes.sort((a, b) => b.dist - a.dist);
  const placed = [];
  for (const b of boxes) {
    const rect = { x: b.x - b.w / 2, y: b.y - b.h / 2, w: b.w, h: b.h };
    let hit = false;
    for (const q of placed) {
      // 留一点余量，避免"擦边"也算重叠
      if (rect.x < q.x + q.w - 3 && rect.x + rect.w > q.x + 3 &&
          rect.y < q.y + q.h - 3 && rect.y + rect.h > q.y + 3) { hit = true; break; }
    }
    const f = hit ? OCCLUDED_LABEL_OPACITY : 1;
    if (!hit) placed.push(rect);
    const item = b.item;
    if (item._occFactor !== f) {
      item._occFactor = f;
      item.label.style.opacity = String((item._baseLabelOpacity == null
        ? 1 : item._baseLabelOpacity) * f);
    }
  }
}

// Each object below represents an aggregate of many real cross-topic edges.
// There is deliberately one path per cloud pair, never a visual edge per entity.
const filamentObjects = [];
function filamentProfile(strength) {
  if (strength === 'strong') return { radius: .012, opacity: .18, dustOpacity: 1.05, count: 520, spread: .22, color: '#d0d2d8', bend: 2.0 };
  if (strength === 'medium') return { radius: .007, opacity: .10, dustOpacity: .62, count: 260, spread: .14, color: '#a1a3a9', bend: 1.25 };
  return { radius: .004, opacity: .07, dustOpacity: .30, count: 100, spread: .09, color: '#82848a', bend: .85 };
}

function createFilamentDust(curve, profile, seedValue) {
  const random = seeded(seedValue);
  const positions = new Float32Array(profile.count * 3);
  const data = new Float32Array(profile.count * 2);
  for (let i = 0; i < profile.count; i++) {
    const t = random();
    const point = curve.getPoint(t);
    const tangent = curve.getTangent(t).normalize();
    const normal = new THREE.Vector3(-tangent.y, tangent.x, 0).normalize();
    const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
    const endpointDensity = .34 + .66 * Math.pow(Math.abs(t - .5) * 2, .68);
    const radius = Math.sqrt(random()) * profile.spread * (.35 + Math.sin(Math.PI * t) * .65);
    const angle = random() * Math.PI * 2;
    point.addScaledVector(normal, Math.cos(angle) * radius);
    point.addScaledVector(binormal, Math.sin(angle) * radius);
    positions.set(point.toArray(), i * 3);
    data[i * 2] = .45 + random() * 1.15;
    data[i * 2 + 1] = endpointDensity * (.52 + random() * .48);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aData', new THREE.BufferAttribute(data, 2));
  return new THREE.Points(geometry, new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(profile.color) }, uOpacity: { value: profile.dustOpacity } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `attribute vec2 aData; varying float vAlpha; void main(){ vec4 mv=modelViewMatrix*vec4(position,1.); vAlpha=aData.y; gl_PointSize=aData.x*(138./-mv.z); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `uniform vec3 uColor; uniform float uOpacity; varying float vAlpha; void main(){ float d=length(gl_PointCoord-.5); float a=exp(-d*d*13.)*vAlpha*uOpacity; gl_FragColor=vec4(uColor,a); if(a<.01) discard; }`
  }));
}

function createWovenCurve(baseCurve, profile, seedValue) {
  const random = seeded(seedValue);
  const phaseA = random() * Math.PI * 2, phaseB = random() * Math.PI * 2;
  const frequencyA = 1.2 + random() * 1.8, frequencyB = 1.7 + random() * 2.1;
  const points = [];
  for (let step = 0; step <= 12; step++) {
    const t = step / 12;
    const point = baseCurve.getPoint(t);
    const tangent = baseCurve.getTangent(t).normalize();
    const sideways = new THREE.Vector3(-tangent.y, tangent.x, 0).normalize();
    const depth = new THREE.Vector3().crossVectors(tangent, sideways).normalize();
    // The offset collapses at both ends. It lets a filament branch out inside
    // one nebula and dissolve back into the other rather than meeting at ports.
    const envelope = Math.pow(Math.sin(Math.PI * t), .72);
    const driftA = Math.sin(t * Math.PI * 2 * frequencyA + phaseA) * profile.spread * 1.7 * envelope;
    const driftB = Math.sin(t * Math.PI * 2 * frequencyB + phaseB) * profile.spread * 1.25 * envelope;
    point.addScaledVector(sideways, driftA);
    point.addScaledVector(depth, driftB);
    points.push(point);
  }
  return new THREE.CatmullRomCurve3(points, false, 'centripetal', .42);
}

function createFilament(link, index) {
  const source = cloudById.get(link.source), target = cloudById.get(link.target);
  const start = source.group.position.clone(), end = target.group.position.clone();
  const direction = end.clone().sub(start).normalize();
  start.addScaledVector(direction, source.cloud.size * .36);
  end.addScaledVector(direction, -target.cloud.size * .36);
  const midpoint = start.clone().lerp(end, .5);
  const perpendicular = new THREE.Vector3(-direction.y, direction.x, 0).normalize();
  const profile = filamentProfile(link.strength);
  midpoint.addScaledVector(perpendicular, (index % 2 ? 1 : -1) * profile.bend);
  midpoint.z += link.strength === 'strong' ? 1.05 : .52;
  const baseCurve = new THREE.QuadraticBezierCurve3(start, midpoint, end);
  const group = new THREE.Group();
  const dustMaterials = [];
  const threadCount = link.strength === 'strong' ? 4 : 3;
  for (let thread = 0; thread < threadCount; thread++) {
    const curve = createWovenCurve(baseCurve, profile, 790 + index * 47 + thread * 13);
    const threadProfile = { ...profile, count: Math.ceil(profile.count / threadCount), spread: profile.spread * .58, dustOpacity: profile.dustOpacity / threadCount * 2.15 };
    const dust = createFilamentDust(curve, threadProfile, 1100 + index * 53 + thread * 17);
    dust.material.uniforms.uOpacity.value *= .72 + thread * .09;
    dustMaterials.push(dust.material);
    group.add(dust);
  }
  group.visible = true;
  scene.add(group);
  return { link, group, dustMaterials, curve: baseCurve, profile };
}
links.forEach((link, index) => filamentObjects.push(createFilament(link, index)));

filamentObjects.forEach((item, index) => {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3));
  const particle = new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uOpacity: { value: 0 },
      uColor: { value: new THREE.Color('#ebedf3') },
    },
    vertexShader: `void main(){ gl_PointSize = 11.0;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform float uOpacity; uniform vec3 uColor;
      void main(){
        vec2 d = gl_PointCoord - .5; float r = length(d);
        if (r > .5) discard;
        float a = smoothstep(.5, .0, r);
        gl_FragColor = vec4(uColor, a * a * uOpacity);
      }`,
  }));
  particle.userData.offset = index * .173;

function isConnected(link, cloudId) {
  return link.source === cloudId || link.target === cloudId;

let insideActive = false;
function updateHoverState() {
  if (insideActive) return;
  cloudObjects.forEach((item) => {
    const active = item.cloud.id === activeCloudId;
    const related = activeCloudId && links.some(link => isConnected(link, activeCloudId) && isConnected(link, item.cloud.id));
    const factor = !activeCloudId ? 1 : active ? 1.24 : related ? .76 : .30;
    item.veils.forEach(veil => veil.material.uniforms.uOpacity.value = veil.userData.baseOpacity * factor);
    item.starField.material.opacity = .56 * factor;
    item.core.material.opacity = .64 * (active ? 1.25 : factor);
    // 记下基础透明度，而不是直接写死到 style 上：
    // updateLabelOcclusion() 要在这个基础上再乘一个"被挡住"的因子。
    item._baseLabelOpacity = factor > .5 ? 1 : .34;
    item.label.style.opacity = String(item._baseLabelOpacity * (item._occFactor || 1));
  });
  filamentObjects.forEach((item) => {
    const connected = activeCloudId && isConnected(item.link, activeCloudId);
    const factor = !activeCloudId ? 1 : connected ? 1.62 : .16;
    item.group.visible = !insideActive;
    item.dustMaterials.forEach((material, thread) => {
      material.uniforms.uOpacity.value = item.profile.dustOpacity / item.dustMaterials.length * 2.15 * (.72 + thread * .09) * factor;

    const particle = flowParticles.get(item);
    particle.visible = Boolean(connected);
  });
}

// 原文 PDF 深链（T6.2）：证据行 → 原文对应页，并**高亮那段证据**
//
// 【选型演进（三段，前两段的结论都留下了）】
//   ① 原计划的 `react-pdf-highlighter` 是 React 组件，与本项目**无构建链的
//      原生 HTML/JS 前端**不匹配（引入它等于引入一整套构建链）。
//   ② 退而用「Chrome 内置 PDF 查看器的 URL 片段」：`#page=N` 实测**生效**，
//      但 `#search=` 在无头 Chrome 下**未生效**（带与不带该参数的截图哈希完全
//      相同），有头模式又无法在本环境验证 —— 也就是"高亮"实际只做了一半。
//   ③ 最终改用 **pdf.js 自绘**：自己渲染页面、自建文本层，高亮**完全可控且可
//      断言**。文件在 `web/lib/pdfjs/`，不走 CDN（符合离线演示要求）。
//
// 【高亮怎么定位】
//   把该页所有文本 span 按顺序拼成一个字符串，并记录每个字符属于哪个 span；
//   在拼接串里 `indexOf` 证据片段，命中范围内的 span 全部加 `.hl`。
//   这样即使证据句被 pdf.js 拆成多个 span（PDF 文本层的常态），也能整句高亮。
// ══════════════════════════════════════════════════════════════
pdfjsLib.GlobalWorkerOptions.workerSrc =
  new URL('./lib/pdfjs/pdf.worker.min.mjs', location.href).href;

const pdfPane = document.getElementById('pdfPane');
const pdfCanvas = document.getElementById('pdfCanvas');
const pdfTextLayer = document.getElementById('pdfTextLayer');
const pdfView = document.getElementById('pdfView');
const pdfName = document.getElementById('pdfName');
const pdfOpenLink = document.getElementById('pdfOpen');
const pdfPageInfo = document.getElementById('pdfPageInfo');

let pdfDoc = null;            // 当前打开的 PDFDocumentProxy
let pdfSrcName = '';          // 文件名，用于判断是否需要重新加载
let pdfPageNum = 1;
let pdfSnippet = '';          // 当前要高亮的证据片段
let pdfRenderToken = 0;       // 快速翻页时防止旧渲染覆盖新页面

/** 从证据文本里挑一段适合做高亮的片段（压平空白、去掉摘要用的省略号）。 */
function pdfSearchSnippet(text) {
  const t = String(text || '')
    .replace(/[…]+$/g, '')      // 末尾省略号是摘要时加的，不在原文里
    .replace(/\s+/g, ' ')
    .trim();
  if (!t) return '';
  const cut = t.slice(0, 80);
  const sp = cut.lastIndexOf(' ');
  const s = (sp >= 30 ? cut.slice(0, sp) : cut).trim();
  return s.length >= 12 ? s : '';
}

/** 构造"在新标签用浏览器查看器打开"的兜底链接（pdf.js 渲染失败时仍有退路）。 */
function pdfHref(src, page, snippet) {
  const q = snippet ? `&search=${encodeURIComponent(snippet)}` : '';
  return new URL(`../data/corpus/${src}#page=${page}${q}`, location.href).href;
}

/** 在拼接文本里找证据片段，命中的 span 全部加 `.hl`。返回高亮的 span 数。 */
function highlightSnippet(spans, snippet) {
  const norm = (s) => String(s || '').replace(/\s+/g, ' ').toLowerCase().trim();
  const target = norm(snippet);
  if (!target) return 0;
  let full = '';
  const owner = [];                 // 每个字符属于哪个 span；-1 表示拼接用空格
  spans.forEach((el, i) => {
    const t = norm(el.textContent);
    if (!t) return;
    if (full && !full.endsWith(' ')) { full += ' '; owner.push(-1); }
    for (const ch of t) { full += ch; owner.push(i); }
  });
  const mark = (from, len) => {
    const set = new Set();
    for (let k = from; k < from + len; k++) if (owner[k] >= 0) set.add(owner[k]);
    set.forEach((i) => spans[i].classList.add('hl'));
    return set.size;
  };
  const pos = full.indexOf(target);
  if (pos >= 0) return mark(pos, target.length);
  // 退化：整句匹配不上时（PDF 文本层常有连字符与换行差异），
  // 用其中最长的词做单点定位，至少把位置指出来，而不是静默不标。
  const words = target.split(' ').filter((w) => w.length >= 6)
    .sort((a, b) => b.length - a.length);
  for (const w of words) {
    const p = full.indexOf(w);
    if (p >= 0) return mark(p, w.length);
  }
  return 0;
}

/** 渲染第 pdfPageNum 页：canvas 画内容，文本层承载高亮。 */
async function renderPdfPage() {
  if (!pdfDoc) return 0;
  const token = ++pdfRenderToken;
  const page = await pdfDoc.getPage(pdfPageNum);
  if (token !== pdfRenderToken) return 0;

  const avail = Math.max(320, pdfView.clientWidth - 28);
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min(2.2, avail / base.width);
  const viewport = page.getViewport({ scale });
  const dpr = Math.min(2, window.devicePixelRatio || 1);

  pdfCanvas.width = Math.floor(viewport.width * dpr);
  pdfCanvas.height = Math.floor(viewport.height * dpr);
  pdfCanvas.style.width = `${Math.floor(viewport.width)}px`;
  pdfCanvas.style.height = `${Math.floor(viewport.height)}px`;
  await page.render({
    canvasContext: pdfCanvas.getContext('2d'),
    viewport,
    transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null,
  }).promise;
  if (token !== pdfRenderToken) return 0;

  const content = await page.getTextContent();
  pdfTextLayer.innerHTML = '';
  pdfTextLayer.style.width = `${Math.floor(viewport.width)}px`;
  pdfTextLayer.style.height = `${Math.floor(viewport.height)}px`;
  const spans = [];
  for (const item of content.items) {
    if (!item.str) continue;
    const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
    const fh = Math.hypot(tx[2], tx[3]) || (item.height || 10) * scale;
    const el = document.createElement('span');
    el.textContent = item.str;
    el.style.left = `${tx[4].toFixed(2)}px`;
    el.style.top = `${(tx[5] - fh).toFixed(2)}px`;
    el.style.fontSize = `${fh.toFixed(2)}px`;
    pdfTextLayer.appendChild(el);
    spans.push(el);
  }

  const hits = highlightSnippet(spans, pdfSnippet);
  pdfPageInfo.textContent = `${pdfPageNum} / ${pdfDoc.numPages}`;
  if (hits) {
    const first = pdfTextLayer.querySelector('span.hl');
    if (first) pdfView.scrollTop = Math.max(0, first.offsetTop - pdfView.clientHeight / 3);
  }
  return hits;
}

async function openPdf(src, page, snippet) {
  if (!src) return;
  pdfOpenLink.href = pdfHref(src, page, snippet);
  pdfName.textContent = `${src} · 第 ${page} 页`;
  pdfPane.classList.add('open');
  detail.classList.remove('open');   // 让位给原文，避免两个右侧面板叠在一起
  pdfSnippet = snippet || '';
  pdfPageNum = Number(page) || 1;
  // 状态挂在 window 上供自动化验证读取（无头环境靠它断言高亮真的画出来了）
  try {
    if (!pdfDoc || pdfSrcName !== src) {
      pdfDoc = await pdfjsLib.getDocument(`../data/corpus/${src}`).promise;
      pdfSrcName = src;
    }
    const hits = await renderPdfPage();
    window.__pdfState = {
      src, page: pdfPageNum, pages: pdfDoc.numPages, error: null,
      spans: pdfTextLayer.querySelectorAll('span').length,
      highlights: pdfTextLayer.querySelectorAll('span.hl').length,
      snippet: pdfSnippet,
    };
  } catch (e) {
    window.__pdfState = { src, page: pdfPageNum, error: String((e && e.message) || e) };
    pdfTextLayer.innerHTML = '';
    pdfPageInfo.textContent = '加载失败';
    console.warn('PDF 加载失败：', e);
  }
}

async function pdfStep(delta) {
  if (!pdfDoc) return;
  const next = pdfPageNum + delta;
  if (next < 1 || next > pdfDoc.numPages) return;
  pdfPageNum = next;
  await renderPdfPage();
  if (window.__pdfState) {
    window.__pdfState.page = pdfPageNum;
    window.__pdfState.highlights = pdfTextLayer.querySelectorAll('span.hl').length;
  }
}

function closePdf() {
  pdfPane.classList.remove('open');
  if (pdfDoc) { try { pdfDoc.destroy(); } catch (_) { /* 释放失败无妨 */ } }
  pdfDoc = null; pdfSrcName = ''; pdfTextLayer.innerHTML = '';
  pdfPageInfo.textContent = '– / –';
}

document.getElementById('pdfClose').addEventListener('click', closePdf);
document.getElementById('pdfPrev').addEventListener('click', () => pdfStep(-1));
document.getElementById('pdfNext').addEventListener('click', () => pdfStep(1));
addEventListener('keydown', (e) => {
  if (!pdfPane.classList.contains('open')) return;
  if (!['Escape', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  // `stopImmediatePropagation()` 是**必需**的，不能只靠上面那个 class 判断。
  //
  // 机制：window 上还挂着另一个 Escape 监听器（`exitCommunity`）。
  // 监听器按注册顺序执行，本监听器先跑 `closePdf()` 把 `.open` 移除了，
  // 于是后面那个监听器再读 `pdfPane.classList.contains('open')` 时已经是 false，
  // 它照样执行 exitCommunity —— 用户被一并扔回星云概览。
  // 第一版就是这么"修"的，实测无效（pdf:true→false 的同时 inside:true→false）。
  // 阻断传播才能在事件层面表达"这个 Escape 已经被消费了"。
  e.stopImmediatePropagation();
  if (e.key === 'Escape') closePdf();
  else if (e.key === 'ArrowLeft') pdfStep(-1);
  else pdfStep(1);
});
// 事件委托：证据面板是 innerHTML 整体重建的，逐个绑监听会随重渲染失效
dbody.addEventListener('click', (e) => {
  const a = e.target.closest('.evlink');
  if (!a) return;

  openPdf(a.dataset.src, a.dataset.page, a.dataset.snip);
});

function renderInnerPreview(nodeIdx) {
  const ud = overlay.userData;
  const data = ud && ud.data;
  if (!data) return;
  const n = data.nodes[nodeIdx];
  if (!n) return;
  const cloud = clouds[inside];
  const rels = data.edges.filter(e => e[0] === n.id || e[1] === n.id)
    .map(e => ({ other: e[0] === n.id ? e[1] : e[0], type: e[2] || '—' }));
  const byType = new Map();
  rels.forEach(r => {
    if (!byType.has(r.type)) byType.set(r.type, []);
    byType.get(r.type).push(r.other);
  });
  const evs = evidenceTable && evidenceTable[n.id];
  // ── K3/G5（2026-09-15）：把这个实体**出现在哪几篇论文**说清楚 ──────────
  // 数据本来就在 `evidence-*.json` 里（每条证据带 `src`），此前只用来渲染
  // "证据出处"，**没有汇总成"跨了几篇"** —— 而"这个实体是不是只在一篇里出现过"
  // 恰好是判断它可信度的最直接线索。
  //
  // ⚠️ **判据不能用 `> 1`**：实测社区 0 的 1200 个实体里 **1108 个只跨 1 篇**、

  // **一个字都不显示** —— 而"只出现在一篇里、没被别的论文佐证"恰恰是要说的。
  const srcs = [...new Set((evs || []).map(e => String(e.src || '')))].filter(Boolean);

        + `<span class="dg">${(evs || []).filter(e => e.src === s).length} 处</span></div>`).join('')

          + ` title="在内置预览里打开该页并高亮这段证据（pdf.js 自绘，高亮可断言的）">在原文中查看 ↗</a>`
          + `</div><div class="evtext">${escHtml(e.text)}</div></div>`;
      }).join('')
    : '<div class="sec">证据出处</div>' +
      '<div class="row"><span class="nm" style="color:rgba(170,174,188,.55)">' +
      '该实体没有直接证据</span></div>';

  dbody.innerHTML =
    `<h2 style="color:${cloud ? cloud.color : '#d6d9e2'}">${escHtml(n.id)}</h2>
     <div class="sub">${escHtml(n.t || '实体')} · 社区内关联 ${rels.length} 条<br>
       ${escHtml(cloud ? cloud.name : '')}</div>
     ${srcHtml}
     ${[...byType.entries()].map(([t, list]) =>
        `<div class="sec">${escHtml(t)} · ${list.length}</div>
         ${list.map(o => `<div class="row"><span class="nm">${escHtml(o)}</span></div>`).join('')}`
      ).join('')}
     ${evHtml}
     <div class="flagbar" data-node="${escHtml(n.id)}">
       <span class="qh">这条抽取对吗</span>
       <div class="btns">
         <button type="button" data-flag="wrong_entity">实体抽错了</button>

       </div>
       <div class="msg">人工判断只**记录**，不自动改图 —— 改动图规模会让六层指标失去可比性。</div>
       <!-- K1（2026-09-16）：把"只记录"接上一个**出口** —— 提交一份改图计划。
            端点只落盘、不改图；执行交给 tools/apply_edit_plan.py
            （它会先归档 before、快照真源、改完重跑 6 个下游、再归档 after 并打 diff）。 -->
       <div class="editrow" data-edit-node="${escHtml(n.id)}">
