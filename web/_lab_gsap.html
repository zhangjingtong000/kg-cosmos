<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GSAP 接入验证 · 内部实验页</title>
<!--
  内部实验页（`_lab_` 前缀 = 既有惯例，不进 OFFICIAL 名单、不加历史横幅、不在首页入口）。
  用途：验证 GSAP 本地库（web/lib/gsap/）在**真实浏览器**里能否加载、注册、跑动画。
  这一步**不碰任何正式页面** —— 用户要求"改坏能回档"，所以先在这里验。

  页面自己报告状态：每一项用 ✅/❌ 写在 #report 里，截图即可判读。
  `window.__ready` 供 tools/cdp_shot.py 等待渲染完成。
-->
<style>
  body{margin:0;background:#070c13;color:#dce9f7;font:14px/1.7 system-ui,'Microsoft YaHei',sans-serif;padding:40px}
  h1{font-size:44px;margin:0 0 8px;letter-spacing:-.02em}
  .sub{color:#7f93a8;margin-bottom:28px}
  .box{width:120px;height:120px;border-radius:14px;background:linear-gradient(135deg,#2bd6c4,#3b82f6);margin:24px 0}
  #report{background:#0c1724;border:1px solid #1c3044;border-radius:10px;padding:16px 20px;font:13px/2 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-width:820px}
  .ok{color:#6ee7b7}.bad{color:#fca5a5}.warn{color:#fde68a}
  .line{margin-top:10px}
</style>
</head>
<body>
  <h1 id="title">GSAP 接入验证</h1>
  <div class="sub">web/lib/gsap/ · 本地化库能否在浏览器里跑起来</div>
  <div class="box" id="box"></div>
  <div id="report">检测中…</div>

  <script src="./lib/gsap/gsap.min.js"></script>
  <script src="./lib/gsap/ScrollTrigger.min.js"></script>
  <script src="./lib/gsap/SplitText.min.js"></script>
  <script src="./lib/gsap/Flip.min.js"></script>
  <script>
  (function () {
    var lines = [];
    function add(ok, label, extra) {
      lines.push((ok ? '✅ ' : '❌ ') + label + (extra ? '  ' + extra : ''));
    }

    // ① 四个文件是否都加载出全局对象
    var hasGsap = typeof window.gsap !== 'undefined';
    add(hasGsap, 'gsap 核心已加载', hasGsap ? 'version=' + window.gsap.version : '');
    var plugins = {
      ScrollTrigger: window.ScrollTrigger,
      SplitText: window.SplitText,
      Flip: window.Flip
    };
    Object.keys(plugins).forEach(function (k) {
      add(!!plugins[k], k + ' 已加载');
    });

    if (!hasGsap) {
      document.getElementById('report').textContent = lines.join('\n');
      window.__ready = true;   // 仍然置位，好让截图能拍到失败状态
      return;
    }

    // ② 插件能否注册（注册失败会抛错）
    try {
      gsap.registerPlugin(window.ScrollTrigger, window.SplitText, window.Flip);
      add(true, 'registerPlugin 成功（ScrollTrigger / SplitText / Flip）');
    } catch (e) {
      add(false, 'registerPlugin 抛错', String(e).slice(0, 80));
    }

    // ③ 跑一个能被截图看到的动画：方块旋转+变色+位移
    try {
      gsap.to('#box', { rotation: 45, x: 260, backgroundColor: '#f59e0b',
                        borderRadius: '50%', duration: 1.2, ease: 'power3.inOut' });
      add(true, 'core tween 已启动（方块 1.2s 内旋转/位移/变色）');
    } catch (e) {
      add(false, 'core tween 抛错', String(e).slice(0, 80));
    }

    // ④ SplitText 逐行拆分（首屏标题入场要用它）
    try {
      var split = SplitText.create('#title', { type: 'lines', mask: 'lines' });
      add(true, 'SplitText 拆分成功', 'lines=' + split.lines.length);
      gsap.from(split.lines, { yPercent: 110, duration: .9, stagger: .12,
                               ease: 'expo.out', delay: .3 });
    } catch (e) {
      add(false, 'SplitText 抛错', String(e).slice(0, 80));
    }

    // ⑤ ScrollTrigger 能否创建实例
    try {
      var st = ScrollTrigger.create({ trigger: '#report', start: 'top bottom' });
      add(true, 'ScrollTrigger.create 成功', 'start=' + st.start);
    } catch (e) {
      add(false, 'ScrollTrigger 抛错', String(e).slice(0, 80));
    }

    // ⑥ 时间轴（首屏编排要用它）
    try {
      var tl = gsap.timeline();
      tl.to('#report', { borderColor: '#2bd6c4', duration: .6 });
      add(true, 'gsap.timeline 可用', 'duration=' + tl.duration());
    } catch (e) {
      add(false, 'timeline 抛错', String(e).slice(0, 80));
    }

    document.getElementById('report').textContent = lines.join('\n');
    document.getElementById('report').className = 'line';

    // 等动画跑完再置 __ready，这样截图能拍到"动画真的动了"的结果
    gsap.delayedCall(1.8, function () {
      window.__ready = true;
      document.title = 'GSAP 验证完成';
    });
  })();
  </script>
</body>
</html>
