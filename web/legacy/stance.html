<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KG Cosmos · 立场聚合</title>
<!--
  L16（2026-09-17）：**立场聚合视图**（对标 Consensus `Consensus Meter`）。

  ## 立场是**数出来的**，不是问模型问出来的

  图里本来就有 `SUPPORTS` 与 `CONTRADICTS`，而
  **`source` = 谁支持/反对，`target` = 被支持/反对的那个主张**（实测确认）。
  ⇒ 立场可以直接从图上数。
  ⚠️ **口径**：页面上的 **793 / 243** 是**跳过 `source`/`target` 为空的边之后**
  的计数（`web/kg-data/stance.json` 的 `counts.suports_edges` / `contradicts_edges`）；
  `data/corpus/graphs/*.json` 里的原始条数是 **825 / 251**。
  （原写 797 —— 更早一版的读数，已作废，2026-09-21 更正。）

  **这是刻意的**：本项目有一条纪律 —— **不用 LLM 当裁判**
  （四个模型标注者对关系层的一致性 α 是**负的**，用 α 为负的裁判打分没有意义）。
  ⇒ 标签必须由**可核对的计数**得出。

  ## ⚠️ 三个必须写出来的形态（否则会被读错）

  1. **`No` 是 0 条** —— 判据要"纯反对"（O/T ≥ 0.67），
     而实测**反对最多的那几个也都至少有几条支持** ⇒ 全落进 Mixed。
     **不是"没有人反对"，而是"图里几乎没有一边倒的反对"。**
  2. **`Possibly` 占约 90%** —— 因为**大部分主张只有 1–2 条证据**。
     那正是"证据不足"该有的样子，**不是页面坏了**。
  3. **有非主张的东西混进来**（如人名 `Shirui Pan`）——
     `SUPPORTS` 的 target 不全是主张，**这是抽取噪声**
     （与 F3 里 `CITES` 的 target 混进 `Figure 2` 同类）。
     **本页不做过滤** —— 过滤需要判据，而本项目的判据被量出过 27.4% 的假阳性（B4）。
-->
<link rel="stylesheet" href="../lib/a11y.css">
<link rel="stylesheet" href="../lib/theme.css">
<link rel="stylesheet" href="../lib/design.css">
<link rel="stylesheet" href="../lib/motion.css">
<style>
  /* ══ 接入设计系统（2026-09-18）═════════════════════════════════════════
   *
   * **改之前**：这一页**没引 `design.css`**，样式写在 inline `<style>` 里 ——
   * 而那份样式是**从 `analytics.html` 复制来的** ⇒ 它自带一套 `:root`，
   * **把系统的 token 全换成了自己的**：
   *
   *     本页原来              设计系统的真值
   *     --bg   #0b0d12   →   --bg  **#02040a**
   *                          （#0b0d12 其实是系统的 `--surface #0b0e16` —— 把 surface 当 bg 用了）
   *     --fg   #dfe2e8   →   --ink **#eef3fd**
   *     --dim  #8b95a8   →   --ink-3 rgba(193,195,201,.62)
   *     --line rgba(193,195,201,.18) → --line rgba(178,180,186,.13)
   *     --warn #e8c9a4   →   --warm **#ffcfa8**
   *     --bad  #e07575   →   系统里没有"红" ⇒ 用 --clay-2
   *
   * ⇒ **结果是它比 index/ask 亮一档** —— 一眼就能看出"不是同一个站点"。
   *
   * **改法**：引 `design.css`，然后**只加一层别名映射** ——
   * 把本页的私有名指向系统的 token，**页面自己的 CSS 一行都不用改**。
   *
   * ⚠️ **方向不能反**：是"私有名 → 系统值"。
   * `analytics.html` 是反面教材 —— 它**引了** `design.css`，却又定义了一套
   * 自己的 `--bg`，**把系统覆盖掉**，所以看起来仍然是野生色。
   */
  :root{
    --fg: var(--ink);
    --dim: var(--ink-3);
    --hot: var(--accent);      /* stance.html 没有这个名，多余一行也无害 */
    --cool: var(--cyan);
    --warn: var(--warm);
    --bad: var(--clay-2);
    --yes: var(--cyan);
    --no: var(--clay-2);
    --mixed: var(--accent);
    --poss: var(--ink-3);
    /* ══ 布局基准（2026-09-19）═════════════════════════════════════════════
     *
     * **改之前**：`main` 只写了 `max-width:1240px`，**漏了 `margin:0 auto`**
     * ⇒ 整页**贴左**，1600 宽视口下右侧空 **338px**（实测 leftGap 0 / rightGap 338）。
     *
     * **改法**：① `main` 用设计系统的 `--shell-w`（1440）**并居中**；
     *   ② 页内只留**两个**宽度概念 ——
     *      · `--shell-w`：**数据类**（`#dist` / `#rows`）**铺满容器**（不设 max-width）；
     *      · `--read-w` ：**正文类**（`.sub` / `.note` / `.warnbox`）统一到**这一个值**
     *        —— 这两块原来一处 1060、一处 1060，而 `.sub` 也是 1060，
     *        但**页面里没有第二个宽度**，统一后右边界只剩一条线。
     * ⚠️ `--shell-w` 是 `lib/design.css` 的 token，**不写死 1440**。
     */
    --read-w:1060px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{padding:16px 22px 8px}
  h1{margin:0;font-size:18px;font-weight:600}
  .sub{color:var(--dim);font-size:12.5px;margin-top:5px;max-width:var(--read-w)}
  /* ══ 居中 + 用上右半空间（2026-09-19）══════════════════════════════════
   * `margin:0 auto` 是这一页最要紧的一处 —— 漏了它，`max-width` 反而**制造**
   * 了那条 338px 的空白（内容不再居中，而是全部挤在左 1240 里）。
   * ⚠️ 窄屏（视口 < 1440）下 `max-width` 不生效 ⇒ `auto` 两边各 0
   * ⇒ **行为与改前完全一致**（实测 1000 宽时 leftGap=0 / rightGap=0）。
   */
  main{padding:0 22px 60px;max-width:var(--shell-w);margin:0 auto}
  /* ══ 分布块平分整行（2026-09-19）════════════════════════════════════════
   *
   * **改之前**：`.dist` 是 `flex + wrap`，4 个 `.dchip` 各 `min-width:118px`
   * 且**不可伸缩** ⇒ 只有 4 个 chip 时它们只占左侧约 500px
   * （实测容器右边界 1218，而最后一个 chip 的右边界只有 **555**）
   * ⇒ 右侧那 660px 的空白是"看着空"而不是"真的需要"。
   *
   * **改法**：`grid-template-columns:repeat(4,1fr)` —— **4 个 chip 平分整行**。
   * ⚠️ `.dchip` 原来的 `min-width:118px` 在 grid 下会**顶住列宽不放**
   *    （grid item 的自动最小尺寸）⇒ 改为 `min-width:0`，宽度交给容器。
   * ⚠️ 与它下面的 `.warnbox` **间距保持 20px**（这里 6px + warnbox 的 14px），
   *    不挤在一起。窄屏 ≤760 退两列（4 列在 700px 下每列不到 160px，标题会折）。
   */
  .dist{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
        margin:16px 0 6px}
  .dchip{border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-width:0}
  .dchip .k{font-size:11.5px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
  .dchip .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .dchip.yes .v{color:var(--yes)} .dchip.no .v{color:var(--no)}
  .dchip.mixed .v{color:var(--mixed)} .dchip.poss .v{color:var(--poss)}
  /* 窄屏：4 列在 700px 下每列不到 160px，标签（"证据不足 · Possibly"）会折行 */
  @media (max-width:760px){.dist{grid-template-columns:repeat(2,1fr)}}
  /* ══ 紧凑化（2026-09-18）═════════════════════════════════════════════
   *
   * **改之前**：每一行占 **4 层**（`.top` 标题行 / `.meter` 进度条 / `.nums` 数字行 /
   * `details` 展开），外面还套 `border + radius + padding` ⇒ **每行 ~90px**。
   * 20 个主张 ⇒ **要滚 3343px**，而每行只承载 4 个信息
   * ⚠️ 上面这个 20 是**改版当时**的主张数（初版语料）。现在这一页是
   * **671 个主张**（见 `web/kg-data/stance.json → counts.claims_total`），
   * 所以"体积问题"比当时严重得多 —— 这条注释说的是版式决策的依据，不是现状。
   * ⇒ 那是"**卡片滥用**"的典型：**版式在模仿卡片，而内容是一条记录。**
   *
   * **改法**：把前三层**并成一行**（主张名 | 立场 | 支持 | 反对 | 合计 | 迷你条 | ▸证据）
   * ⇒ 每行 ~34px，**密度提约 2.6 倍，且列对齐后可纵向扫描**。
   *
   * **保留的**：`details` 的**可展开证据**（带论文与页码）—— 那是这一页最有价值的部分，
   * 不能为了紧凑丢掉它。它折叠时只占一行。
   *
   * ⚠️ **不要给出"表头"以外的装饰**：这一页的信息是**一条条记录**，不是"卡片"。
   */
  /* ══ 每行右端对齐（2026-09-19）═════════════════════════════════════════
   *
   * **为什么要改**：`.row` 是 `flex`，而 `.claim{flex:1 1 260px}` 是**唯一可伸缩项**
   * ⇒ 右边那一组（支持/反对/合计 · 迷你条 · ▸证据）的位置
   * 全靠"claim 长完剩下多少"，而 `.verdict` 的宽度**随标签变**
   * （`Yes` 实测 32px、`Possibly` 约 62px）⇒ 行与行之间数字的**起点会左右飘**，
   * 纵向扫下来对不成一列。
   *
   * **选 grid 而不是 `.nums{margin-left:auto}` 的理由**（两种都试算过）：
   *   `margin-left:auto` 在 flex 里**优先于 `flex-grow`** 吃掉剩余空间 ⇒
   *   `.claim` 会塌回 260px 的 basis，**长主张立刻折行、行高参差**；
   *   而 grid 的 `minmax(0,1fr)` 让 claim **照旧吸收剩余**，
   *   同时把右侧三列钉成固定宽度 ⇒ **起点恒定、右端齐平**，两头都保住。
   * ⚠️ 右三列的宽度**按实测值定**：数字组实测 150 ⇒ 给 160（余量）；
   *    迷你条本来就是 86；`summary`「看是谁支持 / 谁反对（带论文与页码）」
   *    实测 208 ⇒ 给 208（三列都是 `12px` 以内的固定文案，不会撑破）。
   * ⚠️ ≤1100 退回 flex —— 那时宽度不够，硬钉列宽会横向溢出。
   */
  .row{border-bottom:1px solid var(--line);padding:7px 2px;
       display:grid;align-items:center;gap:14px;
       grid-template-columns:minmax(0,1fr) auto 160px 86px 208px}
  @media (max-width:1100px){
    .row{display:flex;flex-wrap:wrap}
  }
  .row:hover{background:rgba(255,255,255,.022)}
  .verdict{font-size:11px;font-weight:600;border-radius:5px;padding:0 7px;
           border:1px solid currentColor;flex:0 0 auto}
  .v-Yes{color:var(--yes)} .v-No{color:var(--no)}
  .v-Mixed{color:var(--mixed)} .v-Possibly{color:var(--poss)}
  .claim{font-size:13.5px;font-weight:600;flex:1 1 260px;min-width:0}
  /* 迷你条：只表达比例，不再横贯整页 —— 满宽的条看起来像"加载进度" */
  .meter{display:flex;height:6px;width:86px;border-radius:3px;overflow:hidden;
         flex:0 0 auto;background:rgba(255,255,255,.06)}
  .meter i{display:block;height:100%}
  .meter .s{background:var(--yes)} .meter .o{background:var(--no)}
  .nums{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;
        flex:0 0 auto;min-width:150px}
  .nums b{color:var(--fg)}
  /* ⚠️ `details` 的摆位是这一页最难的一处（实测调了两次）：
   *   第一版：`details{flex:1 1 100%}` ⇒ **summary 被挤到第二行**，
   *           于是"一条记录"实际占两行 —— **紧凑化的目的当场被抵消**。
   *   现在：`summary` **留在同一行末尾**（它是这一行的"展开按钮"），
   *         而**展开后的内容**才占满整行（`details[open] ul{...}` 用块级撑开）。
   *   ⇒ **折叠时一行；展开时才变高。** 那才是"可展开的行"该有的行为。
   */
  details{flex:0 0 auto;margin:0}
  summary{color:var(--dim);font-size:11.5px;cursor:pointer;list-style:none;
          white-space:nowrap}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--ink-3)}
  details[open] summary::before{content:"▾ "}
  /* 展开的内容要**跨到下一行**（它比这一行宽得多） */
  details[open]{flex:1 1 100%;order:9}
  /* ⚠️ grid 下 `order` 管不到跨列 —— 必须显式跨满整行，
     否则展开的内容只会落在 208px 的那一列里（比这一行窄得多）。 */
  details[open]{grid-column:1 / -1}
  details[open] summary{margin-bottom:2px}
  details ul{margin:6px 0 2px;padding-left:18px}
  details li{font-size:12px;color:var(--dim);margin:1px 0}
  details li b{color:var(--fg)}
  /* ══ 底部三块（caveat / rows / foot）的间距与分组（2026-09-19）══════════
   *
   * 用户点名的"底下的这些不太好看"。**一个字都没动**，只做三件事：
   *   ① **右边界收敛**：`#dist` / `#rows` 铺满容器（数据），
   *      `.warnbox` / `.note` 用 `--read-w`（正文）—— 页码里只剩这两条线；
   *   ② **间距分两档**：块与块 14px（warnbox 的 `margin:14px 0`），
   *      正文段与上文 18px（`.note` 的 `margin-top`），不再各写各的；
   *   ③ `.note` 的 `line-height` 从 1.6 放到 **1.75** ——
   *      它是这一页最长的一段（"三个必须一起看的形态"），1.6 挤成一坨。
   */
  .note{color:var(--dim);font-size:12.5px;margin-top:18px;line-height:1.75;
        max-width:var(--read-w)}
  .note b{color:#e8c9a4}
  .warnbox{border:1px solid rgba(232,201,164,.34);background:rgba(224,164,105,.07);
           border-radius:10px;padding:11px 14px;margin:14px 0;font-size:12.5px;
           line-height:1.7;color:#e8c9a4;max-width:var(--read-w)}
  a{color:var(--yes)} code{color:#e8c9a4}
</style>
</head>
<body>
<div data-legacy-banner
     style="position:sticky;top:0;z-index:9999;background:#2a1d12;
            border-bottom:1px solid rgba(224,164,105,.55);color:#e8c9a4;
            padding:9px 16px;font:13px/1.6 -apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <b>⚠️ 这是历史版本，不是正式入口。</b>
  正式入口是 <a href="./index.html" style="color:#7cc0b6">index.html（导航页）</a>；
  本页已从 <code>web/</code> 移到 <code>web/legacy/</code> 备查，其中的数据与结论可能已经过期。
  全部历史页面见 <a href="./index.html" style="color:#7cc0b6">web/legacy/index.html</a>。
</div>

<header>
  <h1>立场聚合</h1>
  <div class="sub" id="sub">载入中…</div>
</header>
<main>
  <div class="dist" id="dist"></div>

  <div class="warnbox" id="caveat"></div>

  <div id="rows"></div>

  <!-- ★ 2026-09-20：`pagefoot` = 占满容器 + 分两栏 + 顶部细线（说明见 design.css）。
       原来只有 1060px 而容器 1396px ⇒ 右边空一大块，加上那一段本来就有三件事
       （总数 / 三个必须一起看的形态 / 链接）⇒ 挤在左下角、读起来"语无伦次"。 -->
  <p class="note inline pagefoot" id="foot"></p>
</main>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LABEL = {Yes:'支持', No:'反对', Mixed:'有争议', Possibly:'证据不足'};

function render(d) {
  const t = d.thresholds || {};
  $('#dist').innerHTML = ['Yes', 'No', 'Mixed', 'Possibly'].map(k =>
    `<div class="dchip ${k.toLowerCase()}"><div class="k">${LABEL[k]} · ${k}</div>`
    + `<div class="v">${d.distribution[k] || 0}</div></div>`).join('');

  $('#caveat').innerHTML =
    `⚠️ <b>立场是数出来的，不是问模型问出来的。</b>` +
    `判据（<b>可复算</b>）：<code>T = S + O</code>；` +
    `<code>T &lt; ${t.min_evidence}</code> ⇒ <b>Possibly</b> · ` +
    `<code>O/T ≥ ${t.mixed_ratio}</code> ⇒ <b>Mixed</b> · ` +
    `一侧 <code>≥ ${t.sided_ratio}</code> ⇒ <b>Yes / No</b>。` +
    `<br>⇒ 阈值是<b>拍的</b>，所以每一行都同时给出 <b>S / O / T</b> ——` +
    `<b>你可以不信我的标签，但你能看见我是怎么算的。</b>`;

  $('#rows').innerHTML = (d.claims || []).map(c => {
    const pctS = c.T ? (c.S / c.T * 100) : 0;
    const pctO = c.T ? (c.O / c.T * 100) : 0;
    const who = arr => (arr || []).length
      ? '<ul>' + arr.slice(0, 8).map(x =>
          `<li><b>${esc(x.who)}</b> · ${esc(x.paper)}`
          + (x.page ? ` 第 ${x.page} 页` : '') + '</li>').join('')
        + ((arr.length > 8) ? `<li>…另有 ${arr.length - 8} 条</li>` : '') + '</ul>'
      : '<ul><li>（没有）</li></ul>';
    /* 紧凑行：**主张 | 立场 | 支持 | 反对 | 合计 | 迷你条 | ▸证据**（全在一行）
       改之前是 4 层（top/meter/nums/details）⇒ 每行 ~90px、20 行要滚 3343px。
       ⚠️ 顺序刻意是"**主张名在最左**" —— 纵向扫描时读的是主张，
          而立场/数字是它的**属性**，应当在右。 */
    return `<div class="row">
      <span class="claim">${esc(c.claim)}</span>
      <span class="verdict v-${esc(c.verdict)}">${esc(c.verdict)}</span>
      <span class="nums">支持 <b>${c.S}</b> · 反对 <b>${c.O}</b> · 合计 <b>${c.T}</b></span>
      <span class="meter" title="支持 ${c.S} / 反对 ${c.O}"><i class="s" style="width:${pctS}%"></i><i class="o" style="width:${pctO}%"></i></span>
      <details><summary>看是谁支持 / 谁反对（带论文与页码）</summary>
        <b style="font-size:12px">支持方</b>${who(c.supporters)}
        <b style="font-size:12px">反对方</b>${who(c.opponents)}
      </details>
    </div>`;
  }).join('');

  $('#foot').innerHTML =
    `共 <b>${(d.counts || {}).claims_total}</b> 个主张（来自 ` +
    `<b>${(d.counts || {}).suports_edges}</b> 条 <code>SUPPORTS</code> 与 ` +
    `<b>${(d.counts || {}).contradicts_edges}</b> 条 <code>CONTRADICTS</code>）；` +
    `这里按"总证据量"取前 ${(d.claims || []).length} 个。<br>` +
    `⚠️ <b>三个必须一起看的形态</b>：` +
    `① <b>No 是 0 条</b> —— 判据要"纯反对"，而实测反对最多的那几个也都有几条支持；` +
    `② <b>Possibly 约占 90%</b> —— 因为大部分主张只有 1–2 条证据（<b>那正是"证据不足"该有的样子</b>）；` +
    `③ <b>有非主张的东西混进来</b>（如人名）—— <code>SUPPORTS</code> 的 target 不全是主张，` +
    `<b>那是抽取噪声</b>；<b>本页刻意不过滤</b>（过滤需要判据，而本项目的判据被量出过 27.4% 的假阳性）。<br>` +
    `<a href="./index.html">← 回导航页</a> · ` +
    `<a href="./paper-table.html">论文对比表</a> · ` +
    `<a href="../analytics.html">评测结论</a>`;
  window.__stanceState = { n_claims: (d.claims || []).length,
                           dist: d.distribution,
                           thresholds: d.thresholds };
}

fetch('../kg-data/stance.json').then(r => r.ok ? r.json() : null).then(d => {
  if (!d) { $('#sub').textContent = '读不到 kg-data/stance.json'; return; }
  const c = d.counts || {};
  $('#sub').innerHTML = `<b>${c.claims_total}</b> 个主张，来自 `
    + `<b>${c.suports_edges}</b> 条 <code>SUPPORTS</code> 与 `
    + `<b>${c.contradicts_edges}</b> 条 <code>CONTRADICTS</code> · `
    + `取证据量最高的 ${(d.claims || []).length} 个 · <b>立场由计数得出，不调模型</b>`;
  render(d);
  window.__stanceReady = true;
}).catch(e => { $('#sub').textContent = '载入失败：' + e.message; });
</script>
<script src="../lib/motion.js"></script>
<script src="../lib/a11y.js"></script>
</body>
