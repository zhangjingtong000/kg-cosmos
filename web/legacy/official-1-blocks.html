<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>官方 large-graph 示例（原样搬运）</title>
<!-- 与官方 example/large-graph/index.html 的唯一区别是**引入方式**与**数据来源**：
     官方用 `<script src="//cdn.jsdelivr.net/npm/3d-force-graph">`（外部 CDN），
     本项目改成**本地 UMD**，以便断网演示——`web/lib/3d-force-graph.min.js`
     就是 1.80.0 的 UMD 包，会挂出全局 `ForceGraph3D`。
     数据也从 `web/data/official-blocks.json` 取（原先指向仓库根下的
     `3d-force-graph/example/datasets/blocks.json`，而那个目录是外部克隆的
     第三方仓库、已从版本控制移除，克隆本仓库的人不会有它）。
     除此之外下面的示例代码与官方逐字一致。

     （此前这里曾改用 esm.sh 的 ESM import，注释理由是"UMD 全局变量在本地离线
       场景不可靠"——那个判断是反的：esm.sh 本身必须联网，反而把唯一的离线
       可能性去掉了。现已改回本地 UMD。） -->
<style>
  body { margin:0; background:#000; }
  #3d-graph { position:fixed; inset:0; }
</style>
<link rel="stylesheet" href="../lib/theme.css">
</head>
<body>
<div data-legacy-banner
     style="position:sticky;top:0;z-index:9999;background:#2a1d12;
            border-bottom:1px solid rgba(224,164,105,.55);color:#e8c9a4;
            padding:9px 16px;font:13px/1.6 -apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <b>⚠️ 这是历史版本，不是正式入口。</b>
  正式入口是 <a href="./index.html" style="color:#7cc0b6">index.html（导航页）</a>；
  本页已从 <code>web/</code> 移到 <code>web/legacy/</code> 备查，其中的数据与结论可能已经过期。
  全部历史页面见 <a href="./index.html" style="color:#7cc0b6">web/legacy/index.html</a>。
</div>

<div data-legacy-banner
     style="position:sticky;top:0;z-index:9999;background:#2a1d12;
            border-bottom:1px solid rgba(224,164,105,.55);color:#e8c9a4;
            padding:9px 16px;font:13px/1.6 -apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <b>⚠️ 这是历史版本，不是正式入口。</b>
  正式入口是 <a href="./index.html" style="color:#7cc0b6">index.html（导航页）</a> ——
  这一页保留下来是为了<b>备查迭代过程</b>，其中的数据与结论可能已经过期。
</div>

<div id="3d-graph"></div>
<script src="../lib/3d-force-graph.min.js"></script>
<script>
const elem = document.getElementById('3d-graph');

const Graph = new ForceGraph3D(elem)
  .jsonUrl('../data/official-blocks.json')
  .nodeAutoColorBy('user')
  .nodeLabel(node => `${node.user}: ${node.description}`)
  .onNodeClick(node => window.open(`https://bl.ocks.org/${node.user}/${node.id}`, '_blank'));
</script>
</body>
</html>
