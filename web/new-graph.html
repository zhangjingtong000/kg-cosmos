<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刚抽取的图谱 · KG Cosmos</title>
<link rel="stylesheet" href="./lib/theme.css">
<link rel="stylesheet" href="./lib/a11y.css">
<link rel="stylesheet" href="./lib/fonts/fonts.css">
<style>
/* token 与 navigation / upload / ask 逐值一致 */
:root{
  --ink:#eef3fd; --ink-2:rgba(203,218,241,.76); --ink-3:rgba(193,195,201,.62);
  --accent:#e0a469; --warm:#ffcfa8; --bg:#02040a; --line:rgba(178,180,186,.13);
  --maxw:1180px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg)}
body{color:var(--ink);
  font-family:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,
              "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,.kick{font-family:"Smiley Sans","Noto Serif SC",Georgia,serif}
#gl{position:fixed;inset:0;z-index:0;display:block}
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 120% 80% at 50% 35%,
    rgba(2,4,10,.18) 0%, rgba(2,4,10,.62) 55%, rgba(2,4,10,.9) 100%)}
.wrap{position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;padding:34px 40px 60px}
header a.brand{font-size:11px;letter-spacing:.30em;text-transform:uppercase;
  color:var(--ink-3);text-decoration:none}
.kick{display:flex;align-items:baseline;gap:14px;margin:26px 0 16px;
  font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3)}
h1{margin:0;font-size:clamp(26px,3.4vw,42px);line-height:1.1;letter-spacing:-.03em}
h1 em{font-style:normal;background:linear-gradient(96deg,var(--warm),var(--accent) 60%,#b8823f);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:14px 0 0;max-width:64ch;font-size:14px;line-height:1.8;color:var(--ink-2)}
.figs{display:flex;gap:38px;flex-wrap:wrap;margin:26px 0 0;padding:18px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fig b{display:block;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em}
.fig span{display:block;margin-top:5px;font-size:11.5px;color:var(--ink-3)}
.fig.em b{color:var(--accent)}
h2{margin:38px 0 14px;font-size:15px;letter-spacing:.02em;color:var(--ink)}
h2 i{font-style:normal;color:var(--ink-3);font-weight:400;margin-left:8px;font-size:12px}
#graph{width:100%;height:440px;display:block;border:1px solid var(--line);
  border-radius:14px;background:
    radial-gradient(120% 100% at 14% 0%, rgba(224,164,105,.07), transparent 55%),
    radial-gradient(120% 100% at 86% 100%, rgba(120,170,230,.07), transparent 55%),
    rgba(255,255,255,.015)}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0 0;font-size:11.5px;
  color:var(--ink-3)}
.legend i{display:inline-block;width:16px;height:0;border-top:1px solid currentColor;
  vertical-align:middle;margin-right:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:10px}
@media (max-width:820px){.cols{grid-template-columns:1fr}.wrap{padding:26px 22px 48px}}
ul.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.list li{display:flex;gap:12px;align-items:baseline;padding:9px 2px;
  border-bottom:1px solid var(--line);font-size:13px}
ul.list li .t{font-size:10.5px;color:var(--ink-3);min-width:74px;
  font-variant-numeric:tabular-nums}
ul.list li .n{color:var(--ink)}
ul.list li .d{margin-left:auto;font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.empty{padding:26px 2px;color:var(--ink-3);font-size:13px;line-height:1.8}
.actions{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:9px 15px;border-radius:9px;border:1px solid var(--line);
  color:var(--ink-2);text-decoration:none;font-size:12.5px;transition:border-color .3s,color .3s}
.btn:hover{border-color:rgba(224,164,105,.45);color:#fff}
footer{margin-top:34px;font-size:11px;color:var(--ink-3);padding-left:132px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div data-legacy-banner
     style="position:sticky;top:0;z-index:9999;background:#2a1d12;
            border-bottom:1px solid rgba(224,164,105,.55);color:#e8c9a4;
            padding:9px 16px;font:13px/1.6 -apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <b>⚠️ 这是历史版本，不是正式入口。</b>
  正式入口是 <a href="./index.html" style="color:#7cc0b6">index.html（导航页）</a> ——
  这一页保留下来是为了<b>备查迭代过程</b>，其中的数据与结论可能已经过期。
</div>

<canvas id="gl"></canvas>
<div id="veil"></div>

<div class="wrap">
  <header><a class="brand" href="./index.html">KG COSMOS</a></header>

  <p class="kick">刚抽取的图谱</p>
  <h1>这一篇长出了<em>这些东西</em>。</h1>
  <p class="sub" id="sub">正在读取…</p>

  <div class="figs" id="figs"></div>

  <h2>实体与关系 <i id="note"></i></h2>
  <svg id="graph" viewBox="0 0 900 440" preserveAspectRatio="xMidYMid meet"
       role="img" aria-label="本次抽取的实体与关系图"></svg>
  <div class="legend">
    <span><i style="color:#7cc0b6"></i>关系</span>
    <span><i style="color:#e0a469"></i>度数最高的实体</span>
    <span>节点大小 = 关联关系条数</span>
  </div>

  <div class="cols">
    <div><h2>实体 <i id="nN"></i></h2><ul class="list" id="nodes"></ul></div>
    <div><h2>关系 <i id="nE"></i></h2><ul class="list" id="edges"></ul></div>
  </div>

  <div class="actions">
    <a class="btn" href="./upload.html">← 再传一篇</a>
    <a class="btn" href="./kg-nebula.html">看全库主视图</a>
    <!-- 闭环的关键一环：从这里能直接对**这一篇**提问。
         此前这一页只有「再传一篇」和「看全库」，用户想提问得回导航页，
         而 ask.html 又默认问另一篇 —— 上传完最自然的那个动作（就这篇提个问）
         在界面上根本没有入口。href 由下面的脚本带上 ?src=<gid>。 -->
    <a class="btn" id="askThis" href="./ask.html">就这篇提问 →</a>
  </div>
  <footer>数据来自 <code id="srcpath">/graph/&lt;id&gt;</code><span id="modeNote"></span></footer>
</div>

<script>
/* 背景：与 navigation / upload / ask 同一套绸缎光场 */
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', {antialias:false, alpha:false, powerPreference:'low-power'});
const VS = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.0,1.0); }`;
const FS = `
precision highp float;
uniform vec2 u_res; uniform float u_t;
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<3;i++){ v+=a*noise(p); p*=2.07; a*=0.5; } return v; }
vec2 warp(vec2 p,float t){
  vec2 q=vec2(fbm(p+vec2(0.0,t)), fbm(p+vec2(5.2,1.3)-vec2(t*0.8,0.0)));
  vec2 r=vec2(fbm(p+2.2*q+vec2(1.7,9.2)+vec2(t*1.1,0.0)), fbm(p+2.2*q+vec2(8.3,2.8)-vec2(0.0,t*0.9)));
  return p+2.4*r; }
void main(){
  vec2 c=(gl_FragCoord.xy-0.5*u_res)/min(u_res.x,u_res.y);
  float t=u_t*0.018;
  vec2 g1=vec2(-0.55,0.10), g2=vec2(0.62,-0.06);
  float fib=fbm(warp(c*1.05,t));
  float l1=smoothstep(1.15,0.05,length(c-g1)+(fib-0.5)*0.55);
  float l2=smoothstep(1.15,0.02,length(c-g2)+(fib-0.5)*0.50);
  float body=smoothstep(0.34,0.78,fib);
  vec3 col=vec3(0.009,0.012,0.021);
  col+=vec3(0.11,0.42,0.50)*l1*(0.55+0.45*body);
  col+=vec3(0.74,0.52,0.28)*l2*(0.45+0.55*body);
  col+=(hash(gl_FragCoord.xy*0.7)-0.5)*0.009;
  col*=0.40+0.60*smoothstep(1.35,0.20,length(c));
  gl_FragColor=vec4(col,1.0);
}`;
function sh(t,s){ const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o); return o; }
const p=gl.createProgram();
gl.attachShader(p,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(p); gl.useProgram(p);
const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const a=gl.getAttribLocation(p,'a'); gl.enableVertexAttribArray(a);
gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
const uRes=gl.getUniformLocation(p,'u_res'), uT=gl.getUniformLocation(p,'u_t');
function size(){ const d=Math.min(1.5,devicePixelRatio||1);
  cv.width=Math.round(innerWidth*d); cv.height=Math.round(innerHeight*d);
  gl.viewport(0,0,cv.width,cv.height); }
addEventListener('resize',size); size();
const t0=performance.now();
(function loop(now){
  gl.uniform2f(uRes,cv.width,cv.height);
  gl.uniform1f(uT,(now-t0)/1000);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(loop);
})(t0);

/* ── 数据与渲染 ─────────────────────────────────────────────────────── */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const gid = new URLSearchParams(location.search).get('src');

function ring(nodes, edges, W, H) {
  /* 环形布局：按度数降序排，度数高的放外侧更容易看清；
     这是"能看"的最小实现，不假装是力导向。 */
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) / 2 - 46;
  const deg = new Map();
  nodes.forEach(n => deg.set(n.name, 0));
  edges.forEach(e => {
    if (deg.has(e.source)) deg.set(e.source, deg.get(e.source) + 1);
    if (deg.has(e.target)) deg.set(e.target, deg.get(e.target) + 1);
  });
  const sorted = [...nodes].sort((x, y) => (deg.get(y.name) || 0) - (deg.get(x.name) || 0));
  const pos = new Map();
  sorted.forEach((n, i) => {
    const ang = (i / Math.max(1, sorted.length)) * Math.PI * 2 - Math.PI / 2;
    pos.set(n.name, [cx + R * Math.cos(ang), cy + R * Math.sin(ang)]);
  });
  return { pos, deg, maxDeg: Math.max(1, ...deg.values()) };
}

function draw(data) {
  const svg = document.getElementById('graph');
  const W = 900, H = 440;
  // 节点太多时只画度数最高的一批，并**明说**截断了
  const CAP = 60;
  let nodes = data.nodes || [];
  const edges = data.edges || [];
  let truncated = 0;
  if (nodes.length > CAP) {
    const deg = new Map();
    nodes.forEach(n => deg.set(n.name, 0));
    edges.forEach(e => {
      if (deg.has(e.source)) deg.set(e.source, deg.get(e.source) + 1);
      if (deg.has(e.target)) deg.set(e.target, deg.get(e.target) + 1);
    });
    nodes = [...nodes].sort((x, y) => (deg.get(y.name) || 0) - (deg.get(x.name) || 0)).slice(0, CAP);
    truncated = (data.nodes || []).length - CAP;
  }
  const keep = new Set(nodes.map(n => n.name));
  const vis = edges.filter(e => keep.has(e.source) && keep.has(e.target));
  const { pos, deg, maxDeg } = ring(nodes, vis, W, H);

  const parts = [];
  vis.forEach(e => {
    const A = pos.get(e.source), B = pos.get(e.target);
    if (!A || !B) return;
    parts.push(`<line x1="${A[0].toFixed(1)}" y1="${A[1].toFixed(1)}" `
      + `x2="${B[0].toFixed(1)}" y2="${B[1].toFixed(1)}" `
      + `stroke="#7cc0b6" stroke-opacity=".22" stroke-width="1"/>`);
  });
  const list = [...nodes].sort((x, y) => (deg.get(y.name) || 0) - (deg.get(x.name) || 0));
  list.forEach((n, i) => {
    const P = pos.get(n.name);
    if (!P) return;
    const d = deg.get(n.name) || 0;
    const r = 3 + 7 * Math.sqrt(d / maxDeg);
    const hot = i < 3 && d > 0;
    parts.push(`<circle cx="${P[0].toFixed(1)}" cy="${P[1].toFixed(1)}" r="${r.toFixed(1)}" `
      + `fill="${hot ? '#e0a469' : '#8fa6c4'}" fill-opacity="${hot ? .95 : .7}"/>`);
    if (d >= Math.max(2, maxDeg * 0.34)) {
      parts.push(`<text x="${P[0].toFixed(1)}" y="${(P[1] - r - 5).toFixed(1)}" `
        + `text-anchor="middle" font-size="10.5" fill="#cfd8ea">${esc(n.name).slice(0, 18)}</text>`);
    }
  });
  svg.innerHTML = parts.join('');
  document.getElementById('note').textContent = truncated
    ? `画的是度数最高的 ${CAP} 个（另有 ${truncated} 个未画）`
    : `${nodes.length} 个实体全部画出`;
}

function render(data) {
  const nodes = data.nodes || [], edges = data.edges || [];
  const st = data.stats || {};
  // 如实说明走的是哪条通道 —— 不能让界面写死一句话。
  // （2026-09-14 修：原先硬编码「没有调用任何云端接口」，
  //   但 mode=cloud 跑出来的图也被这么写，属于误导。）
  const mode = data.mode || '';
  const modeText = mode === 'cloud'
    ? '。抽取走的是云端 API（本篇实测 ¥0.44 / 8.5 分钟）。'
    : mode === 'local'
      ? '。抽取走本机模型，零 API 成本。'
      : '。';
  document.getElementById('sub').textContent =
    `来自 ${data.source && data.source.name ? data.source.name : '你上传的文件'}`
    + modeText;
  document.getElementById('srcpath').textContent = `/graph/${gid}`;
  /* footer 里那句按实际通道显示 —— 此前是硬编码「抽取在当前进程内完成，
     没有调用任何云端接口」，而 mode=cloud 跑出来的图也被这么写。 */
  const mn = document.getElementById('modeNote');
  if (mn) mn.textContent = modeText;

  /* ── 闭环：把这一篇带进问答页 ─────────────────────────────────────
     上传 → 出图 → 「就这篇提问」→ ask.html?src=<gid>
     这一环此前是断的：ask.html 默认问另一篇，用户上传完最自然的动作
     （就这篇提个问）在界面上没有入口。顺手把 gid 记到 localStorage，
     让后续页面能延续「我的图」这个上下文。 */
  const at = document.getElementById('askThis');
  if (at && gid) at.href = `./ask.html?src=${encodeURIComponent(gid)}`;
  try { if (gid) localStorage.setItem('kg-last-gid', gid); } catch (e) {}

  const figs = [
    [st.pdf_pages != null ? st.pdf_pages : '—', 'PDF 页数', false],
    [st.chunks != null ? st.chunks : '—', '分块数', false],
    [nodes.length, '实体', false],
    [edges.length, '关系', true],
    [st.extraction_time_s != null ? st.extraction_time_s + 's' : '—', '抽取耗时', false],
  ];
  document.getElementById('figs').innerHTML = figs.map(([v, k, em]) =>
    `<div class="fig${em ? ' em' : ''}"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('');

  document.getElementById('nN').textContent = `${nodes.length} 个`;
  document.getElementById('nE').textContent = `${edges.length} 条`;

  const deg = new Map();
  nodes.forEach(n => deg.set(n.name, 0));
  edges.forEach(e => {
    if (deg.has(e.source)) deg.set(e.source, deg.get(e.source) + 1);
    if (deg.has(e.target)) deg.set(e.target, deg.get(e.target) + 1);
  });
  document.getElementById('nodes').innerHTML = nodes.length
    ? [...nodes].sort((a, b) => (deg.get(b.name) || 0) - (deg.get(a.name) || 0))
        .slice(0, 60).map(n => `<li><span class="t">${esc(n.type || '—')}</span>`
          + `<span class="n">${esc(n.name)}</span>`
          + `<span class="d">${deg.get(n.name) || 0} 条</span></li>`).join('')
    : '<li><span class="n" style="color:var(--ink-3)">没有抽出实体</span></li>';
  document.getElementById('edges').innerHTML = edges.length
    ? edges.slice(0, 60).map(e => `<li><span class="t">${esc(e.type || '—')}</span>`
        + `<span class="n">${esc(e.source)} → ${esc(e.target)}</span></li>`).join('')
    : '<li><span class="n" style="color:var(--ink-3)">没有抽出关系</span></li>';

  draw(data);
}

(async () => {
  if (!gid) {
    document.getElementById('sub').textContent =
      '没有指定 src 参数。本页用于查看刚上传那一篇的抽取结果，'
      + '请从上传页进入，或直接访问 ?src=<id>。';
    window.__ready = true;
    return;
  }
  try {
    const r = await fetch('./graph/' + encodeURIComponent(gid), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  } catch (e) {
    document.getElementById('sub').textContent =
      '取不到这篇的结果（' + (e && e.message ? e.message : e) + '）。'
      + '注意：上传任务的结果只保存在当前后端进程里，后端重启后会丢失。';
  }
  window.__ready = true;
})();
</script>
</body>
</html>
