<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KG Cosmos · 图谱分析面板</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(ellipse 120% 60% at 50% 0%, #0d1730 0%, #070c1a 46%, #04070f 100%);
    color: #dfe8ff; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 34px 30px 64px; line-height: 1.6;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }
  header small { display: block; color: rgba(181,203,235,.55); font-size: 11px;
                 letter-spacing: .16em; text-transform: uppercase; }
  header h1 { margin: 8px 0 0; font-size: 25px; font-weight: 560; letter-spacing: .02em; }
  .lede { margin: 12px 0 0; font-size: 12.5px; line-height: 1.85;
          color: rgba(196,214,240,.72); padding: 12px 14px; border-radius: 10px;
          background: rgba(120,160,255,.06); border-left: 2px solid rgba(120,160,255,.35); }
  .lede b { color: #cfe0ff; font-weight: 560; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
          gap: 12px; margin-top: 22px; }
  .kpi { background: rgba(10,16,34,.8); border: 1px solid rgba(140,170,255,.15);
         border-radius: 11px; padding: 13px 15px; }
  .kpi b { display: block; font-size: 22px; font-weight: 600; color: #eaf2ff;
           font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .kpi span { display: block; margin-top: 3px; font-size: 11px; color: rgba(181,203,235,.6); }
  .kpi small { display: block; margin-top: 5px; font-size: 10.5px;
               color: rgba(150,190,255,.5); }
  /* 口径对照：三套规模数字的含义解释 */
  #calibers { display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
              gap: 10px; }
  .cal { border-radius: 10px; padding: 11px 13px;
         border: 1px solid rgba(140,170,255,.14); background: rgba(10,16,34,.62); }
  .cal b { display: block; font-size: 12px; font-weight: 560; }
  .cal span { display: block; margin-top: 4px; font-size: 14px; font-weight: 600;
              color: #eaf2ff; font-variant-numeric: tabular-nums; }
  .cal small { display: block; margin-top: 5px; font-size: 10.5px; line-height: 1.7;
               color: rgba(160,190,235,.55); }
  .cal.c1 { border-color: rgba(126,203,255,.3); } .cal.c1 b { color: #a9d8ff; }
  .cal.c2 { border-color: rgba(179,255,127,.26); } .cal.c2 b { color: #cdf5a8; }
  .cal.c3 { border-color: rgba(255,217,127,.26); } .cal.c3 b { color: #f0dcae; }
  .calnote { grid-column: 1 / -1; margin-top: 2px; padding: 10px 13px;
             border-radius: 9px; font-size: 11px; line-height: 1.95;
             color: rgba(170,196,230,.68); background: rgba(140,170,255,.05);
             border: 1px solid rgba(140,170,255,.1); }
  .calnote b { color: rgba(214,230,252,.9); }
  /* L5 阈值灵敏度的小表 */
  table.sens { width: 100%; border-collapse: collapse; margin-top: 6px;
               font-size: 12px; font-variant-numeric: tabular-nums; }
  table.sens th, table.sens td { padding: 6px 10px; text-align: right;
                                 border-bottom: 1px solid rgba(140,170,255,.1); }
  table.sens th { color: rgba(181,203,235,.6); font-weight: 500; font-size: 11px; }
  table.sens td { color: #dfe8ff; }
  table.sens th:first-child, table.sens td:first-child { text-align: left; }
  /* L5 面板的 KPI 用暖色边框，与六层的常色区分开，强调"这是结论性的" */
  #l5v { display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr));
         gap: 10px; margin-bottom: 10px; }
  #l5v .kpi { border-color: rgba(255,178,127,.35); }
  #l5v .kpi b { color: #ffcfa8; }
  #l7r { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
         gap: 10px; margin-bottom: 10px; }
  #l7r .kpi { border-color: rgba(179,255,127,.28); }

  section { margin-top: 34px; }
  h2 { font-size: 14px; font-weight: 560; margin: 0 0 4px; color: #eaf2ff; }
  .sub { font-size: 11.5px; color: rgba(181,203,235,.55); margin-bottom: 14px; }

  /* ── 六层 ── */
  /* 详情放在进度条下方而不是右侧：右侧列宽有限，长句子会折行把行高撑得参差。 */
  .layer { display: grid; grid-template-columns: 132px 1fr 64px; align-items: center;
           gap: 14px; padding: 10px 0; border-bottom: 1px solid rgba(140,170,255,.08); }
  .layer:last-child { border-bottom: 0; }
  .layer .nm { font-size: 12.5px; color: rgba(214,228,250,.9); }
  .layer .nm i { display: block; font-style: normal; font-size: 10.5px;
                 color: rgba(150,190,255,.5); }
  .layer .mid { min-width: 0; }
  .track { height: 8px; border-radius: 4px; background: rgba(140,170,255,.1);
           overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 4px; transition: width .5s ease; }
  .layer .dt { margin-top: 5px; font-size: 11px; line-height: 1.5;
               color: rgba(160,196,246,.6); }
  .layer .val { text-align: right; font-size: 13.5px; font-variant-numeric: tabular-nums;
                color: rgba(214,228,250,.92); }
  .layer .val em { font-style: normal; font-size: 11px; }

  /* ── 治理对比 ── */
  .gov { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
         gap: 12px; }
  .gcard { background: rgba(10,16,34,.8); border: 1px solid rgba(140,170,255,.15);
           border-radius: 11px; padding: 14px 16px; }
  .gcard .t { font-size: 12px; color: rgba(181,203,235,.7); }
  .gcard .n { display: flex; align-items: baseline; gap: 9px; margin-top: 8px;
              font-variant-numeric: tabular-nums; }
  .gcard .b { font-size: 15px; color: rgba(170,195,230,.62); text-decoration: line-through;
              text-decoration-color: rgba(170,195,230,.3); }
  .gcard .arrow { color: rgba(150,190,255,.4); font-size: 12px; }
  .gcard .a { font-size: 22px; font-weight: 600; color: #eaf2ff; }
  .gcard .d { margin-left: auto; font-size: 13px; font-weight: 560; color: #8ce0a8; }
  .gcard .src { margin-top: 7px; font-size: 10.5px; color: rgba(150,190,255,.45); }

  /* ── 关系类型 ── */
  .bar { display: grid; grid-template-columns: 168px 1fr 58px 62px; align-items: center;
         gap: 12px; padding: 6px 0; }
  .bar .nm { font-size: 12px; color: rgba(214,228,250,.88); overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { position: relative; }
  .bar .n { text-align: right; font-size: 11.5px; font-variant-numeric: tabular-nums;
            color: rgba(181,203,235,.7); }
  .bar .r { text-align: right; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .low { color: #ffb27f; } .mid { color: #7fb3ff; } .high { color: #8ce0a8; }

  footer { margin-top: 40px; padding-top: 16px;
           border-top: 1px solid rgba(140,170,255,.1);
           font-size: 11.5px; line-height: 1.85; color: rgba(160,190,235,.5); }
  footer code { color: rgba(190,214,246,.75); }
  .err { color: #ffb27f; }
</style>
<link rel="stylesheet" href="./lib/a11y.css">
</head>
<body>
<div class="wrap">
  <header>
    <small>kg cosmos · graph analytics</small>
    <h1>图谱分析面板</h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="kpis" id="kpis"></div>

  <!-- 三套规模数字并存，必须当场解释，否则会被读成前后矛盾 -->
  <section>
    <h2>口径对照</h2>
    <div class="sub">本项目有三套并存的规模数字，含义不同、不可互相替代</div>
    <div id="calibers"></div>
  </section>

  <!-- L5 的域内效度：让"63.7% 不是质量"这个最重要的发现在面板上可见。
       不放这里，演示时屏幕上就只有一个会被误读的 63.7%。 -->
  <section id="l5vSec" hidden>
    <h2>L5 域内效度：63.7% 到底是什么</h2>
    <div class="sub" id="l5vSub"></div>
    <div id="l5v"></div>
    <div id="l5vSens"></div>
  </section>

  <!-- L7 的 role_violation 到底在说什么：58 条独立判读的归因。
       决定了论文里能不能把它写成"端点类型违规率"（实测 58.6% 是谓词问题）。 -->
  <section id="l7rSec" hidden>
    <h2>L7 角色违规归因：它到底在说什么</h2>
    <div class="sub" id="l7rSub"></div>
    <div id="l7r"></div>
  </section>

  <!-- L9 关系召回：端点召回 86.2% 看着不错，但原文明确断言的关系只有约四成进了图。
       这是比端点召回更根本的读数。 -->
  <section id="l9rSec" hidden>
    <h2>L9 关系召回：抽全了没有</h2>
    <div class="sub" id="l9rSub"></div>
    <div id="l9r"></div>
  </section>

  <section>
    <h2>六层评测</h2>
    <div class="sub" id="sixSub"></div>
    <div id="layers"></div>
  </section>

  <!-- 唯一非自洽型指标：前六层都只判"图内部是否一致"，
       回答不了"原文里的东西抽到没有"。L9 从原文段落出发回答它。 -->
  <section>
    <h2>L9 端点召回（六层之外）</h2>
    <div class="sub" id="l9Sub"></div>
    <div id="l9"></div>
  </section>

  <section>
    <h2>治理效果（同口径前后对比）</h2>
    <div class="sub" id="govSub"></div>
    <div class="gov" id="gov"></div>
  </section>

  <section>
    <h2>关系类型分布</h2>
    <div class="sub" id="typeSub"></div>
    <div id="types"></div>
  </section>

  <section>
    <h2>端点证据命中</h2>
    <div class="sub">判别器判「三元组能否被原文支持」时，两个端点在证据句里的命中情况</div>
    <div id="hits"></div>
  </section>

  <footer id="foot"></footer>
</div>

<!-- 数据加载器要先于下面的脚本加载：它是普通同步 script，
     若放在后面会先执行 KGData.kg(...) 而报 KGData is not defined。 -->
<script src="./lib/kg-api.js"></script>
<script>
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

const cls = (v) => v == null ? 'mid' : (v >= 90 ? 'high' : v >= 60 ? 'mid' : 'low');

// 质量色阶：高=绿、中=蓝、低=橙。同一套色贯穿六层与关系类型，便于横向扫读。
function hue(v) {
  if (v == null) return 'rgba(140,170,255,.55)';
  if (v >= 90) return 'linear-gradient(90deg,#4fbf82,#8ce0a8)';
  if (v >= 60) return 'linear-gradient(90deg,#4a7fd8,#7fb3ff)';
  return 'linear-gradient(90deg,#d97a45,#ffb27f)';
}

function boot(D) {
  const m = D.meta, s = D.scale;
  document.getElementById('lede').innerHTML =
    `数据来自已产出的离线结果，本页只做汇总展示，不重算模型。`
    + ` 判别器 <b>${esc(m.model)}</b>，官方校准集 ROC-AUC <b>${esc(m.model_roc_auc)}</b>，`
    + `阈值 <b>${esc(m.threshold)}</b>。`;
  document.getElementById('foot').innerHTML =
    `来源：${m.sources.map(x => `<code>${esc(x)}</code>`).join(' · ')}<br>`
    + `生成脚本 <code>${esc(m.generated_by)}</code>。`
    + ` L3 的治理效果需按图结构查端点，本面板不重算，沿用报告数字并注明来源。`;

  document.getElementById('kpis').innerHTML = [
    [s.nodes, '节点', 'web/kg-data/nebula.json'],
    [s.edges, '边', '概览层导出'],
    // 社区数有两个口径：Louvain 检出 60 个，前端只导出最大的 18 个。
    // 只显示一个数会与导航页的 18 冲突，所以两个都写。
    [s.communities, 'Louvain 社区', `导出前 ${D.community_calibers.exported_to_frontend} 个 · 另 ${s.dust} 碎片`],
    [s.modularity, '模块度', '社区结构显著'],
    [D.supported_subgraph.edges, 'L5 支持子图 · 边', `${D.supported_subgraph.nodes} 节点`],
    [D.supported_subgraph.dropped, '被 L5 筛掉', `占 ${(D.supported_subgraph.dropped / (D.supported_subgraph.edges + D.supported_subgraph.dropped) * 100).toFixed(1)}%`],
  ].map(([v, l, n]) =>
    `<div class="kpi"><b>${esc(v)}</b><span>${esc(l)}</span><small>${esc(n)}</small></div>`).join('');

  // ── 口径对照：三套数字并存必须当场解释 ──
  const cal = m.calibers || {};
  document.getElementById('calibers').innerHTML = [
    ['概览层图', cal.overview_graph, 'c1'],
    ['评测全集', cal.eval_full, 'c2'],
    ['L5 支持子集', cal.l5_supported, 'c3'],
  ].filter(([, v]) => v).map(([label, v, cls]) => {
    const nums = [v.nodes != null ? `${v.nodes} 节点` : null,
                  v.edges != null ? `${v.edges} 边` : null]
                 .filter(Boolean).join(' · ');
    return `<div class="cal ${cls}"><b>${esc(label)}</b><span>${esc(nums)}</span>`
      + `<small>${esc(v.meaning)}</small></div>`;
  }).join('')
  + `<div class="calnote">${esc(cal.note || '')}`
  + (D.community_calibers ? `<br>${esc(D.community_calibers.note)}` : '')
  + (cal.l3_extracted_caliber
      ? `<br><b>L3 特别说明</b>：L3 有两个口径，务必并列引用 —— `
        + `闭合口径含从边反建的 ${cal.l3_extracted_caliber.backfilled_nodes} 个节点，`
        + `而这些节点正是由边端点造出来的，拿它们去满足"端点在节点集内"属于定义恒等；`
        + `抽取口径只统计独立抽取出来的节点。六层区的 L3 行给了两个数。`
      : '')
  + `</div>`;

  // ── L5 域内效度：把"63.7% 不是质量"这件事摆在最显眼处 ──
  const v = D.l5_validity;
  if (v && v.ppv != null) {
    document.getElementById('l5vSec').hidden = false;
    const ag = v.annotator_agreement || {};
    const pc = (x, d) => x == null ? '—' : (x * 100).toFixed(d == null ? 1 : d) + '%';
    const ci = v.ci || {};
    const ciTxt = k => {
      const c = ci[k];
      return c ? `95%CI ${(c[0] * 100).toFixed(1)}–${(c[1] * 100).toFixed(1)}%` : '';
    };
    document.getElementById('l5vSub').innerHTML =
      `200 条分层抽样 + 独立盲判（判定者与判别器不同模型，盲态不泄漏）`
      + ` · 两个标注者一致率 <b>${pc(ag.agreement)}</b>`
      + `、Cohen's κ <b>${ag.cohen_kappa}</b>，两人独立得出相同的支持率`
      + ` <b>${pc(ag.rate_annotator1)}</b>`;

    const kpis = [
      [pc(v.true_support_rate), '全图真实支持率', ciTxt('true_support_rate') || '此前用 63.7% 通过率代替'],
      [pc(v.ppv), 'PPV（判通过里真的成立）', ciTxt('ppv') || '判通过的边约一半不被支持'],
      [v.domain_auc.toFixed(4), '域内加权 AUC', `官方校准集上是 ${v.calib_auc}`],
      [v.kappa_vs_human.toFixed(3), "与人工判定 Cohen's κ", '轻微一致'],
      [v.confusion.fp, '假阳性', `比真阳性（${v.confusion.tp}）还多`],
    ];
    document.getElementById('l5v').innerHTML = kpis.map(([a, b, c]) =>
      `<div class="kpi"><b>${esc(a)}</b><span>${esc(b)}</span><small>${esc(c)}</small></div>`
    ).join('') + `<div class="calnote">${esc(v.note)}<br><b>限度</b>：${esc(v.caveat)}</div>`;

    const sens = v.threshold_sensitivity || [];
    if (sens.length) {
      const hasPpv = sens.some(r => r.ppv != null);
      // 策略对比表：现行 pass 不是最优的，而且最优策略的 PPV 也只有 56%
      const strs = v.filter_strategies || [];
      const cov = v.filter_coverage_full || {};
      const stratTbl = strs.length ? (
        `<div class="calnote" style="margin-top:14px"><b>过滤策略对比</b>（` +
        `PPV/召回来自 200 条分层加权样本；覆盖率来自全量 ${cov.n_total} 条）</div>` +
        `<table class="sens strat"><thead><tr><th>策略</th><th>覆盖</th><th>PPV</th>` +
        `<th>召回</th><th>F1</th></tr></thead><tbody>` +
        strs.filter(s => /^[ABDEHIJ]/.test(s.name)).map(s => {
          const isBase = /^A /.test(s.name);
          const isBest = /^H /.test(s.name);
          const tag = isBase ? ' ← 现行' : (isBest ? ' ← 最优' : '');
          return `<tr${isBase ? ' style="background:rgba(255,178,127,.06)"' : ''}` +
            `${isBest ? ' style="background:rgba(179,255,127,.06)"' : ''}>` +
            `<td>${esc(s.name + tag)}</td><td>${(s.keep * 100).toFixed(1)}%</td>` +
            `<td>${(s.ppv * 100).toFixed(1)}%</td>` +
            `<td>${(s.recall * 100).toFixed(1)}%</td><td>${s.f1.toFixed(3)}</td></tr>`;
        }).join('') + `</tbody></table>` +
        (v.positioning ? `<div class="calnote"><b>定位结论</b>：${esc(v.positioning)}</div>` : '')
      ) : '';

      document.getElementById('l5vSens').innerHTML =
        `<table class="sens"><thead><tr><th>阈值</th><th>全图通过</th><th>通过率</th>`
        + (hasPpv ? `<th>PPV</th>` : '')
        + `<th>${hasPpv ? '召回' : '其中自环'}</th></tr></thead><tbody>`
        + sens.map(r => {
            const pass = r.population_pass != null ? r.population_pass : r.passed;
            const rate = r.pass_rate != null
              ? (r.pass_rate > 1 ? r.pass_rate.toFixed(1) : (r.pass_rate * 100).toFixed(1)) + '%'
              : '—';
            const col4 = hasPpv ? pc(r.ppv) : (r.selfloop != null ? r.selfloop : '—');
            const col5 = hasPpv ? pc(r.recall) : (r.rule_fp_floor_pct != null ? r.rule_fp_floor_pct + '%' : '—');
            return `<tr><td>${Number(r.threshold).toFixed(2)}</td><td>${pass}</td>`
              + `<td>${rate}</td><td>${col4}</td><td>${col5}</td></tr>`;
          }).join('')
        + `</tbody></table>`
        + `<div class="calnote">通过率随阈值下降是<b>恒等式</b>（就是"分数 ≥ 阈值"的定义），`
        + `不构成质量证据；有信息量的是 <b>PPV</b>。实测阈值 0.5→0.8 时通过率降 27.6pp`
        + `而 PPV 只升 8.8pp ⇒ <b>它是数量旋钮，不是质量旋钮</b>。<br>`
        + `另有一条独立于模型的证据：用字面规则（规范化后自环）估的假阳性下界`
        + `<b>随阈值上升</b>（0.696%→0.866%），说明<b>提阈值筛不掉这类明显错误</b>。</div>`
        + stratTbl;
    }
  }

  // ── L7 角色违规归因：58 条独立判读 ──
  const r7 = D.l7_role_audit;
  if (r7 && r7.n) {
    const pc7 = x => x == null ? '—' : (x * 100).toFixed(1) + '%';
    document.getElementById('l7rSec').hidden = false;
    document.getElementById('l7rSub').innerHTML =
      `${r7.n} 条 \`role_violation\` 样本的独立判读（固定 seed，判读口径事先写好）`;
    document.getElementById('l7r').innerHTML = [
      [pc7(r7.true_violation_rate), '真的端点类型违规', '组合确实说不通'],
      [pc7(r7.predicate_wrong_rate), '其实是谓词选错', '不是端点类型的错'],
      [pc7(r7.false_positive_rate), '约束定得太严', '假阳性 —— 越低越好'],
    ].map(([a, b, c]) =>
      `<div class="kpi"><b>${esc(a)}</b><span>${esc(b)}</span><small>${esc(c)}</small></div>`
    ).join('')
    + `<div class="calnote">${esc(r7.note || '')}<br>`
    + `<b>结论</b>：${esc(r7.conclusion || '')}</div>`;
  }

  // ── L9 关系召回：比端点召回更根本的读数 ──
  const r9 = D.l9_relation_recall;
  if (r9 && r9.recall_pair_all != null) {
    document.getElementById('l9rSec').hidden = false;
    const pcr = x => x == null ? '—' : (x * 100).toFixed(1) + '%';
    document.getElementById('l9rSub').innerHTML =
      `从固定种子的 ${r9.n_segment} 个原文段落出发，由独立判定者列出**明确断言**的关系，`
      + `再与图比对。金标 ${r9.n_gold_raw} 条，剔除端点非命名实体的 ${r9.n_dropped_non_entity} 条后`
      + `参评 <b>${r9.n_gold_entity_only}</b> 条。`;
    document.getElementById('l9r').innerHTML = [
      [pcr(r9.endpoint_recall), '端点召回（实体名抽到没有）', '看起来不错'],
      [pcr(r9.recall_pair_all), '关系召回（端点对）', '原文明确断言的关系进了图的比例'],
      [pcr(r9.recall_triple_all), '关系召回（含谓词严格）', '谓词也对的比例'],
    ].map(([a, b, c]) =>
      `<div class="kpi"><b>${esc(a)}</b><span>${esc(b)}</span><small>${esc(c)}</small></div>`
    ).join('')
    + `<div class="calnote">${esc(r9.reading || '')}<br>`
    + `<b>标注稳定性</b>：${esc(r9.stability_note || '')}<br>`
    + `<b>限度</b>：${esc(r9.caveat || '')}</div>`;
  }

  document.getElementById('sixSub').textContent =
    `全部 ${D.by_type.rows.reduce((a, r) => a + r.n, 0)} 条关系边上计算；L2 是节点级，无百分比`;

  document.getElementById('layers').innerHTML = D.six_layer.map(L => `
    <div class="layer">
      <div class="nm">${esc(L.id)} ${esc(L.name)}<i>${esc(L.basis)}</i></div>
      <div class="mid">
        <div class="track">${L.value == null ? ''
          : `<i style="width:${L.value}%;background:${hue(L.value)}"></i>`}</div>
        <div class="dt">${esc(L.detail)}</div>
      </div>
      <div class="val ${L.value == null ? '' : cls(L.value)}">
        ${L.value == null ? `<em>${esc(L.figure || '见说明')}</em>` : L.value + '%'}
      </div>
    </div>`).join('');

  // ── L9 端点召回（六层之外唯一的非自洽型指标）──
  const l9 = D.l9_recall || {};
  if (l9.endpoint_recall != null) {
    document.getElementById('l9Sub').textContent =
      `从原文段落出发、独立于抽取管线标注的操作性金标；`
      + `${l9.spans} 段、${l9.gold_entities} 个金标实体`;
    document.getElementById('l9').innerHTML = `
      <div class="layer">
        <div class="nm">L9 端点召回<i>原文段落里出现、且应当抽出的实体，有多少进了图</i></div>
        <div class="mid">
          <div class="track"><i style="width:${(l9.endpoint_recall * 100).toFixed(1)}%;background:${hue(l9.endpoint_recall * 100)}"></i></div>
          <div class="dt">命中 ${l9.matched} / ${l9.gold_entities}
            · 前六层全部是自洽型判定，回答不了"抽全了没有"，这一层回答它</div>
        </div>
        <div class="val ${cls(l9.endpoint_recall * 100)}">${(l9.endpoint_recall * 100).toFixed(1)}%</div>
      </div>
      <div class="calnote">${esc(l9.note || '')}<br><b>限度</b>：${esc(l9.limitation || '')}</div>`;
  } else {
    document.getElementById('l9Sub').textContent = '尚未产出（跑 tools/l9_recall.py）';
  }

  const g = D.governance;
  document.getElementById('govSub').textContent =
    `${g.note}；边数 ${g.edge_count.before} → ${g.edge_count.after}`;
  document.getElementById('gov').innerHTML = g.rows.map(r => `
    <div class="gcard">
      <div class="t">${esc(r.label)}</div>
      <div class="n">
        <span class="b">${r.before}%</span>
        <span class="arrow">→</span>
        <span class="a">${r.after}%</span>
        <span class="d">${r.delta > 0 ? '+' : ''}${r.delta}</span>
      </div>
      ${r.source ? `<div class="src">${esc(r.source)}</div>` : ''}
    </div>`).join('');

  document.getElementById('typeSub').innerHTML =
    `共 ${D.by_type.rows.length} 种关系类型，下面列出边数 ≥ 50 的 ${D.by_type.rows.filter(r => r.n >= 50).length} 种`
    + `（${esc(D.by_type.note)}）。通过率 = 该类中 entail_prob ≥ ${esc(D.by_type.threshold)} 的占比`;

  document.getElementById('types').innerHTML = D.by_type.rows
    .filter(r => r.n >= 50)
    .map(r => {
      const p = +(r.pass_rate * 100).toFixed(1);
      return `<div class="bar">
        <div class="nm" title="${esc(r.type)}">${esc(r.type)}</div>
        <div class="track"><i style="width:${p}%;background:${hue(p)}"></i></div>
        <div class="n">${r.n}</div>
        <div class="r ${cls(p)}">${p}%</div>
      </div>`;
    }).join('');

  const h = D.hit_distribution, tot = Object.values(h).reduce((a, b) => a + b, 0);
  const label = { both: '两端都命中', one: '仅一端命中', none: '两端都未命中' };
  const color = { both: '#8ce0a8', one: '#7fb3ff', none: '#ffb27f' };
  document.getElementById('hits').innerHTML = ['both', 'one', 'none']
    .filter(k => h[k] != null)
    .map(k => {
      const p = +(h[k] / tot * 100).toFixed(1);
      return `<div class="bar">
        <div class="nm">${esc(label[k] || k)}</div>
        <div class="track"><i style="width:${p}%;background:${color[k]}"></i></div>
        <div class="n">${h[k]}</div>
        <div class="r" style="color:${color[k]}">${p}%</div>
      </div>`;
    }).join('');

  window.__ready = true;
}

// 优先走后端 API（/api/kg/analytics.json），失败回退静态 kg-data/。
// 加载器见 web/lib/kg-api.js；本次实际走了哪条路径记在 KGData.source 里。
KGData.kg('analytics.json')
  .then(boot)
  .catch(e => {
    document.getElementById('lede').innerHTML =
      '<span class="err">数据加载失败：' + esc(e.message) + '</span>';
    window.__ready = true;
  });
</script>
<script src="./lib/a11y.js"></script>
</body>
</html>
